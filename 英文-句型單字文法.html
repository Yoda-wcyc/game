<title>英文-句型/單字/文法</title>

<style>
:root{
  --bg:#fff8ec;--card:#ffffff;--ink:#263445;--muted:#6b7785;--line:#f0e2c8;
  --pri:#ff8a3d;--pri-ink:#fff;--ok:#2fb36d;--ok-bg:#e6f8ee;--no:#e5484d;--no-bg:#fdecec;
  --c1:#ffd166;--c2:#8ad3ff;--c3:#ffadad;--c4:#b8e986;--c5:#d5b8ff;
  --r:20px;--shadow:0 4px 0 rgba(38,52,69,.08),0 8px 20px rgba(38,52,69,.06);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:20px/1.55 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
#app{max-width:980px;margin:0 auto;padding:12px 16px calc(40px + env(safe-area-inset-bottom))}
.en{font-family:"Avenir Next","Trebuchet MS",-apple-system,sans-serif;letter-spacing:.01em}
.say{cursor:pointer;text-decoration:underline dotted rgba(38,52,69,.35);text-underline-offset:4px}
.say:active{color:var(--pri)}
h1{font-size:1.5rem;margin:0}
h2{font-size:1.15rem;margin:0 0 10px}
.muted{color:var(--muted);font-size:.9rem}
.center{text-align:center}
.top{display:flex;align-items:center;gap:12px;margin:4px 0 16px;min-height:52px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:8px 18px;border:2px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);font:inherit;font-size:1rem;font-weight:600;cursor:pointer;box-shadow:0 3px 0 var(--line);touch-action:manipulation}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.45}
.btn.primary{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);box-shadow:0 3px 0 #d96a22}
.btn.danger{color:var(--no);border-color:#f5c2c3}
.btn.big{min-height:60px;font-size:1.15rem;padding:10px 26px}
.btn.wide{width:100%;margin-top:12px}
.btn.icon{min-width:52px;padding:0;font-size:1.4rem}
.btn.sound{margin-top:12px}
.row{display:flex;gap:12px;align-items:center;margin:14px 0}
.row.wrap,.wrap{display:flex;flex-wrap:wrap;gap:10px}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin:0 0 14px;box-shadow:var(--shadow);border:2px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat{background:#fff;border-radius:var(--r);padding:12px;text-align:center;box-shadow:var(--shadow);border:2px solid var(--line)}
.stat span{font-size:1.6rem;display:block}.stat b{font-size:1.8rem;display:block;line-height:1.1}.stat small{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:16px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:150px;border:0;border-radius:24px;font:inherit;color:var(--ink);cursor:pointer;box-shadow:0 5px 0 rgba(38,52,69,.15);padding:14px;touch-action:manipulation}
.tile:active{transform:translateY(3px);box-shadow:none}
.tile .ti{font-size:2.6rem}.tile b{font-size:1.4rem}.tile small{font-size:.9rem;opacity:.8}
.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}.c4{background:var(--c4)}.c5{background:var(--c5)}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px}
select{min-height:48px;font:inherit;font-size:1rem;padding:6px 12px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:10px}
.cards .card{margin:0}
.word .w{font-size:1.8rem;font-weight:700;color:#d2601a}
.word .ipa{color:var(--muted);font-size:1rem}
.pos{background:#fff2dd;border-radius:8px;padding:0 8px;font-size:.8rem}
.word .zh{font-size:1.2rem;font-weight:600;margin:4px 0}
.word .ex{font-size:1rem}.word .exzh{color:var(--muted);font-size:.9rem}
.root .rh{display:flex;align-items:center;gap:10px}.root .rh b{font-size:1.7rem;color:#2477c9}
.tag{background:#e8f4ff;color:#2477c9;border-radius:10px;padding:2px 10px;font-size:.85rem}
.root .rm{font-weight:700;margin:4px 0}
.root ul{margin:6px 0 0;padding-left:20px}.root li{margin:6px 0}.root i{color:var(--pri);font-style:normal}
.root .zh{color:var(--muted);font-size:.9rem}
.gram summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-size:1.15rem}
.rules li{margin:6px 0}
.exs div{margin:8px 0}.exs small{display:block;color:var(--muted)}
.pat .ph{font-size:1.4rem;font-weight:700;color:#7a3fd1}.pat .zh{font-weight:600}
.mod{border-bottom:1px dashed var(--line);padding:6px 0}
.mod details summary{cursor:pointer;color:var(--muted);font-size:.9rem;min-height:36px;display:flex;align-items:center}
.ck{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:4px 12px;border-radius:14px;background:#fff8ec;cursor:pointer;font-weight:600}
.ck.sm{font-weight:400;font-size:.95rem}
.ck input{width:24px;height:24px;accent-color:var(--pri)}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.pill input{position:absolute;opacity:0;pointer-events:none}
.pill span{display:inline-flex;align-items:center;min-height:48px;padding:6px 18px;border-radius:999px;border:2px solid var(--line);background:#fff;cursor:pointer;font-weight:600}
.pill input:checked+span{background:var(--pri);border-color:var(--pri);color:#fff}
.pill input:focus-visible+span{outline:3px solid #2477c9}
.bar{height:14px;background:#f3e6cf;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb347,var(--pri));border-radius:99px;transition:width .3s}
.count{text-align:center;color:var(--muted);margin:6px 0 10px}
.qcard{text-align:center;padding:22px 18px}
.qtype{display:inline-block;background:#fff2dd;color:#b45309;border-radius:99px;padding:2px 14px;font-size:.9rem;margin-bottom:10px}
.prompt{font-size:1.7rem;font-weight:700;line-height:1.35;word-break:break-word}
.prompt.en{font-size:2rem}
.sub{color:var(--muted);margin-top:8px;font-size:1.05rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts.one{grid-template-columns:1fr}
.opt{min-height:72px;border:3px solid var(--line);border-radius:18px;background:#fff;font:inherit;font-size:1.3rem;font-weight:600;color:var(--ink);cursor:pointer;padding:10px;box-shadow:0 4px 0 var(--line);touch-action:manipulation;word-break:break-word}
.opt:active{transform:translateY(2px);box-shadow:none}
.opt.right{background:var(--ok-bg);border-color:var(--ok);color:#16784a}
.opt.wrong{background:var(--no-bg);border-color:var(--no);color:#b4232a}
.opt:disabled{cursor:default}
.spell{display:flex;gap:10px}
.spell input{flex:1;min-width:0;min-height:60px;font-size:1.6rem;padding:8px 16px;border:3px solid var(--line);border-radius:16px;font-family:"Avenir Next","Trebuchet MS",sans-serif}
.spell input:focus{outline:none;border-color:var(--pri)}
.placed{min-height:76px;border:3px dashed #f1c27d;border-radius:18px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fffdf7;margin-bottom:12px}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{min-height:52px;min-width:52px;padding:6px 16px;border-radius:14px;border:2px solid #9fd0f5;background:#e8f4ff;font:inherit;font-size:1.25rem;font-weight:600;color:#1d5d99;cursor:pointer;box-shadow:0 3px 0 #9fd0f5;touch-action:manipulation;font-family:"Avenir Next","Trebuchet MS",sans-serif}
.chip.on{background:#fff;border-color:var(--pri);color:#c2410c;box-shadow:0 3px 0 #f1c27d}
.chip.used{visibility:hidden}
.fb{border-radius:var(--r);padding:16px;margin-top:14px;border:3px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.no{background:var(--no-bg);border-color:var(--no)}
.fb.skip{background:#f3f4f6;border-color:#d1d5db}
.fbh{font-size:1.5rem;font-weight:800;margin-bottom:6px}
.fb.ok .fbh{color:#16784a}.fb.no .fbh{color:#b4232a}
.why{margin-top:8px;background:rgba(255,255,255,.7);border-radius:12px;padding:8px 12px}
.result .stars{font-size:3rem;letter-spacing:6px}
.result .score{font-size:2.6rem;font-weight:800}
.list{list-style:none;padding:8px 18px;margin:0 0 14px}
.list li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.list li:last-child{border-bottom:0}
.badge{background:#eef2ff;color:#4338ca;border-radius:10px;padding:2px 10px;font-size:.8rem;white-space:nowrap}
.dots{color:var(--ok);letter-spacing:2px}
.week{display:flex;gap:8px;align-items:flex-end}
.day{flex:1;text-align:center;font-size:.85rem}
.day .col{height:120px;background:#fdf3e1;border-radius:10px;display:flex;align-items:flex-end;overflow:hidden}
.day .col i{display:block;width:100%;background:var(--pri);border-radius:10px 10px 0 0}
.day small{display:block;color:var(--muted)}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl th,.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{cursor:pointer;user-select:none;-webkit-user-select:none;background:#fff8ec;white-space:nowrap}
.btn.learn{margin-top:12px;background:var(--ok-bg);border-color:#9fe0bd;color:#16784a;box-shadow:0 3px 0 #9fe0bd}
.btn.sm{min-height:44px;padding:4px 14px;font-size:.9rem;font-weight:500}
.learned{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:12px}
.learned .done{color:#16784a;font-weight:700;font-size:1rem}
.row .learned,.row .btn.learn{margin-top:0}
.card.is-learned{border-color:#9fe0bd;background:#fbfffc}
.lfbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;margin:6px 0}
.lfbar .seg{margin:0}
.prog{margin:0;font-weight:700;color:#16784a}
.share-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 14px;margin:18px 0 8px}
@media (max-width:560px){
  body{font-size:18px}
  .tiles{grid-template-columns:1fr 1fr}
  .tile{min-height:120px}
  .prompt{font-size:1.4rem}.prompt.en{font-size:1.7rem}
  .opt{font-size:1.1rem;min-height:64px}
}
</style>
</head>

{id:"present",title:"現在簡單式（第三人稱單數加 s）",

 q:[

 {type:"fill",s:"Tom ___ milk every morning.",a:"drinks",opts:["drink","drinks","drinkes","drinking"],why:"Tom 是一個人（他），drink 要加 s。"},

 {type:"fill",s:"Look! Two dogs ___ running.",a:"are",opts:["is","are","am","was"],why:"Two dogs 是兩隻，用 are。"},
 {type:"fix",wrong:"She is sing a song now.",right:"She is singing a song now.",why:"正在做的事：is 後面的動詞要加 ing。"},

 {type:"fill",s:"We ___ basketball last week.",a:"played",opts:["play","plays","played","playing"],why:"last week 是過去，play 加 ed。"},
 {type:"fill",s:"She ___ a big fish two days ago.",a:"saw",opts:["see","sees","saw","seed"],why:"two days ago 是過去，see 的過去式是 saw。"},
 {type:"fill",s:"Did you ___ your homework?",a:"do",opts:["do","did","does","done"],why:"Did 已經表示過去了，後面的動詞用原形 do。"},

 {type:"fill",s:"The ___ are sleeping.",a:"babies",opts:["baby","babys","babies","babyes"],why:"baby 是子音 b＋y 結尾，去 y 加 ies。"},

{id:"article",title:"冠詞 a / an / the",

 {type:"fill",s:"This is ___ orange.",a:"an",opts:["a","an","two","many"],why:"orange 是母音 o 開頭，用 an。"},

{id:"pronoun",title:"代名詞：主格、受格、所有格",

{id:"compare",title:"比較級和最高級",

<script>
/* engine.js — 題目引擎（不碰 DOM；瀏覽器與 Node 都能用） */
(function (root) {
  'use strict';
  const TAGS = { animal: '動物', food: '食物', color: '顏色', number: '數字', family: '家人', school: '學校', body: '身體', weather: '天氣', place: '地方', time: '時間', verb: '動作', adj: '形容詞' };
  const ROOT_T = { prefix: '字首', suffix: '字尾', root: '字根' };
  const MODULES = { words: '單字', roots: '字根字首', grammar: '文法', patterns: '句型' };
  const TYPES = { 'listen-choose': '聽音選字', zh2en: '看中文選英文', en2zh: '看英文選中文', spell: '聽寫拼字', 'root-meaning': '字首字尾的意思', 'root-word': '用字根組單字', 'grammar-fill': '文法填空', 'grammar-fix': '挑出正確的句子', reorder: '句子重組', speak: '開口說說看' };
  const MOD_TYPES = { words: ['listen-choose', 'zh2en', 'en2zh', 'spell'], roots: ['root-meaning', 'root-word'], grammar: ['grammar-fill', 'grammar-fix', 'reorder', 'speak'], patterns: ['reorder', 'speak'] };
  const SRC_LABEL = { moe: '教育部基本字彙' };

  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function norm(s) { return String(s == null ? '' : s).trim().toLowerCase().replace(/[’‘]/g, "'").replace(/\s+/g, ' '); }
  function tokens(s) { return norm(s).replace(/[^a-z0-9' ]/g, ' ').split(' ').filter(Boolean); }
  function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
  function fillBlank(s, a) { return s.replace(/_{2,}/, a); }
  // 從分層候選裡挑 n 個不重複、也不等於答案的干擾選項
  function distract(answer, tiers, n) {
    const out = [], seen = new Set([answer]);
    for (const tier of tiers) {
      for (const v of shuffle(tier)) { if (out.length >= n) return out; if (v != null && v !== '' && !seen.has(v)) { seen.add(v); out.push(v); } }
    }
    return out;
  }
  function choice(answer, tiers) { return shuffle([answer].concat(distract(answer, tiers, 3))); }
  function chips(sentence) {
    const t = sentence.trim().split(/\s+/);
    if (t.length < 2) return t;
    let s, k = 0;
    do { s = shuffle(t); k++; } while (s.join(' ') === t.join(' ') && k < 20);
    return s;
  }

  // ---- 學會紀錄（純函式）----
  const TPE = {};
  function fmtTaipei(iso, full) {
    if (!iso) return '';
    const d = new Date(iso); if (isNaN(d)) return '';
    const f = TPE.f || (TPE.f = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }));
    const p = {}; f.formatToParts(d).forEach(x => { p[x.type] = x.value; });
    return full ? `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute}:${p.second}` : `${p.month}/${p.day} ${p.hour}:${p.minute}`;
  }
  // 學會紀錄 {itemId:{at}}：回傳新物件，不改原本的
  function setLearned(L, itemId, iso) { const o = Object.assign({}, L); o[itemId] = { at: iso }; return o; }
  function unsetLearned(L, itemId) { const o = Object.assign({}, L); delete o[itemId]; return o; }
  const wordItemId = w => 'word:' + slug(w.w), patternItemId = p => 'pattern:' + p.id, grammarItemId = g => 'grammar:' + g.id, rootItemId = r => 'root:' + slug(r.p);

  function Engine(data) {
    const D = this.D = { words: data.words || [], roots: data.roots || [], grammar: data.grammar || [], patterns: data.patterns || [] };
    this.meta = []; this.byId = {};
    const add = (m, make) => { m.tkey = m.module + ':' + m.topic; m.make = () => Object.assign({ id: m.id, module: m.module, topic: m.topic, tkey: m.tkey, type: m.type, title: m.title, why: '' }, make()); this.meta.push(m); this.byId[m.id] = m; };

    // ---- 單字 ----
    D.words.forEach(w => {
      const topic = (w.tags && w.tags[0]) || 'other', key = slug(w.w);
      const tiers = f => {
        const lv = D.words.filter(x => x !== w && x.lv === w.lv);
        return [lv.filter(x => (x.tags || []).some(t => (w.tags || []).includes(t))).map(f), lv.filter(x => x.pos === w.pos).map(f), lv.map(f), D.words.filter(x => x !== w).map(f)];
      };
      const why = `${w.w} ${w.ipa || ''} ＝ ${w.zh}`;
      const base = { module: 'words', topic, lv: w.lv, src: w.src || 'moe', title: `${w.w}　${w.zh}` };
      add(Object.assign({ id: `w:${key}:listen`, type: 'listen-choose' }, base), () => ({ prompt: '聽聽看，是哪一個字？', options: choice(w.w, tiers(x => x.w)), answer: w.w, speakText: w.w, auto: true, play: true, why }));
      add(Object.assign({ id: `w:${key}:zh2en`, type: 'zh2en' }, base), () => ({ prompt: w.zh, options: choice(w.w, tiers(x => x.w)), answer: w.w, speakText: w.w, why }));
      add(Object.assign({ id: `w:${key}:en2zh`, type: 'en2zh' }, base), () => ({ prompt: w.w, en: true, play: true, options: choice(w.zh, tiers(x => x.zh)), answer: w.zh, speakText: w.w, why }));
      add(Object.assign({ id: `w:${key}:spell`, type: 'spell' }, base), () => ({ prompt: '聽寫：把聽到的字拼出來', sub: `提示：${w.zh}（${w.w.length} 個字母）`, input: 'text', options: null, answer: w.w, speakText: w.w, auto: true, play: true, why }));
    });

    // ---- 字根字首 ----
    D.roots.forEach(r => {
      const ex = r.words[0];
      add({ id: `r:${slug(r.p)}:meaning`, module: 'roots', topic: r.t, type: 'root-meaning', title: `${r.p}　${r.m}` }, () => ({
        prompt: `${r.p} 是什麼意思？`, sub: r.words.map(x => x.w).join(', '), subEn: true,
        options: choice(r.m, [D.roots.filter(x => x !== r && x.t === r.t).map(x => x.m), D.roots.filter(x => x !== r).map(x => x.m)]),
        answer: r.m, speakText: ex.w, why: `${r.p} ＝ ${r.m}。例：${ex.parts.join(' + ')} ＝ ${ex.w}（${ex.zh}）`
      }));
      r.words.forEach(w => {
        add({ id: `r:${slug(w.w)}:word`, module: 'roots', topic: r.t, type: 'root-word', title: `${w.w}　${w.zh}` }, () => ({
          prompt: `「${w.zh}」英文怎麼說？`, sub: `提示：${r.p}（${r.m}）`,
          options: choice(w.w, [r.words.filter(x => x !== w).map(x => x.w), D.roots.filter(x => x !== r && x.t === r.t).flatMap(x => x.words.map(y => y.w)), D.roots.flatMap(x => x.words.map(y => y.w))]),
          answer: w.w, speakText: w.w, why: `${w.parts.join(' + ')} ＝ ${w.w}（${r.p} ＝ ${r.m}）`
        }));
      });
    });

    // ---- 句子題：文法例句與句型例句共用 ----
    const sentenceQs = (module, topic, idBase, e, why) => {
      add({ id: `${idBase}:reorder`, module, topic, type: 'reorder', title: e.en }, () => ({ prompt: e.zh, sub: '把字卡排成正確的英文句子', input: 'chips', options: chips(e.en), answer: e.en, speakText: e.en, why }));
      add({ id: `${idBase}:speak`, module, topic, type: 'speak', title: e.en }, () => ({ prompt: e.en, en: true, sub: e.zh, input: 'mic', play: true, options: null, answer: e.en, speakText: e.en, why }));
    };

    // ---- 文法 ----
    D.grammar.forEach(g => {
      g.q.forEach((q, i) => {
        const id = `g:${g.id}:${i}`;
        if (q.type === 'fill') add({ id, module: 'grammar', topic: g.id, type: 'grammar-fill', title: fillBlank(q.s, q.a) }, () => ({ prompt: q.s, options: shuffle(q.opts), answer: q.a, speakText: fillBlank(q.s, q.a), why: q.why }));
        else add({ id, module: 'grammar', topic: g.id, type: 'grammar-fix', title: q.right }, () => ({ prompt: '哪一句是對的？', options: shuffle([q.wrong, q.right]), answer: q.right, speakText: q.right, why: q.why }));
      });
      g.ex.forEach((e, j) => sentenceQs('grammar', g.id, `g:${g.id}:ex${j}`, e, `文法：${g.title}`));
    });

    // ---- 句型 ----
    D.patterns.forEach(p => p.ex.forEach((e, j) => sentenceQs('patterns', p.id, `p:${p.id}:${j}`, e, `句型：${p.pattern}（${p.zh}）`)));
  }

  Engine.prototype = {
    get(id) { const m = this.byId[id]; return m ? m.make() : null; },
    sources() { return [...new Set(this.D.words.map(w => w.src || 'moe'))]; },
    topics(module) {
      if (module === 'words') { const s = []; this.D.words.forEach(w => { const t = (w.tags && w.tags[0]) || 'other'; if (!s.includes(t)) s.push(t); }); return s.map(t => ({ key: 'words:' + t, label: TAGS[t] || t })); }
      if (module === 'roots') return Object.keys(ROOT_T).map(t => ({ key: 'roots:' + t, label: ROOT_T[t] }));
      if (module === 'grammar') return this.D.grammar.map(g => ({ key: 'grammar:' + g.id, label: g.title }));
      if (module === 'patterns') return this.D.patterns.map(p => ({ key: 'patterns:' + p.id, label: p.pattern }));
      return [];
    },
    // 學會紀錄的項目資訊：word:apple → {item:'apple', type:'單字'}
    itemInfo(itemId) {
      const w = this.D.words.find(x => wordItemId(x) === itemId); if (w) return { item: w.w, zh: w.zh, type: '單字' };
      const p = this.D.patterns.find(x => patternItemId(x) === itemId); if (p) return { item: p.pattern, zh: p.zh, type: '句型' };
      const g = this.D.grammar.find(x => grammarItemId(x) === itemId); if (g) return { item: g.title, zh: '', type: '文法' };
      const r = this.D.roots.find(x => rootItemId(x) === itemId); if (r) return { item: r.p, zh: r.m, type: '字根' };
      return { item: itemId, zh: '', type: '' };
    },
    // 家長頁用：學會紀錄表，預設新到舊
    learnedRows(L) { return Object.keys(L || {}).filter(id => L[id] && L[id].at).map(id => Object.assign({ itemId: id, at: L[id].at }, this.itemInfo(id))).sort((a, b) => (a.at < b.at ? 1 : a.at > b.at ? -1 : 0)); },
    topicLabel(tkey) { const m = tkey.split(':')[0]; const t = this.topics(m).find(x => x.key === tkey); return t ? t.label : tkey; },
    // f: {modules, topics(tkey 陣列), types, src, lv, allowSpeak, ids}
    list(f) {
      f = f || {};
      const src = f.src && f.src.length ? [].concat(f.src) : null;
      return this.meta.filter(m => (!f.ids || f.ids.includes(m.id)) && (!f.modules || f.modules.includes(m.module)) && (!f.topics || f.topics.includes(m.tkey)) &&
        (!f.types || f.types.includes(m.type)) && (f.allowSpeak || m.type !== 'speak') &&
        (m.module !== 'words' || ((!src || src.includes(m.src)) && (!f.lv || String(m.lv) === String(f.lv)))));
    },
    // cfg: list 的條件 + count, mistakeRatio(0~1；1 = 只練錯題), mistakes(錯題 id 陣列)
    buildQuiz(cfg) {
      cfg = cfg || {};
      const count = cfg.count || 10, ratio = cfg.mistakeRatio || 0, mset = new Set(cfg.mistakes || []);
      const pool = this.list(cfg);
      let mpool = pool.filter(m => mset.has(m.id));
      if (ratio >= 1 && !mpool.length) mpool = [...mset].map(id => this.byId[id]).filter(m => m && (cfg.allowSpeak || m.type !== 'speak'));
      const nm = ratio >= 1 ? Math.min(count, mpool.length) : Math.min(Math.round(count * ratio), mpool.length);
      let chosen = shuffle(mpool).slice(0, nm);
      if (ratio < 1) {
        // 依「單元＋題型」分組輪流抽，避免單字題淹沒其他題型
        const taken = new Set(chosen.map(m => m.id)), groups = {};
        pool.forEach(m => { if (!taken.has(m.id)) (groups[m.module + '|' + m.type] = groups[m.module + '|' + m.type] || []).push(m); });
        const gs = shuffle(Object.values(groups).map(shuffle));
        while (chosen.length < count && gs.some(g => g.length)) gs.forEach(g => { if (g.length && chosen.length < count) chosen.push(g.pop()); });
      }
      return shuffle(chosen).map(m => m.make());
    },
    check(q, input) {
      if (q.type === 'speak') {
        const a = tokens(q.answer), have = {};
        tokens(input).forEach(x => { have[x] = (have[x] || 0) + 1; });
        let hit = 0;
        a.forEach(x => { if (have[x]) { hit++; have[x]--; } });
        const score = a.length ? hit / a.length : 0;
        return { ok: score >= 0.7, score };
      }
      if (q.type === 'spell' || q.type === 'reorder') return { ok: norm(input) === norm(q.answer) };
      return { ok: input === q.answer };
    }
  };

  const KE = { Engine, TAGS, ROOT_T, MODULES, TYPES, MOD_TYPES, SRC_LABEL, shuffle, norm, tokens, fillBlank, fmtTaipei, setLearned, unsetLearned, wordItemId, patternItemId, grammarItemId, rootItemId, slug };
  if (typeof module !== 'undefined' && module.exports) module.exports = KE;
  root.KE = KE;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* app.js — 畫面、路由、儲存、語音 */
(function () {
  'use strict';
  const D = { words: window.DATA_WORDS || [], roots: window.DATA_ROOTS || [], grammar: window.DATA_GRAMMAR || [], patterns: window.DATA_PATTERNS || [] };
  const E = new KE.Engine(D);
  const app = document.getElementById('app');
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const srcLabel = s => KE.SRC_LABEL[s] || s;

  // ---------- 儲存 ----------
  function load(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 空間不足或私密模式 */ } }
  const KEYS = ['ke_progress', 'ke_mistakes', 'ke_settings', 'ke_log', 'ke_learned'];
  let S;
  function loadAll() {
    S = { progress: load('ke_progress', {}), mistakes: load('ke_mistakes', {}), settings: load('ke_settings', {}), log: load('ke_log', []), learned: load('ke_learned', {}) };
    if (!S.learned || typeof S.learned !== 'object' || Array.isArray(S.learned)) S.learned = {};
    S.progress = Object.assign({ stars: 0, quizzes: 0 }, S.progress);
    S.settings = Object.assign({ rate: 1, accent: 'en-US', last: null }, S.settings);
    if (!Array.isArray(S.log)) S.log = [];
    if (!S.mistakes || typeof S.mistakes !== 'object') S.mistakes = {};
  }
  loadAll();

  // ---------- 語音 ----------
  const synth = window.speechSynthesis;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const canSpeak = !!SR;
  let voices = [], unlocked = false;
  function loadVoices() { try { voices = synth ? synth.getVoices() : []; } catch (e) { voices = []; } }
  if (synth) { loadVoices(); try { synth.addEventListener('voiceschanged', loadVoices); } catch (e) { synth.onvoiceschanged = loadVoices; } }
  function pickVoice() {
    const acc = S.settings.accent.toLowerCase(), pref = /Samantha|Ava|Natural|Jenny|Aria|Google|Daniel|Serena|Kate|Libby|Sonia/i;
    let c = voices.filter(v => (v.lang || '').replace('_', '-').toLowerCase() === acc);
    if (!c.length) c = voices.filter(v => /^en/i.test(v.lang || ''));
    return c.find(v => pref.test(v.name)) || c[0] || null;
  }
  function speak(text) {
    if (!synth || !text) return;
    try {
      unlocked = true;
      const busy = synth.speaking || synth.pending;
      synth.cancel();
      const u = new SpeechSynthesisUtterance(text), v = pickVoice();
      if (v) u.voice = v;
      u.lang = v ? v.lang : S.settings.accent;
      u.rate = +S.settings.rate || 1;
      if (busy) setTimeout(() => synth.speak(u), 80); else synth.speak(u);
    } catch (e) { /* 不支援就安靜 */ }
  }
  // iOS 要使用者手勢才能出聲：第一次點擊時先唸一個空字串解鎖
  document.addEventListener('click', () => { if (unlocked || !synth) return; unlocked = true; try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; synth.speak(u); } catch (e) { } });

  // ---------- 紀錄與錯題 ----------
  function record(q, ok) {
    S.log.push({ t: Date.now(), id: q.id, m: q.module, k: q.tkey, y: q.type, ok: ok ? 1 : 0 });
    if (S.log.length > 5000) S.log = S.log.slice(-5000);
    save('ke_log', S.log);
    const m = S.mistakes;
    if (!ok) m[q.id] = { c: 0, w: ((m[q.id] || {}).w || 0) + 1, t: Date.now() };
    else if (m[q.id]) { m[q.id].c++; if (m[q.id].c >= 3) { delete m[q.id]; Q.graduated++; } }
    save('ke_mistakes', m);
  }
  function stats() {
    const days = new Set(S.log.map(l => ymd(new Date(l.t)))), t = ymd(new Date()), d = new Date();
    let streak = 0;
    if (!days.has(t)) d.setDate(d.getDate() - 1);
    while (days.has(ymd(d))) { streak++; d.setDate(d.getDate() - 1); }
    return { streak, today: S.log.filter(l => ymd(new Date(l.t)) === t).length };
  }
  const mistakeIds = () => Object.keys(S.mistakes).filter(id => E.byId[id] && (canSpeak || E.byId[id].type !== 'speak'));

  // ---------- 路由 ----------
  let rendered = '', Q = null, redraw = null;
  function go(h) { if (location.hash !== h) location.hash = h; render(); }
  window.addEventListener('hashchange', () => { if (location.hash !== rendered) render(); });
  function render() {
    const h = location.hash || '#home'; rendered = h; redraw = null;
    const [p, sub] = h.slice(1).split('/');
    const pages = { home: pHome, learn: pLearn, practice: pPractice, quiz: pQuiz, result: pResult, mistakes: pMistakes, bank: pBank, parent: pParent };
    (pages[p] || pHome)(sub);
    window.scrollTo(0, 0);
  }
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-go]');
    if (g) { e.preventDefault(); go(g.dataset.go); return; }
    const lb = e.target.closest('[data-learn],[data-unlearn]');
    if (lb) {
      e.preventDefault();
      if (lb.dataset.learn) S.learned = KE.setLearned(S.learned, lb.dataset.learn, new Date().toISOString());
      else { if (!confirm('確定要取消「已學會」嗎？')) return; S.learned = KE.unsetLearned(S.learned, lb.dataset.unlearn); }
      save('ke_learned', S.learned);
      if (redraw) redraw();
      return;
    }
    if (e.target.closest('[data-share]')) { share(e.target.closest('[data-share]')); return; }
    const s = e.target.closest('.say');
    if (s) speak(s.dataset.say || s.textContent);
  });

  // ---------- 共用 UI ----------
  const top = (title, back) => `<header class="top">${back === false ? '' : `<button class="btn icon" data-go="${back || '#home'}" aria-label="回上一頁">${back && back !== '#home' ? '⬅️' : '🏠'}</button>`}<h1>${title}</h1></header>`;
  const tile = (go, icon, name, desc, cls) => `<button class="tile ${cls}" data-go="${go}"><span class="ti">${icon}</span><b>${name}</b><small>${desc}</small></button>`;
  const radios = (name, opts, cur) => `<div class="seg">${opts.map(([v, t]) => `<label class="pill"><input type="radio" name="${name}" value="${esc(v)}" ${String(v) === String(cur) ? 'checked' : ''}><span>${esc(t)}</span></label>`).join('')}</div>`;
  const val = name => { const el = $(`input[name="${name}"]:checked`); return el ? el.value : ''; };
  const vals = name => $$(`input[name="${name}"]`).filter(x => x.checked).map(x => x.value);
  const voiceCard = () => `<section class="card"><h2>🔊 語音設定</h2>${radios('rate', [['0.7', '🐢 慢慢唸'], ['1', '🐇 正常速度']], S.settings.rate)}${radios('accent', [['en-US', '🇺🇸 美式'], ['en-GB', '🇬🇧 英式']], S.settings.accent)}<button class="btn" id="tryv">試聽：<span class="en">Hello! How are you?</span></button>${synth ? '' : '<p class="muted">這個瀏覽器不支援唸英文。</p>'}</section>`;
  function bindVoice() {
    $$('input[name="rate"],input[name="accent"]').forEach(el => el.onchange = () => { S.settings.rate = +val('rate') || 1; S.settings.accent = val('accent') || 'en-US'; save('ke_settings', S.settings); });
    const t = $('#tryv'); if (t) t.onclick = () => speak('Hello! How are you?');
  }
  // ---------- 學會了 ----------
  const LS = { words: '', roots: '', grammar: '', patterns: '' };
  const isL = id => !!(S.learned[id] && S.learned[id].at);
  const lfPass = (page, id) => !LS[page] || (LS[page] === 'yes') === isL(id);
  const learnUI = id => isL(id) ? `<div class="learned"><span class="done">✅ 已學會 ${esc(KE.fmtTaipei(S.learned[id].at))}</span><button class="btn sm" data-unlearn="${esc(id)}">取消</button></div>` : `<button class="btn learn" data-learn="${esc(id)}">👍 學會了</button>`;
  const lfBar = page => `<div class="lfbar">${radios('lf-' + page, [['', '全部'], ['yes', '已學會'], ['no', '未學會']], LS[page])}<p class="prog" id="prog"></p></div>`;
  function bindLf(page, label, ids, draw) {
    const full = () => { $('#prog').textContent = `${label} ${ids.filter(isL).length}/${ids.length} 已學會`; draw(); };
    $$(`input[name="lf-${page}"]`).forEach(el => el.onchange = () => { LS[page] = el.value; full(); });
    redraw = full; full();
  }

  // ---------- 分享（網址固定用遊戲庫正式網址）----------
  const SHARE = { title: '英文-句型/單字/文法', text: '單字、字根、文法、句型：聽、選、拼、排句子一起練英文', url: 'https://yoda-wcyc.github.io/game/' + encodeURIComponent('英文-句型單字文法.html') };
  const shareRow = () => `<div class="share-row"><button class="btn share" data-share>🔗 分享這個網站</button><span class="share-msg muted" role="status" aria-live="polite"></span></div>`;
  function share(b) {
    const msg = b.parentNode.querySelector('.share-msg'), say = t => { if (msg) msg.textContent = t; };
    const copy = () => {
      const done = () => say('已複製連結 ✓ 可以貼給朋友了');
      const legacy = () => {
        const ta = document.createElement('textarea'); let ok = false;
        ta.value = SHARE.url; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
        document.body.appendChild(ta); ta.select();
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        ta.remove();
        if (ok) done(); else say('沒辦法自動複製，請長按複製這個網址：' + SHARE.url);
      };
      try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(SHARE.url).then(done, legacy); return; } } catch (e) { }
      legacy();
    };
    say('');
    if (!navigator.share) return copy();
    try { Promise.resolve(navigator.share({ title: SHARE.title, text: SHARE.text, url: SHARE.url })).catch(err => { if (!err || err.name !== 'AbortError') copy(); }); } catch (e) { copy(); }
  }

  function startQuiz(cfg) {
    const list = cfg.ids ? KE.shuffle(cfg.ids).slice(0, cfg.count || 30).map(id => E.get(id)).filter(Boolean) : E.buildQuiz(cfg);

    go('#quiz');
  }

  function pWords() {
    const srcs = E.sources(), tags = [...new Set(D.words.flatMap(w => w.tags || []))];
    app.innerHTML = top('單字卡', '#learn') + `<div class="filters">
      <select id="flv" aria-label="等級"><option value="">全部等級</option><option value="1">等級 1</option><option value="2">等級 2</option></select>
      <select id="ftag" aria-label="主題"><option value="">全部主題</option>${tags.map(t => `<option value="${esc(t)}">${esc(KE.TAGS[t] || t)}</option>`).join('')}</select>
      ${srcs.length > 1 ? `<select id="fsrc" aria-label="來源"><option value="">全部來源</option>${srcs.map(s => `<option value="${esc(s)}">${esc(srcLabel(s))}</option>`).join('')}</select>` : ''}
      <button class="btn primary" id="pw">🎯 練這些字</button></div>${lfBar('words')}<p class="muted" id="wn"></p><div class="cards" id="wl"></div>`;
    const pick = () => D.words.filter(w => (!LF.lv || String(w.lv) === LF.lv) && (!LF.tag || (w.tags || []).includes(LF.tag)) && (!LF.src || (w.src || 'moe') === LF.src) && lfPass('words', KE.wordItemId(w)));

    $('#pw').onclick = () => { const ids = pick().flatMap(w => ['listen', 'zh2en', 'en2zh', 'spell'].map(t => `w:${KE.slug(w.w)}:${t}`)); startQuiz({ ids, count: 10 }); };
    bindLf('words', '單字', D.words.map(KE.wordItemId), draw);

  function pRoots() {
    app.innerHTML = top('字根字首', '#learn') + `<p class="muted">把長長的單字拆開，就像拼樂高一樣！</p><button class="btn primary" data-act="pr">🎯 練字根字首</button>${lfBar('roots')}<div class="cards" id="rl"></div>`;
    const draw = () => {
      $('#rl').innerHTML = D.roots.filter(r => lfPass('roots', KE.rootItemId(r))).map(r => `<div class="card root ${isL(KE.rootItemId(r)) ? 'is-learned' : ''}"><div class="rh"><b class="en">${esc(r.p)}</b><span class="tag">${KE.ROOT_T[r.t]}</span></div><div class="rm">＝ ${esc(r.m)}</div><ul>${r.words.map(w => `<li><span class="en say" data-say="${esc(w.w)}">${w.parts.map(esc).join(' <i>+</i> ')} ＝ <b>${esc(w.w)}</b></span> <span class="zh">${esc(w.zh)}</span></li>`).join('')}</ul>${learnUI(KE.rootItemId(r))}</div>`).join('');

      const open = new Set($$('#gl details[open]').map(d => d.dataset.id));

      $$('[data-g]').forEach(b => b.onclick = () => startQuiz({ modules: ['grammar'], topics: ['grammar:' + b.dataset.g], count: 10, allowSpeak: canSpeak }));
    };

    const draw = () => {
      $('#pl').innerHTML = D.patterns.filter(p => lfPass('patterns', KE.patternItemId(p))).map(p => `<div class="card pat ${isL(KE.patternItemId(p)) ? 'is-learned' : ''}"><div class="ph en say">${esc(p.pattern)}</div><div class="zh">${esc(p.zh)}</div><div class="exs">${p.ex.map(e => `<div><span class="en say">${esc(e.en)}</span><small>${esc(e.zh)}</small></div>`).join('')}</div><div class="row wrap"><button class="btn primary" data-p="${esc(p.id)}">🎯 練這個句型</button>${learnUI(KE.patternItemId(p))}</div></div>`).join('');
      $$('[data-p]').forEach(b => b.onclick = () => startQuiz({ modules: ['patterns'], topics: ['patterns:' + b.dataset.p], count: 10, allowSpeak: canSpeak }));

  // ---------- 練習設定 ----------
  function pPractice() {
    const mods = Object.keys(KE.MODULES), srcs = E.sources();
    const types = Object.keys(KE.TYPES).filter(y => canSpeak || y !== 'speak');
    const L = Object.assign({ mods: mods.slice(), offT: [], offY: [], count: 10, ratio: 0, lv: '', src: '' }, S.settings.last || {});
    app.innerHTML = top('練習設定') + `
      <section class="card"><h2>1. 選單元</h2>${mods.map(m => `<div class="mod"><label class="ck"><input type="checkbox" name="mod" value="${m}" ${L.mods.includes(m) ? 'checked' : ''}> ${KE.MODULES[m]}</label><details><summary>選主題</summary><div class="wrap">${E.topics(m).map(t => `<label class="ck sm"><input type="checkbox" name="top" value="${esc(t.key)}" ${L.offT.includes(t.key) ? '' : 'checked'}> ${esc(t.label)}</label>`).join('')}</div></details></div>`).join('')}</section>
      <section class="card"><h2>2. 選題型</h2><div class="wrap">${types.map(y => `<label class="ck"><input type="checkbox" name="typ" value="${y}" ${L.offY.includes(y) ? '' : 'checked'}> ${KE.TYPES[y]}</label>`).join('')}</div>${canSpeak ? '' : '<p class="muted">這台裝置不支援語音辨識，所以沒有「開口說說看」題。</p>'}</section>
      <section class="card"><h2>3. 單字範圍</h2>${radios('lv', [['', '全部等級'], ['1', '等級 1'], ['2', '等級 2']], L.lv)}${srcs.length > 1 ? radios('src', [['', '全部來源']].concat(srcs.map(s => [s, srcLabel(s)])), L.src) : ''}</section>
      <section class="card"><h2>4. 題數和錯題</h2>${radios('count', [['10', '10 題'], ['20', '20 題'], ['30', '30 題']], L.count)}${radios('ratio', [['0', '不加錯題'], ['0.3', '加 30% 錯題'], ['1', '只練錯題']], L.ratio)}<p class="muted">錯題庫目前有 ${mistakeIds().length} 題</p></section>

    bindVoice();
    $('#start').onclick = () => {
      const allT = $$('input[name="top"]').map(x => x.value), onT = vals('top'), onY = vals('typ');
      const last = { mods: vals('mod'), offT: allT.filter(t => !onT.includes(t)), offY: types.filter(y => !onY.includes(y)), count: +val('count') || 10, ratio: +val('ratio') || 0, lv: val('lv'), src: val('src') };

      startQuiz({ modules: last.mods, topics: onT, types: onY, count: last.count, mistakeRatio: last.ratio, mistakes: mistakeIds(), lv: last.lv, src: last.src, allowSpeak: canSpeak });

  // ---------- 作答 ----------
  function pQuiz() {
    if (!Q) { app.innerHTML = top('練習') + `<div class="card center"><p>還沒有開始練習喔！</p><button class="btn primary big" data-go="#practice">去選題目</button></div>`; return; }
    const q = Q.list[Q.i], n = Q.list.length;
    let body;
    if (q.input === 'text') body = `<div class="spell"><input id="ans" type="text" inputmode="text" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" enterkeyhint="done" placeholder="在這裡打字"><button class="btn primary" id="ok">確定</button></div>`;
    else if (q.input === 'chips') body = `<div class="placed" id="placed"></div><div class="pool">${q.options.map((c, i) => `<button class="chip" data-i="${i}">${esc(c)}</button>`).join('')}</div><div class="row"><button class="btn" id="clr">清除</button><button class="btn primary" id="ok">確定</button></div>`;
    else if (q.input === 'mic') body = `<div class="row"><button class="btn primary big" id="mic">🎤 按我開始說</button><button class="btn" id="skip">跳過</button></div><p class="muted center" id="heard"></p>`;
    else body = `<div class="opts ${q.options.some(o => o.length > 14) ? 'one' : ''}">${q.options.map(o => `<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
    app.innerHTML = top('練習中', '#practice') + `<div class="bar"><i style="width:${Q.i / n * 100}%"></i></div><p class="count">第 ${Q.i + 1} / ${n} 題</p>
      <div class="card qcard"><div class="qtype">${KE.TYPES[q.type]}</div><div class="prompt ${q.en ? 'en say' : ''}">${esc(q.prompt)}</div>${q.sub ? `<div class="sub ${q.subEn ? 'en' : ''}">${esc(q.sub)}</div>` : ''}${q.play ? `<button class="btn sound" id="play">🔊 ${q.type === 'speak' ? '聽示範' : '再聽一次'}</button>` : ''}</div>
      ${body}<div id="fb"></div>`;
    const p = $('#play'); if (p) p.onclick = () => speak(q.speakText);
    $$('.opt').forEach(b => b.onclick = () => answer(q, b.dataset.v));
    if (q.input === 'text') {
      const inp = $('#ans');
      $('#ok').onclick = () => answer(q, inp.value);
      inp.onkeydown = e => { if (e.key === 'Enter') answer(q, inp.value); };
    }
    if (q.input === 'chips') {
      let placed = [];
      const pool = $$('.chip');
      const draw = () => {
        $('#placed').innerHTML = placed.map(i => `<button class="chip on" data-p="${i}">${esc(q.options[i])}</button>`).join('') || '<span class="muted">點下面的字卡，排成句子；點上面的字卡可以拿掉</span>';
        pool.forEach(b => b.classList.toggle('used', placed.includes(+b.dataset.i)));
        $$('#placed .chip').forEach(b => b.onclick = () => { if (Q.answered) return; placed = placed.filter(x => x !== +b.dataset.p); draw(); });
      };
      pool.forEach(b => b.onclick = () => { const i = +b.dataset.i; if (Q.answered || placed.includes(i)) return; placed.push(i); draw(); });
      $('#clr').onclick = () => { if (!Q.answered) { placed = []; draw(); } };
      $('#ok').onclick = () => { if (placed.length) answer(q, placed.map(i => q.options[i]).join(' ')); };
      draw();
    }
    if (q.input === 'mic') {
      const heard = $('#heard');
      $('#skip').onclick = () => answer(q, '', true);
      $('#mic').onclick = () => {
        try {
          const r = new SR(); r.lang = S.settings.accent; r.interimResults = false; r.maxAlternatives = 3;
          heard.textContent = '我在聽… 🎧';
          r.onresult = e => {
            const alts = Array.from(e.results[0]).map(a => a.transcript);
            let best = alts[0] || '', bs = -1;
            alts.forEach(t => { const s = E.check(q, t).score; if (s > bs) { bs = s; best = t; } });
            heard.textContent = '我聽到：' + best;
            answer(q, best);
          };
          r.onerror = () => { heard.textContent = '麥克風沒辦法用，按「跳過」繼續 👉'; };
          r.onend = () => { if (!Q.answered && heard.textContent.indexOf('我在聽') === 0) heard.textContent = '沒聽清楚，再按一次 🎤，或按「跳過」'; };
          if (synth) synth.cancel();
          r.start();
        } catch (e) { heard.textContent = '這台裝置不能錄音，按「跳過」繼續 👉'; }
      };
    }
    if (q.auto) speak(q.speakText);
  }
  function answer(q, input, skipped) {
    if (Q.answered) return;
    Q.answered = true;
    const res = skipped ? { ok: false } : E.check(q, input);
    if (!skipped) record(q, res.ok);
    Q.answers.push({ q, ok: res.ok, skip: !!skipped, input });
    $$('.opt').forEach(b => { b.disabled = true; if (b.dataset.v === q.answer) b.classList.add('right'); else if (b.dataset.v === input) b.classList.add('wrong'); });
    $$('#ok,#clr,#mic,#skip,.pool .chip,#ans').forEach(x => { x.disabled = true; });
    const last = Q.i === Q.list.length - 1;
    $('#fb').innerHTML = `<div class="fb ${skipped ? 'skip' : res.ok ? 'ok' : 'no'}"><div class="fbh">${skipped ? '⏭️ 先跳過' : res.ok ? '✓ 答對了！太棒了' : '✗ 差一點，再加油！'}</div>
      ${!res.ok ? `<div>正確答案：<b class="say" data-say="${esc(q.speakText || q.answer)}">${esc(q.answer)}</b> 🔊</div>` : ''}
      ${!res.ok && !skipped && q.input && input ? `<div class="muted">你的答案：${esc(input)}</div>` : ''}
      ${res.score != null ? `<div class="muted">唸對了 ${Math.round(res.score * 100)}% 的字（70% 就過關）</div>` : ''}
      ${q.why ? `<div class="why">💡 ${esc(q.why)}</div>` : ''}
      <button class="btn primary big wide" id="next">${last ? '看結果 🎉' : '下一題 ➜'}</button></div>`;
    if (q.speakText && q.type !== 'speak') speak(q.speakText);
    $('#next').onclick = () => { Q.i++; Q.answered = false; if (Q.i >= Q.list.length) finish(); else { pQuiz(); window.scrollTo(0, 0); } };
    try { $('#next').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) { }
  }
  function finish() {
    const graded = Q.answers.filter(a => !a.skip), ok = graded.filter(a => a.ok).length, tot = graded.length, pct = tot ? ok / tot : 0;
    const stars = tot ? (pct >= 0.9 ? 3 : pct >= 0.6 ? 2 : 1) : 0;
    S.progress.stars += stars; S.progress.quizzes++; save('ke_progress', S.progress);
    Q.result = { ok, tot, stars, wrong: Q.answers.filter(a => !a.ok && !a.skip).map(a => a.q) };
    go('#result');
  }
  function pResult() {
    if (!Q || !Q.result) return go('#home');
    const r = Q.result, msg = r.stars === 3 ? '超級厲害！🏆' : r.stars === 2 ? '做得很好！👍' : '多練幾次會更棒！💪';
    app.innerHTML = top('練習結果') + `<div class="card center result"><div class="stars">${'⭐'.repeat(r.stars)}${'☆'.repeat(3 - r.stars)}</div><div class="score">${r.ok} / ${r.tot}</div><p>${msg}</p>${Q.graduated ? `<p>🎓 有 ${Q.graduated} 題錯題畢業了！</p>` : ''}</div>
      ${r.wrong.length ? `<section class="card"><h2>答錯的題目（點一下聽聽看）</h2><ul class="list">${r.wrong.map(q => `<li><span class="badge">${KE.TYPES[q.type]}</span> <span class="say" data-say="${esc(q.speakText || q.answer)}">${esc(q.title)} 🔊</span></li>`).join('')}</ul></section>` : ''}
      <div class="row wrap"><button class="btn primary big" id="again">再練一次</button>${r.wrong.length ? '<button class="btn big" id="redo">練答錯的題目</button>' : ''}<button class="btn big" data-go="#home">回首頁</button></div>`;
    $('#again').onclick = () => startQuiz(Q.cfg);
    const rd = $('#redo'); if (rd) rd.onclick = () => startQuiz({ ids: r.wrong.map(q => q.id) });
  }

  // ---------- 錯題庫 ----------
  function pMistakes() {
    const ids = mistakeIds().sort((a, b) => S.mistakes[b].t - S.mistakes[a].t);
    app.innerHTML = top('錯題庫') + `<div class="card"><p>答錯的題目會來這裡。同一題<b>連續答對 3 次</b>就會畢業離開 🎓</p><button class="btn primary big" id="onlym" ${ids.length ? '' : 'disabled'}>只練錯題（${ids.length} 題）</button></div>
      ${ids.length ? `<ul class="list card">${ids.map(id => { const m = E.byId[id], s = S.mistakes[id]; return `<li><span class="badge">${KE.TYPES[m.type]}</span> <span>${esc(m.title)}</span> <span class="dots">${'●'.repeat(s.c)}${'○'.repeat(3 - s.c)}</span> <small class="muted">錯 ${s.w} 次</small></li>`; }).join('')}</ul>` : '<p class="center muted">太棒了，目前沒有錯題！🎉</p>'}`;
    $('#onlym').onclick = () => startQuiz({ ids, count: 30 });
  }

  // ---------- 例題庫 ----------
  const BF = { m: '', k: '', y: '' };
  function pBank() {
    const mods = Object.keys(KE.MODULES);
    const types = Object.keys(KE.TYPES).filter(y => canSpeak || y !== 'speak');
    app.innerHTML = top('例題庫') + `<div class="filters"><select id="bm" aria-label="單元"><option value="">全部單元</option>${mods.map(m => `<option value="${m}">${KE.MODULES[m]}</option>`).join('')}</select><select id="bk" aria-label="主題"></select><select id="by" aria-label="題型"><option value="">全部題型</option>${types.map(y => `<option value="${y}">${KE.TYPES[y]}</option>`).join('')}</select><button class="btn primary" id="bgo">🎯 練這些</button></div><p class="muted" id="bn"></p><ul class="list card" id="bl"></ul>`;
    const pick = () => E.list({ modules: BF.m ? [BF.m] : null, topics: BF.k ? [BF.k] : null, types: BF.y ? [BF.y] : null, allowSpeak: canSpeak });
    const draw = () => {
      const tops = BF.m ? E.topics(BF.m) : [];
      $('#bk').innerHTML = `<option value="">全部主題</option>` + tops.map(t => `<option value="${esc(t.key)}">${esc(t.label)}</option>`).join('');
      $('#bk').value = BF.k; $('#bk').disabled = !BF.m;
      const L = pick(), show = L.slice(0, 200);
      $('#bn').textContent = `共 ${L.length} 題` + (L.length > 200 ? '（先列出前 200 題）' : '');
      $('#bl').innerHTML = show.map(m => `<li><span class="badge">${KE.TYPES[m.type]}</span> <span>${esc(m.title)}</span> <small class="muted">${esc(E.topicLabel(m.tkey))}</small></li>`).join('');
    };
    $('#bm').value = BF.m; $('#by').value = BF.y;
    $('#bm').onchange = e => { BF.m = e.target.value; BF.k = ''; draw(); };
    $('#bk').onchange = e => { BF.k = e.target.value; draw(); };
    $('#by').onchange = e => { BF.y = e.target.value; draw(); };
    $('#bgo').onclick = () => startQuiz({ ids: pick().map(m => m.id), count: 30 });
    draw();
  }

  // ---------- 家長 ----------
  const PS = { k: 'acc', d: 1 }, PL = { k: 'at', d: -1 };
  // 可排序表格：cols=[{k,t,f}]，st={k,d} 記住目前排序
  function sortTable(el, cols, rows, st) {
    const draw = () => {
      const s = rows.slice().sort((a, b) => { const x = a[st.k], y = b[st.k]; return (typeof x === 'string' ? x.localeCompare(y, 'zh-Hant') : x - y) * st.d; });
      el.innerHTML = `<thead><tr>${cols.map(c => `<th data-k="${c.k}">${c.t}${c.k === st.k ? (st.d > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead><tbody>${s.length ? s.map(r => `<tr>${cols.map(c => `<td>${esc(c.f ? c.f(r[c.k]) : r[c.k])}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${cols.length}" class="muted">還沒有紀錄</td></tr>`}</tbody>`;
      $$('th', el).forEach(th => th.onclick = () => { st.d = st.k === th.dataset.k ? -st.d : 1; st.k = th.dataset.k; draw(); });
    };
    draw();
  }
  function pParent() {
    const days = [];
    for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(ymd(d)); }
    const cnt = {}, per = {};
    S.log.forEach(l => {
      const k = ymd(new Date(l.t)); cnt[k] = (cnt[k] || 0) + 1;
      const p = per[l.k] || (per[l.k] = { k: l.k, n: 0, ok: 0 }); p.n++; p.ok += l.ok;
    });
    const mx = Math.max(1, ...days.map(d => cnt[d] || 0));
    const rows = Object.values(per).map(p => ({ label: E.topicLabel(p.k), mod: KE.MODULES[p.k.split(':')[0]] || '', n: p.n, ok: p.ok, acc: p.ok / p.n }));
    const weak = rows.filter(r => r.n >= 3).sort((a, b) => a.acc - b.acc).slice(0, 5);
    const pct = x => Math.round(x * 100) + '%';
    app.innerHTML = top('家長專區') + `
      <section class="card"><h2>最近 7 天做題數</h2><div class="week">${days.map(d => `<div class="day"><div class="col"><i style="height:${(cnt[d] || 0) / mx * 100}%"></i></div><b>${cnt[d] || 0}</b><small>${d.slice(5)}</small></div>`).join('')}</div>
        <p class="muted">累計 ${S.log.length} 題・完成 ${S.progress.quizzes} 回練習・⭐ ${S.progress.stars}・錯題庫 ${mistakeIds().length} 題</p></section>
      <section class="card"><h2>最需要加強的 5 個主題</h2>${weak.length ? `<ol>${weak.map(r => `<li>${esc(r.label)}（${esc(r.mod)}）— 正確率 ${pct(r.acc)}，做了 ${r.n} 題</li>`).join('')}</ol>` : '<p class="muted">每個主題做滿 3 題後就會出現。</p>'}</section>
      <section class="card"><h2>各主題正確率（點標題排序）</h2><div class="tblwrap"><table class="tbl" id="tt"></table></div></section>
      <section class="card"><h2>學會紀錄（${Object.keys(S.learned).length} 項，點標題排序）</h2><div class="tblwrap"><table class="tbl" id="lt"></table></div></section>
      ${voiceCard()}
      <section class="card"><h2>備份與重設</h2><div class="row wrap"><button class="btn" id="exp">📤 匯出備份</button><label class="btn">📥 匯入備份<input type="file" id="imp" accept=".json,application/json" hidden></label><button class="btn danger" id="rst">🗑️ 清除全部紀錄</button></div><p class="muted">紀錄只存在這台裝置的瀏覽器裡；換裝置前先匯出備份。</p></section>`;
    bindVoice();
    sortTable($('#tt'), [{ k: 'label', t: '主題' }, { k: 'mod', t: '單元' }, { k: 'n', t: '題數' }, { k: 'ok', t: '答對' }, { k: 'acc', t: '正確率', f: pct }], rows, PS);
    sortTable($('#lt'), [{ k: 'item', t: '項目' }, { k: 'type', t: '類型' }, { k: 'at', t: '學會時間（台北）', f: x => KE.fmtTaipei(x, true) }], E.learnedRows(S.learned), PL);
    $('#exp').onclick = () => {
      const data = { app: 'kids-english', at: new Date().toISOString() };
      KEYS.forEach(k => { data[k] = load(k, null); });
      try {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }));
        a.download = `kids-english-backup-${ymd(new Date()).replace(/-/g, '')}.json`;
        document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      } catch (e) { alert('匯出失敗：' + e.message); }
    };
    $('#imp').onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const data = JSON.parse(rd.result);
          if (!KEYS.some(k => k in data)) throw new Error('不是這個網站的備份檔');
          if (!confirm('匯入會覆蓋目前的紀錄，確定嗎？')) return;
          KEYS.forEach(k => { if (data[k] != null) save(k, data[k]); });
          loadAll(); alert('匯入完成！'); render();
        } catch (err) { alert('匯入失敗：' + err.message); }
      };
      rd.readAsText(f);
    };
    $('#rst').onclick = () => {
      if (!confirm('確定要清除全部紀錄（星星、錯題、做題紀錄、學會紀錄、設定）嗎？這個動作不能復原。')) return;
      KEYS.forEach(k => { try { localStorage.removeItem(k); } catch (e) { } });
      loadAll(); render();
    };
  }

  render();
})();
</script>
