  .cyc{margin:18px 0 6px}
  .cyc-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--ink);margin-bottom:9px;text-shadow:0 1px 6px rgba(0,0,0,.7)}
  .cyc-range{-webkit-appearance:none;appearance:none;width:100%;height:11px;border-radius:9999px;background:linear-gradient(90deg,#2b3a6b,#3f6ad8 28%,#e0a526 58%,#c9743f 80%,#7a2f2f);outline:none;cursor:pointer}
  .cyc-range::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--gold);cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.55)}
  .cyc-range::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--gold);cursor:pointer}
  /* ② 痛點勾選卡 */
  .chk-card{position:relative;background:rgba(8,11,18,.5);border:1px solid var(--line);border-radius:12px;padding:14px 16px 14px 46px;margin-top:10px;font-size:15.5px;font-weight:600;cursor:pointer;transition:all .15s;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  .chk-card::before{content:"";position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:6px;border:2px solid var(--dim)}

  /* ③ 翻牌 */
  .flip{perspective:1200px;margin:14px 0;cursor:pointer}
  .flip-inner{position:relative;width:100%;min-height:190px;transition:transform .6s ease;transform-style:preserve-3d}
  .flip.flipped .flip-inner{transform:rotateY(180deg)}
  .flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;border-radius:16px;border:1px solid var(--line);background:rgba(8,11,18,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);font-size:16px;line-height:1.7}
  .flip-back{transform:rotateY(180deg);border-color:var(--gold)}
  .flip-hint{margin-top:12px;font-size:12.5px;color:var(--gold)}
</style>

var bgLayers=null, bgActive=-1, curBg=null;
function setBg(url){
  if(!bgLayers){ bgLayers=[el('bgA'), el('bgB')]; }
  if(url===curBg) return;
  curBg=url;
  if(!url){ bgLayers.forEach(function(l){ if(l) l.style.opacity='0'; }); bgActive=-1; return; }
  var next=(bgActive===0)?1:0, nl=bgLayers[next];
  if(!nl) return;
  nl.style.backgroundImage='url("'+encodeURI(url)+'")';
  void nl.offsetWidth; // 觸發 reflow，確保 transition 生效
  nl.style.opacity='1';
  if(bgActive>=0 && bgLayers[bgActive]) bgLayers[bgActive].style.opacity='0';
  bgActive=next;
}

  +'<p style="font-size:18px"><b class="g">以後你敢答——而且知道它會走到哪。</b></p>'

  +'<img class="brand" src="https://yoda-research-next.vercel.app/yoda-research-title-dark.png" alt="Yoda Research" style="height:40px;margin:18px auto 0">'
  +'<a class="btn" href="https://yoda-wcyc.github.io/-/subscribe.html" target="_blank" rel="noopener" style="text-decoration:none">低調支持，鎖住創始 →</a>'
  +'<button class="btn ghost" style="margin-top:10px" onclick="go(0)">↺ 再玩一次</button>';}}
];

var cur=0;
function render(i){
  cur=i;
  var s=S[i];
  document.body.className=s.sky+(s.bg?' has-bg':'');
  setBg(s.bg||null);
  // 影片屏停背景音樂，避免跟影片聲音打架；離開再接回（除非使用者手動靜音）
  if(typeof BGM!=='undefined' && BGM){
    if(s.noBgm){ BGM.pause(); }
    else if(bgmStarted && !bgmMuted){ var _p=BGM.play(); if(_p&&_p.catch)_p.catch(function(){}); }
  }
  el('stage').innerHTML='<div class="scene">'+s.html()+'</div>';
  window.scrollTo({top:0,behavior:'instant'});
}
function next(){ if(cur<S.length-1) render(cur+1); }
function go(i){ render(i); }

/* 步2 對號入座 */
function pick(node,idx){
  pickedAns=idx;
  document.querySelectorAll('.opt').forEach(function(o){o.classList.remove('picked');});
  node.classList.add('picked');
  var rv=el('rv2'); if(rv) rv.classList.add('on');
}

/* ① 景氣位置滑桿 */
function cycMoved(){ var r=el('rvCyc'); if(r) r.classList.add('on'); }
/* ② 你中了幾個 */
function chkTog(node){ node.classList.toggle('on'); }
function chkReveal(){
  var n=document.querySelectorAll('#stage .chk-card.on').length, msg;
  if(n===0) msg='一個都沒中？那你要嘛很強，要嘛還沒真的下場——這遊戲當熱身也好。';
  else if(n<=2) msg='中了 '+n+' 個。多數人也是——你不孤單。';
  else msg='中 '+n+' 個？<b class="g">不是你笨，是判斷沒人教你</b>——而判斷，練得起來。';
  var r=el('rvChk'); if(r){ r.innerHTML='<p style="margin-top:14px">'+msg+'</p><button class="btn" onclick="next()">繼續 →</button>'; r.classList.add('on'); }
}
/* ③ 翻牌 */
function flipIt(node){ node.classList.add('flipped'); var r=el('rvFlip'); if(r) setTimeout(function(){ r.classList.add('on'); },420); }

/* 分享這個遊戲（張力守恆：只勾人、不破梗） */
function shareGame(){
  var url=location.href.split('#')[0];
  var text='你敢說——現在景氣是往上還往下？我玩了這個才發現，我一直卡在同一個「根」。你也測測看：';
  if(navigator.share){
    navigator.share({title:'你敢說——現在是往上，還往下？',text:text,url:url}).catch(function(){});
  }else{
    var full=text+' '+url;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(full).then(function(){toast('連結已複製，去貼給朋友吧');});
    }else{
      var ta=document.createElement('textarea');ta.value=full;document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');toast('連結已複製');}catch(e){}
      document.body.removeChild(ta);
    }
  }
}
function toast(m){
  var t=document.createElement('div');t.textContent=m;
  t.style.cssText='position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(20,16,8,.94);color:#e8c877;font-size:13px;font-weight:700;padding:10px 16px;border-radius:9999px;z-index:50;border:1px solid rgba(224,165,38,.4)';
  document.body.appendChild(t);setTimeout(function(){t.remove();},2200);
}

/* 步6 送出創始登記 → GAS joinVip（email + 臉書名 + 分享連結） */
function submitJoin(){
  var email=(el('j-email').value||'').trim(), fb=(el('j-fb').value||'').trim(), post=(el('j-post').value||'').trim();
  var msg=el('j-msg'); msg.style.color='#f0a0a0';
  if(!email||!/.+@.+\..+/.test(email)){msg.textContent='請填一個正確的 email';return;}
  if(!fb){msg.textContent='留下你的臉書名稱，我好核對分享';return;}
  if(!post||!/^https?:\/\/.+/.test(post)){msg.textContent='貼上你公開分享的貼文連結（要 http 開頭）';return;}
  var btn=el('j-btn'); btn.disabled=true; msg.style.color='#c9c9c9'; msg.textContent='登記中…';
  fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:'joinVip',email:email,fbName:fb,post:post})})
    .then(function(r){return r.json();})
    .then(function(res){
      btn.disabled=false;
      if(res&&res.ok){ el('joinForm').style.display='none'; el('joinDone').style.display='block'; window.scrollTo({top:0,behavior:'smooth'}); }
      else{ msg.style.color='#f0a0a0'; msg.textContent=(res&&res.error)||'登記失敗，請稍後再試'; }
    })
    .catch(function(){ btn.disabled=false; msg.style.color='#f0a0a0'; msg.textContent='連線失敗，請稍後再試'; });
}

/* 背景音樂（沿用 day_one.mp3 · 首次互動啟動 · 靜音記憶） */
var BGM=el('bgm'), MUTEBTN=el('muteBtn');
var bgmStarted=false, bgmMuted=false;
try{ bgmMuted=localStorage.getItem('yoda_bgm_muted')==='1'; }catch(e){}
if(BGM){ BGM.volume=0.30; }
function updateMuteIcon(){ if(MUTEBTN) MUTEBTN.textContent=bgmMuted?'🔇':'🔊'; }
updateMuteIcon();
function startBGM(){ if(bgmStarted||bgmMuted||!BGM)return; if(S[cur]&&S[cur].noBgm)return; BGM.play().then(function(){bgmStarted=true;}).catch(function(){}); }
function toggleMute(){
  bgmMuted=!bgmMuted;
  try{ localStorage.setItem('yoda_bgm_muted',bgmMuted?'1':'0'); }catch(e){}
  if(bgmMuted){ if(BGM)BGM.pause(); } else { if(BGM)BGM.play().then(function(){bgmStarted=true;}).catch(function(){}); }
  updateMuteIcon();
}
document.addEventListener('click', startBGM, {once:false});

render(0);
</script>
