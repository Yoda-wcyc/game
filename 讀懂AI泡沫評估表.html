function giveAnswer(i){const r=ROUNDS[i],a=ANS[i];
 const gloss=`<div style="font-size:11px;letter-spacing:2px;color:rgba(255,255,255,0.5);margin:0.85rem 0 0.5rem">名詞白話</div>`+a.terms.map(t=>`<div style="font-size:13px;line-height:1.7;color:rgba(255,255,255,0.9);margin-bottom:0.42rem;text-align:left"><b style="color:#e0a526">${t[0]}</b>：${t[1]}</div>`).join('');
 const box=inner=>`<div style="max-width:480px;margin:0.5rem auto 0;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.28);border-radius:10px;padding:1rem 1.2rem;backdrop-filter:blur(6px)">${inner}</div>`;
 const ansLine=`<div style="font-size:14px;line-height:1.7;color:#fff;text-align:left"><b style="color:#a5d6a7">答案：</b>${a.answer}</div>`;
 if(r.type==='classify'){
   r.items.forEach((it,k)=>state.cls[k]=it[1]);
   const rows=r.items.map(it=>`<div class="cls-row right"><div class="cls-name">${it[0]}</div><div class="cls-btns"><button class="cls-btn ${it[1]} on" disabled>${it[1]==='atk'?r.catA:r.catB}</button></div></div>`).join('');
   G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r)}<div class="round-q t-main">${r.q}</div><div class="cls-list">${rows}</div>${box(ansLine+`<div style="font-size:13px;line-height:1.7;color:rgba(255,255,255,0.86);margin-top:0.55rem;text-align:left">${r.reveal}</div>`+gloss)}<button class="continue-btn" onclick="record(${i})">懂了，繼續 ›</button>`);
 }else if(r.type==='gauge'){
   G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r)}<div class="gauge-wrap">${gaugeSVG(r.ans,r.left,r.right)}<div class="feedback" style="margin-top:0.6rem">${r.fb(r.ans)}</div></div>${box(ansLine+gloss)}<button class="continue-btn" onclick="record(${i})">懂了，繼續 ›</button>`);
 }else{
   const ch=r.choices.map((c,k)=>`<div class="choice-btn" style="cursor:default;${k===r.correct?'border-color:#a5d6a7;background:rgba(80,200,110,0.14)':'opacity:0.45'}">${k===r.correct?'✓ ':''}${c}</div>`).join('');
   G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r)}<div class="choices">${ch}</div><div class="feedback" style="color:#a5d6a7;min-height:auto;font-size:14px">${r.fb[r.correct]}</div>${box(gloss)}<button class="continue-btn" onclick="record(${i})">懂了，繼續 ›</button>`);
 }}

function prog(){PB.style.width=(Math.max(0,state.idx)/ROUNDS.length*100)+'%';}
function dots(i){return `<div class="step-dots">${ROUNDS.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div>`;}
function fade(fn){G.style.transition='opacity .32s';G.style.opacity='0';setTimeout(()=>{fn();G.style.opacity='1';},330);}
function scene(sky,bgtype,inner){return `<div class="scene ${sky}">${bg(bgtype,sky)}<div class="overlay">${inner}</div></div>`;}
function head(r){const layers=r.layers?`<div class="layer-list">${r.layers.map(ly=>`<div class="ly"><b>${ly[0]}</b><span>${ly[1]}</span></div>`).join('')}</div>`:'';const chips=r.chips?`<div style="max-width:480px;margin:0 auto 0.4rem">${r.chips.map(c=>`<span class="data-chip">${c}</span>`).join('')}</div>`:'';const fig=r.svg?`<div style="margin:0.5rem auto 0.2rem">${r.svg}</div>`:'';return `<div class="chapter-label t-label">${r.label}</div><div class="chapter-title t-main" style="font-size:22px;margin-bottom:0.9rem">${r.title}</div><div class="round-text t-sub">${r.text}</div>${layers}${chips}${fig}`;}

function showStart(){G.innerHTML=scene('sky-start','farhills',`
  <div class="chapter-label t-label" style="margin-bottom:1rem">YODA RESEARCH · 判斷力學校</div>
  <div class="chapter-title t-main" style="font-size:30px;font-weight:200;letter-spacing:1px;margin-bottom:0.4rem">讀懂 AI 泡沫評估表</div>
  <div class="t-sub" style="font-size:14px;margin-bottom:0.3rem;font-style:italic">泡沫不是是非題，是溫度題——風險在哪一格？</div>
  <div class="t-label" style="font-size:12px;margin-bottom:2.6rem">約 6 分鐘 · 跟著報告走一遍（本月解析→六張證據卡→完整研判） · 數據截止 2026-08-28</div>
  <button class="continue-btn" style="font-size:15px;padding:0.85rem 3.2rem;border-radius:6px;letter-spacing:2px" onclick="fade(startOpening)">開始</button>`);}
let oi=0;function startOpening(){oi=0;renderOpening();}
function renderOpening(){const q=OPENING.quotes[oi],last=oi>=OPENING.quotes.length-1;
 G.innerHTML=scene(OPENING.sky,OPENING.bg,`<div class="chapter-label t-label">${OPENING.label}</div><div class="chapter-title t-main">${OPENING.title}</div><div class="chapter-quote t-sub">${q}</div><button class="continue-btn" onclick="nextOpening()">${last?'開始第一站 ›':'繼續 ›'}</button>`);}
function nextOpening(){oi++;if(oi>=OPENING.quotes.length)fade(()=>showRound(0));else fade(renderOpening);}

function showRound(i){state.idx=i;prog();const r=ROUNDS[i];
 if(r.type==='gauge')renderGauge(i);else if(r.type==='classify')renderClassify(i);else renderAB(i);}

// 儀表滑桿
function gaugeSVG(val,leftLbl,rightLbl){const min=0,max=100,f=v=>Math.PI*(1-(v-min)/(max-min)),R=120,ax=250+R*Math.cos(f(val)),ay=170-R*Math.sin(f(val));
 return `<svg viewBox="0 0 500 200" style="width:100%;max-width:320px"><path d="M130,170 A120,120 0 0,1 370,170" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="14"/><line x1="250" y1="170" x2="${ax}" y2="${ay}" stroke="#e0a526" stroke-width="5" stroke-linecap="round"/><circle cx="250" cy="170" r="8" fill="#e0a526"/><text x="250" y="128" fill="#fff" font-size="26" font-weight="300" text-anchor="middle">${val}</text><text x="130" y="192" fill="rgba(91,141,239,0.9)" font-size="11" text-anchor="middle">${leftLbl||'左'}</text><text x="370" y="192" fill="rgba(224,83,83,0.9)" font-size="11" text-anchor="middle">${rightLbl||'右'}</text></svg>`;}
function renderGauge(i){const r=ROUNDS[i];state.gv=50;
 function draw(){G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r)}<div class="round-q t-main" style="font-size:14.5px">${r.q}</div>
   <div class="gauge-wrap">${gaugeSVG(state.gv,r.left,r.right)}<input type="range" class="gsl" min="0" max="100" value="${state.gv}" oninput="state.gv=parseInt(this.value);drawGauge()">
   <div class="gsl-ends"><span>${r.left}</span><span>${r.right}</span></div></div>
   <div style="display:flex;gap:0.6rem;justify-content:center;flex-wrap:wrap;margin-top:0.6rem"><button class="continue-btn" onclick="gaugeDone(${i})">就這樣 ›</button><button class="continue-btn" style="opacity:0.72" onclick="giveAnswer(${i})">給我答案</button></div>`);}
 window.drawGauge=draw;draw();}
function gaugeDone(i){const r=ROUNDS[i];if(r.correct(state.gv))state.score++;
 G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r)}<div class="gauge-wrap">${gaugeSVG(state.gv,r.left,r.right)}<div class="feedback" style="margin-top:0.8rem">${r.fb(state.gv)}</div></div><button class="continue-btn" onclick="record(${i})">繼續 ›</button>`);}

// 二選一 / 三選一
function renderAB(i){const r=ROUNDS[i];
 G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r)}<div class="round-q t-main">${r.q}</div>
  <div class="choices">${r.choices.map((c,k)=>`<button class="choice-btn" onclick="abPick(${i},${k})">${c}</button>`).join('')}</div>
  <button class="continue-btn" style="opacity:0.72" onclick="giveAnswer(${i})">給我答案</button>`);}
function abPick(i,k){const r=ROUNDS[i];if(k===r.correct)state.score++;
 const col=k===r.correct?'#a5d6a7':'#ffcc80';
 G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r)}<div class="feedback" style="color:${col};min-height:auto;font-size:14px">${r.fb[k]}</div><button class="continue-btn" onclick="record(${i})">繼續 ›</button>`);}

// 分類（可以下結論 / 不能）
function renderClassify(i){const r=ROUNDS[i];if(state.cls.length!==r.items.length)state.cls=r.items.map(()=>null);
 function draw(){const rows=r.items.map((it,k)=>`<div class="cls-row" id="cr${k}"><div class="cls-name">${it[0]}</div><div class="cls-btns">
   <button class="cls-btn atk ${state.cls[k]==='atk'?'on':''}" onclick="setCls(${k},'atk')">${r.catA}</button>
   <button class="cls-btn def ${state.cls[k]==='def'?'on':''}" onclick="setCls(${k},'def')">${r.catB}</button></div></div>`).join('');
  const done=state.cls.every(x=>x!==null);
  G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r)}<div class="round-q t-main">${r.q}</div><div class="cls-list">${rows}</div>
   <div class="feedback" id="fbc" style="min-height:24px"></div>
   <div style="display:flex;gap:0.6rem;justify-content:center;flex-wrap:wrap">${done?`<button class="continue-btn" onclick="clsCheck(${i})">檢查</button>`:''}<button class="continue-btn" style="opacity:0.72" onclick="giveAnswer(${i})">給我答案</button></div>`);}
 window.drawCls=draw;draw();}
function setCls(k,v){state.cls[k]=v;window.drawCls();}
function clsCheck(i){const r=ROUNDS[i];let ok=0;
 r.items.forEach((it,k)=>{const row=document.getElementById('cr'+k);const right=state.cls[k]===it[1];if(right)ok++;row.classList.add(right?'right':'wrong');});
 if(ok>=r.items.length-1)state.score++;
 document.getElementById('fbc').innerHTML=`<span style="color:${ok===r.items.length?'#a5d6a7':'#ffcc80'}">答對 ${ok}/${r.items.length}。${r.reveal}</span>`;
 const cb=G.querySelector('.continue-btn');if(cb)cb.parentElement.outerHTML=`<button class="continue-btn" onclick="record(${i})">繼續 ›</button>`;}

    <button class="yoda-btn" style="width:100%;box-sizing:border-box;margin:0;border:none" id="shareBtn" onclick="shareGame()">分享：讓還在吵「AI 是不是泡沫」的朋友，改用溫度看</button>
  </div>
  <a href="javascript:void(0)" onclick="restart()" style="display:inline-block;margin-top:0.9rem;font-size:12px;color:rgba(255,255,255,0.55);text-decoration:underline">重玩一次</a>
  <div id="sfb" style="font-size:12px;color:rgba(160,220,255,0.7);margin-top:0.5rem;height:16px"></div>
  <div style="font-size:11px;color:rgba(255,255,255,0.35);margin-top:1.4rem">背景音樂 by <a href="https://www.youtube.com/@BiBiPiano" target="_blank" style="color:rgba(224,165,38,0.6);text-decoration:none">BiBiPiano</a></div>`);}

  +'#yc-msg.ok{color:#7fd6a6}#yc-msg.err{color:#f08a8a}'
  +'#yc-close,#yc-close2{background:none;border:none;color:#8590a6;font-size:13px;text-decoration:underline;cursor:pointer;display:block;margin:12px auto 0}'
  +'#yc-done .yc-badge{font-size:54px;line-height:1;margin:2px 0 8px;text-align:center}';
  document.head.appendChild(css);

  var bar=document.createElement('div');
  bar.id='yc-bar';
  bar.innerHTML='<div class="yc-txt">🎓 玩到最後了嗎？完成這個導覽，<b>領取《'+name+'報告》檢核徽章</b></div><button id="yc-go">領取檢核</button>';
  document.body.appendChild(bar);
  // 只在最後結果頁才浮出「領取檢核」——沒玩到結果頁不顯示（2026-08-06）
  var ycCertified=false;
  function ycOnResult(){return !!document.querySelector('.result-name,.result-type');}
  function ycSync(){bar.style.display=(!ycCertified&&ycOnResult())?'flex':'none';}
  ycSync();
  new MutationObserver(ycSync).observe(document.body,{childList:true,subtree:true});

  var mask=document.createElement('div');
  mask.id='yc-mask';
  mask.innerHTML='<div id="yc-modal">'
    +'<div id="yc-form">'
      +'<h3>領取《'+name+'報告》檢核</h3>'
      +'<p>輸入你訂閱用的 <b style="color:#e8c86a">email 與會員密碼</b>，系統會記下你已看懂這份報告怎麼判讀。</p>'
      +'<input id="yc-email" type="email" placeholder="訂閱用的 email" autocomplete="off">'
      +'<input id="yc-pw" type="password" placeholder="你的會員密碼" autocomplete="off">'
      +'<div class="yc-hint">這組密碼只是會員存取碼，請勿使用你其他重要帳號的密碼。</div>'
      +'<button id="yc-submit">送出，領取徽章</button>'
      +'<div id="yc-msg"></div>'
      +'<button id="yc-close">稍後再說</button>'
    +'</div>'
    +'<div id="yc-done" style="display:none">'
      +'<div class="yc-badge">🏅</div>'
      +'<h3 style="text-align:center">已通過《'+name+'報告》檢核</h3>'
      +'<p id="yc-done-txt" style="text-align:center"></p>'
      +'<button id="yc-close2">完成</button>'
    +'</div>'
  +'</div>';
  document.body.appendChild(mask);

  var $=function(id){return document.getElementById(id);};
  function openModal(){mask.classList.add('on');setTimeout(function(){$('yc-email').focus();},50);}
  function closeModal(){mask.classList.remove('on');}
  $('yc-go').onclick=openModal;
  $('yc-close').onclick=closeModal;
  $('yc-close2').onclick=closeModal;
  mask.addEventListener('click',function(e){if(e.target===mask)closeModal();});

  function submit(){
    var email=$('yc-email').value.trim(), pw=$('yc-pw').value.trim(), msg=$('yc-msg');
    if(!email||!pw){msg.className='err';msg.textContent='請輸入 email 與會員密碼';return;}
    var btn=$('yc-submit');btn.disabled=true;msg.className='';msg.textContent='驗證中…';
    fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:'certify',email:email,password:pw,reportType:t})})
      .then(function(r){return r.json();})
      .then(function(res){
        btn.disabled=false;
        if(res&&res.done){
          $('yc-form').style.display='none';
          $('yc-done').style.display='block';
          $('yc-done-txt').innerHTML=(res.alreadyCertified?'你先前已通過（'+res.certifiedAt+'）。':'通過日：'+res.certifiedAt+'。')
            +'<br>之後就能安心收到每期《'+name+'報告》了。';
          ycCertified=true;bar.style.display='none';
        }else{
          msg.className='err';msg.textContent=(res&&res.error)?res.error:'驗證失敗，請稍後再試';
        }
      })
      .catch(function(){btn.disabled=false;msg.className='err';msg.textContent='連線失敗，請檢查網路後再試';});
  }
  $('yc-submit').onclick=submit;
  $('yc-pw').addEventListener('keydown',function(e){if(e.key==='Enter')submit();});
  $('yc-email').addEventListener('keydown',function(e){if(e.key==='Enter')submit();});
})();
</script>
