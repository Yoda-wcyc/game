.sky-noon .t-main{color:#e3f2fd}.sky-noon .t-sub{color:rgba(200,230,255,0.85)}.sky-noon .t-label{color:rgba(180,215,255,0.58)}

.sky-dusk .t-main{color:#fce4ec}.sky-dusk .t-sub{color:rgba(252,220,235,0.85)}.sky-dusk .t-label{color:rgba(240,180,210,0.58)}

.sky-mountain .t-main{color:#fce4ec}.sky-mountain .t-sub{color:rgba(252,225,240,0.85)}.sky-mountain .t-label{color:rgba(240,190,220,0.58)}

.result-icon{font-size:52px;margin-bottom:0.75rem}

.result-config-title{font-size:11px;letter-spacing:2px;color:rgba(255,255,255,0.38);margin-bottom:0.6rem}

.progress-bar{position:fixed;top:0;left:0;height:2px;background:rgba(224,165,38,0.6);transition:width 0.4s;z-index:100}
.mute-btn{position:fixed;top:14px;right:14px;z-index:101;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.25);color:#fff;font-size:16px;cursor:pointer;backdrop-filter:blur(6px);transition:all 0.2s;display:flex;align-items:center;justify-content:center;padding:0}

.flip-reveal{max-width:480px;margin:0 auto;background:rgba(0,0,0,0.32);border:1px solid rgba(255,255,255,0.28);border-radius:10px;padding:1.4rem 1.5rem;backdrop-filter:blur(6px);animation:flipIn 0.5s ease}

.reorder-list{max-width:440px;margin:0 auto 1.1rem;display:flex;flex-direction:column;gap:0.55rem}

.reorder-row:active{cursor:grabbing}

<body>
<audio id="bgm" loop preload="auto"><source src="day_one.mp3" type="audio/mpeg"></audio>
<button id="muteBtn" class="mute-btn" onclick="toggleMute()" aria-label="音樂開關">🔊</button>
<div class="progress-bar" id="progress"></div>
<div id="game"></div>
<script>
const G=document.getElementById('game');
const PB=document.getElementById('progress');

// ---- 背景音樂控制 ----
const BGM=document.getElementById('bgm');
const MUTEBTN=document.getElementById('muteBtn');
let bgmStarted=false;
let bgmMuted=false;
try{ bgmMuted = localStorage.getItem('yoda_bgm_muted')==='1'; }catch(e){}
if(BGM){ BGM.volume=0.30; }
function updateMuteIcon(){ if(MUTEBTN) MUTEBTN.textContent = bgmMuted ? '🔇' : '🔊'; }
updateMuteIcon();
function startBGM(){
  if(bgmStarted || bgmMuted || !BGM) return;
  BGM.play().then(function(){ bgmStarted=true; }).catch(function(){});
}
function toggleMute(){
  bgmMuted=!bgmMuted;
  try{ localStorage.setItem('yoda_bgm_muted', bgmMuted?'1':'0'); }catch(e){}
  if(bgmMuted){ if(BGM) BGM.pause(); }
  else{ if(BGM){ BGM.play().then(function(){bgmStarted=true;}).catch(function(){}); } }
  updateMuteIcon();
}
window.toggleMute=toggleMute;
// 第一次任何點擊都嘗試啟動音樂（解鎖瀏覽器自動播放限制）
document.addEventListener('click', startBGM, {once:false});


const CHAPTERS=[
  {label:'第一章',title:'修術',sky:'sky-dawn',quotes:['你買了課、追了粉專、做了筆記。<br>但每次要下單，還是不知道從哪裡開始。']},
  {label:'第二章',title:'修道',sky:'sky-valley',quotes:['有一天，你突然看見了。升息、美元、油價、債券——<br>它們不是獨立的，它們在說同一件事。','市場不是隨機的。它有節奏。只是你還沒找到那個頻率。<br>經濟是一張立體拼圖，你以前只看到一塊，<br>現在，你開始看見它們如何咬合。','牽一髮動全身。<br>這句話在你第一次看懂一個完整的傳導鏈之後，才真正有了重量。','從這裡開始，你看市場的方式，會慢慢不一樣。']},
  {label:'第三章',title:'修心',sky:'sky-mountain',quotes:['長線需要耐心。短線需要紀律。兩者都需要你足夠了解自己。','有些人用長線睡得著覺。有些人靠短線感覺活著。<br>答案沒有對錯，只有適不適合。']},
  {label:'第四章',title:'融合',sky:'sky-clear',quotes:['當你停止尋找唯一正確的答案，才開始建立自己的系統。','沒有哪一樣武器可以獨立戰鬥。<br>總經是地圖，技術是指南針，基本面是糧草。','你走到這裡，不是為了得到答案。而是為了開始問對問題。','系統不是別人給你的。是你一次次選擇之後，留下來的東西。']}
];

const ROUNDS=[
  {ch:0,sky:'sky-dawn',title:'資訊的迷宮',type:'rank',text:'你訂閱了十個財經粉專。<br>每天早上打開手機，三種聲音同時對你喊話，聽起來都有道理。',rankItems:['A：升息了，快去買債券','B：現在是佈局科技股的好時機','C：別傻了，現金為王'],reveal:'你排好了信任順序。但真相是——三種聲音都只對了一半：升息初期債券未必立刻漲、科技股可能還要修正、現金為王也可能錯過反彈。沒有一個能照單全收。',question:'看清楚這點以後，你會——',choices:['跟著我排第一、聲量最大的那個做','先擱置，繼續學，建立自己的判斷再說']},
  {ch:0,sky:'sky-gray',title:'技術分析的誘惑',type:'flip',text:'你開始學K線。黃金交叉、死亡交叉、RSI超買超賣。<br>買了課，做了筆記，自以為看懂了圖。<br>第一次出手，照著型態買，結果隔天跳空下跌。',question:'你怎麼解讀這次失敗？',cards:[{label:'圖表是騙人的',text:'技術分析根本沒用，我不玩了',reveal:'半年後你錯過了三個教科書級的型態。問題其實不是圖表，是你只學了型態、沒學它失效的條件——你把工具丟了，卻留著同一套急躁。'},{label:'我看錯了',text:'判斷有問題，繼續研究哪裡錯',reveal:'你回頭覆盤，發現那天有一份財報在盤前爆雷。原來型態沒錯，是你漏看了基本面的訊號。你開始懂得：沒有單一工具能獨立成立。'}],choices:['圖表分析本來就是騙人的，我不玩了','我的判斷有問題，要繼續研究，找出哪裡看錯了']},
  {ch:0,sky:'sky-noon',title:'總經焦慮症',type:'slider',text:'你開始關注宏觀。Fed利率、CPI、PCE、殖利率曲線、PMI……每個數據公布，市場都在震盪。你試圖每個都追，愈看愈焦慮，愈焦慮愈不敢動。',question:'你決定每天花多少時間追這些數據？',sliderKind:'hours',min:0,max:8,step:1,def:3,unit:' 小時／天',leftLabel:'幾乎不看',rightLabel:'全部都追',choices:['資訊太多了，我決定只看最重要的幾個指標，其他不管','繼續全追，資訊就是武器，我不能放棄任何一塊']},
  {ch:0,sky:'sky-afternoon',title:'好公司，壞時機',text:'你研究了一家公司半個月。財報漂亮、護城河深、管理層優秀。你買進了。然後股價五年都沒動，甚至還跌了15%。同期大盤漲了60%。',question:'你的結論是什麼？',choices:['基本面分析沒用，市場根本不在乎企業真實價值','好公司是必要條件，但進場時機同樣關鍵，我的功課還沒做完']},
  {ch:0,sky:'sky-dusk',title:'知道太多，動不了',text:'你學了技術分析、基本面、總體經濟。每次想出手，腦袋裡同時響起五個聲音：技術面說可以、基本面說還早、總經說不確定、新聞說要小心、內心說算了。最後你什麼都沒做。',question:'你意識到問題在哪裡？',choices:['問題是資訊還不夠，我需要更多確定性才能行動','問題是我沒有一個屬於自己的判斷框架，資訊沒有主軸']},
  {ch:1,sky:'sky-valley',title:'第一次看見連結',type:'chain',text:'某天你在看一篇分析。作者把六件事排成一條傳導鏈——<br>但你手上的順序被打亂了。<br>試著把它排回正確的因果順序。',chain:['Fed 升息','美元走強','新興市場資金外逃','當地貨幣貶值','央行被迫跟進升息','壓制內需、企業盈餘下修'],reveal:'你把鏈條接了起來。「牽一髮動全身」這句話，在你第一次親手看懂一條完整的傳導鏈之後，才真正有了重量。原來這些事，從來不是各自獨立發生的。',question:'這個頓悟帶給你什麼感受？',choices:['原來要先搞懂宏觀，才能看懂個股在做什麼','這太複雜了，我寧願找個簡單的公式']},
  {ch:1,sky:'sky-storm',title:'市場的節奏',text:'你開始研究景氣循環。擴張、高峰、收縮、谷底。你發現，歷史上每一次大跌，幾乎都能在總經數據裡找到先行警訊。市場不是隨機的，它有節奏，有慣性，有記憶。',question:'你對週期的理解是？',choices:['懂週期就能預測市場，我要開始用這個做決策','週期是地圖，不是時刻表。它告訴我方向，但不告訴我今天幾點']},

// 通用拖曳排序（滑鼠＋觸控，Pointer Events）
function attachDrag(listSelector,getOrder,commit){
  const list=document.querySelector(listSelector);
  if(!list)return;
  const rows=[].slice.call(list.querySelectorAll('.reorder-row'));
  rows.forEach((row,from)=>{
    row.addEventListener('pointerdown',function(e){
      if(e.button&&e.button!==0)return;
      e.preventDefault();
      const order=getOrder().slice();
      const rects=rows.map(r=>r.getBoundingClientRect());
      const rect=rects[from];
      const clone=row.cloneNode(true);
      clone.classList.add('dragging');
      clone.style.position='fixed';
      clone.style.left=rect.left+'px';
      clone.style.top=rect.top+'px';
      clone.style.width=rect.width+'px';
      clone.style.margin='0';
      clone.style.zIndex='9999';
      clone.style.pointerEvents='none';
      document.body.appendChild(clone);
      row.style.opacity='0.2';
      const offY=e.clientY-rect.top;
      let lastY=e.clientY;
      function hint(y){
        rows.forEach((r2,i)=>{
          if(i===from){r2.classList.remove('slot-hint');return;}
          const m=rects[i].top+rects[i].height/2;
          r2.classList.toggle('slot-hint',Math.abs(y-m)<rects[i].height/2);
        });
      }
      function move(ev){lastY=ev.clientY;clone.style.top=(lastY-offY)+'px';hint(lastY);}
      function up(){
        document.removeEventListener('pointermove',move);
        document.removeEventListener('pointerup',up);
        document.removeEventListener('pointercancel',up);
        clone.remove();
        rows.forEach(r2=>r2.classList.remove('slot-hint'));
        const item=order[from];
        const others=order.filter((_,i)=>i!==from);
        const oRects=rects.filter((_,i)=>i!==from);
        let ins=0;
        for(let i=0;i<oRects.length;i++){
          if(oRects[i].top+oRects[i].height/2<lastY)ins=i+1;
        }
        others.splice(ins,0,item);
        commit(others);
      }
      document.addEventListener('pointermove',move);
      document.addEventListener('pointerup',up);
      document.addEventListener('pointercancel',up);
    });
  });
}

// R5 傳導鏈重組（拖曳）
function renderChainRound(ri){
  const r=ROUNDS[ri];
  if(!work.chain||work.chainRound!==ri){
    const n=r.chain.length;
    let s=[2,0,4,1,5,3].filter(x=>x<n);
    if(s.length!==n)s=r.chain.map((_,i)=>i).reverse();
    work.chain=s;work.chainRound=ri;work.chainChecked=false;work.chainRevealed=false;
  }
  window.chainCheck=function(){work.chainChecked=true;chainRender();};
  window.chainGiveAnswer=function(){
    work.chain=r.chain.map((_,i)=>i);
    work.chainChecked=true;work.chainRevealed=true;chainRender();
  };
  function isCorrect(){return work.chain.every((v,i)=>v===i);}
  function chainRender(){
    const rows=work.chain.map((it,pos)=>{
      const ok=work.chainChecked&&it===pos;
      const arrow=pos<work.chain.length-1?'<div class="chain-arrow">↓</div>':'';
      return `<div class="reorder-row ${ok?'correct':''}" data-pos="${pos}">
        <div class="reorder-rank">${pos+1}</div>
        <div class="reorder-label">${r.chain[it]}</div>
        <div class="drag-handle">⠿</div>
      </div>${arrow}`;
    }).join('');
    const done=isCorrect();
    let msg='';
    if(work.chainRevealed)msg='<span style="color:#a5d6a7">這就是那條傳導鏈——先看懂，再慢慢體會。</span>';
    else if(work.chainChecked)msg=done?'<span style="color:#a5d6a7">完全正確——這就是那條傳導鏈。</span>':'<span style="color:#ffcc80">還沒對齊，再想想因果的先後。</span>';
    const proceed=(done&&work.chainChecked)||work.chainRevealed;
    G.innerHTML=scene(r,`
      <div class="round-question t-main" style="font-size:15px;opacity:.9">拖曳排序，把六件事排回正確的因果順序</div>
      <div class="reorder-list">${rows}</div>
      <div class="slider-feedback" style="min-height:22px">${msg}</div>
      ${proceed
        ?`<button class="continue-btn" onclick="chainReveal(${ri})">看懂了 ›</button>`
        :`<div style="display:flex;gap:0.6rem;justify-content:center;flex-wrap:wrap">
            <button class="continue-btn" style="margin-top:0" onclick="chainCheck()">檢查順序</button>
            <button class="continue-btn" style="margin-top:0;opacity:0.7" onclick="chainGiveAnswer()">給我答案</button>
          </div>`}`);
    if(!proceed) attachDrag('.reorder-list',()=>work.chain,o=>{work.chain=o;work.chainChecked=false;chainRender();});
  }
  window.chainRender=chainRender;chainRender();
}

  const curCh=ROUNDS[fromRi].ch;
  const nxtCh=ROUNDS[next].ch;
  if(nxtCh!==curCh){fade(()=>showChapter(nxtCh));}
  else{fade(()=>showRound(next));}
}

function showBalanceRound(){
  function getTotal(){return Object.values(state.balance).reduce((a,b)=>a+b,0);}
  function render(){
    const total=getTotal();
    const ok=total===100;
    G.innerHTML=`<div class="scene sky-clear">
      ${mtn('sky-clear')}
      <div class="overlay">
        <div class="chapter-label t-label">第四章 · 融合</div>
        <div class="chapter-title t-main" style="font-size:22px;margin-bottom:0.75rem">建立你的系統</div>
        <div class="round-text t-sub" style="margin-bottom:1.75rem">你已經走過了資訊的迷宮，看見了經濟的立體拼圖，<br>也誠實面對了自己對財富的渴望。<br><br>現在，調整屬於你自己的投資配重。<br>沒有標準答案，只有適合你的那一個。</div>
        <div class="balance-container">
          ${BALANCE_ITEMS.map(it=>`

function calcPersonality(){
  const get=(ri)=>state.scores.find(x=>x.round===ri)?.choice??0;
  const ch0=[0,1,2,3,4].map(i=>get(i));
  const ch1=[5,6,7,8].map(i=>get(i));
  const ch2=[9,10,11].map(i=>get(i));
  const impulsive=ch0.filter(c=>c===0).length;
  const systematic=ch1.filter(c=>c===1).length;
  const parallel=ch2[2]===0;
  if(parallel&&systematic>=3)return 5;
  if(parallel)return 4;
  if(systematic>=3)return 3;
  if(impulsive>=4)return 0;
  if(ch0.filter(c=>c===1).length>=4)return 1;
  return 2;
}

}
function restart(){
  state={chIndex:-1,roundIndex:-1,scores:[],balance:{index:25,stock:25,longterm:25,shortterm:25},quoteIndex:0};
  PB.style.width='0%';
  fade(()=>showStart());
}

function shareGame(){
  const url=window.location.href.split('?')[0];
  const text='我剛完成了《投資者的修行》，一個關於人性與投資智慧的互動體驗。你也來試試看你是哪種投資人格？';
  const btn=document.getElementById('shareBtn');
  const fb=document.getElementById('shareFeedback');
  
  // 記住目前的動態按鈕文字
  const originalText = btn.innerHTML;

  // 如果有手機原生分享，優先呼叫
  if(navigator.share){
    navigator.share({title:'投資者的修行 · Yoda Research',text:text,url:url}).catch(()=>{});
    return;
  }

  // 統一的「複製成功」畫面回饋動作
  const showSuccess = () => {
    btn.classList.add('copied');
    btn.innerHTML='&#10003; 網址已複製';
    fb.textContent='貼到 LINE、Facebook 或任何地方分享吧';
    fb.style.opacity='1';
    setTimeout(()=>{
      btn.classList.remove('copied');
      btn.innerHTML = originalText; // 還原為動態文字
      fb.style.opacity='0';
    },3000);
  };

  // 傳統備用複製法（給 file:/// 或舊瀏覽器用）
  const fallbackCopy = () => {
    try {
      const box=document.createElement('input');
      box.value=url;
      box.style.position = 'fixed'; // 避免畫面跳動
      box.style.opacity = '0';
      document.body.appendChild(box);
      box.select();
      document.execCommand('copy');
      document.body.removeChild(box);
      showSuccess();
    } catch(e) {
      fb.textContent='請手動複製網址分享！';
      fb.style.opacity='1';
      setTimeout(()=>{fb.style.opacity='0';},3000);
    }
  };

  // 安全檢查：確認 Clipboard API 存在才呼叫，否則使用備用法
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url)
      .then(showSuccess)
      .catch(fallbackCopy); // 如果 API 拒絕，也降級用備用法
  } else {
    fallbackCopy();
  }
}
window.shareGame=shareGame;
window.fade=fade;

window.choose=choose;
window.advanceFromRound=advanceFromRound;

showStart();
</script>
