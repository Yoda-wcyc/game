// ===== 水墨背景 bg(type,sky) =====
function inkCols(sky){const dark=['sky-storm','sky-valley','sky-dawn','sky-dusk','sky-night','sky-start'].includes(sky);
  return dark?['rgba(210,220,245,0.10)','rgba(180,195,230,0.16)','rgba(222,232,252,0.32)']:['rgba(30,35,60,0.10)','rgba(25,30,55,0.16)','rgba(20,25,50,0.28)'];}
const MOTIFS={
 farhills:(f,n,l)=>`<path d="M0,70 C120,50 220,58 340,44 C460,32 560,52 700,40 C840,30 960,50 1080,42 L1200,46 L1200,120 L0,120Z" fill="${f}"/><path d="M0,86 C160,74 300,82 460,70 C640,58 780,76 940,68 C1060,62 1140,72 1200,70 L1200,120 L0,120Z" fill="${n}"/><path d="M0,70 C120,50 220,58 340,44 C460,32 560,52 700,40 C840,30 960,50 1080,42 L1200,46" fill="none" stroke="${l}" stroke-width="1.4"/>`,
 range:(f,n,l)=>`<path d="M0,64 C180,40 300,52 460,36 C620,20 760,44 920,34 C1040,26 1140,40 1200,38 L1200,120 L0,120Z" fill="${f}"/><path d="M0,82 C160,66 320,76 480,60 C640,46 800,70 960,60 C1080,54 1160,64 1200,62 L1200,120 L0,120Z" fill="${n}"/><path d="M0,100 C220,90 420,96 640,86 C860,78 1020,92 1200,84 L1200,120 L0,120Z" fill="${n}"/><path d="M0,64 C180,40 300,52 460,36 C620,20 760,44 920,34 C1040,26 1140,40 1200,38" fill="none" stroke="${l}" stroke-width="1.2" opacity="0.85"/>`,
 peak:(f,n,l)=>`<path d="M0,104 C260,100 430,94 520,56 C560,40 600,20 640,20 C680,20 720,42 760,60 C860,100 1000,102 1200,100 L1200,120 L0,120Z" fill="${n}"/><path d="M600,28 C612,42 628,54 640,60" fill="none" stroke="${l}" stroke-width="1.4"/><rect x="300" y="62" width="620" height="10" fill="${f}"/><path d="M120,86 h240 M470,86 h180 M760,90 h300" stroke="${f}" stroke-width="8" stroke-linecap="round" opacity="0.7"/>`,
 river:(f,n,l)=>`<path d="M0,90 C300,82 500,86 1200,84 L1200,120 L0,120Z" fill="${f}"/><path d="M470,82 Q540,98 610,82" fill="none" stroke="${l}" stroke-width="1.8" stroke-linecap="round"/><path d="M120,94 q80,-4 160,0 t160,0 M700,96 q80,-4 160,0 t160,0" fill="none" stroke="${l}" stroke-width="1" opacity="0.6"/>`};
function bg(type,sky){const m=MOTIFS[type];if(!m)return '';const[f,n,l]=inkCols(sky);return `<svg class="ink-bg" viewBox="0 0 1200 120" preserveAspectRatio="none">${m(f,n,l)}</svg>`;}

// 折線圖（市場寬度用）
function lineChart(o){
  const W=300,H=o.h||96,L=34,R=292,T=10,B=H-16;
  let s='<svg viewBox="0 0 300 '+H+'" style="width:100%;max-width:300px;margin:0 auto;display:block">';
  s+='<text x="'+L+'" y="8" fill="rgba(255,255,255,0.62)" font-size="9.5">'+o.title+'</text>';
  let lo=Infinity,hi=-Infinity;
  o.series.forEach(function(se){se.v.forEach(function(v){if(v<lo)lo=v;if(v>hi)hi=v;});});
  if(o.min!=null)lo=Math.min(lo,o.min);if(o.max!=null)hi=Math.max(hi,o.max);
  const pad=(hi-lo)*0.12||1;lo-=pad;hi+=pad;
  const n=o.series[0].v.length;
  const px=function(i){return n<2?L:L+(R-L)*i/(n-1);};
  const py=function(v){return B-(B-T)*(v-lo)/(hi-lo);};
  if(o.band){s+='<rect x="'+L+'" y="'+py(o.band[1])+'" width="'+(R-L)+'" height="'+Math.max(0,py(o.band[0])-py(o.band[1]))+'" fill="rgba(255,255,255,0.07)"/>';}
  const lbs=[];
  o.series.forEach(function(se){
    let d='';for(let i=0;i<se.v.length;i++)d+=(i?'L':'M')+px(i).toFixed(1)+','+py(se.v[i]).toFixed(1)+' ';
    s+='<path d="'+d+'" fill="none" stroke="'+se.c+'" stroke-width="'+(se.w||2)+'"/>';
    const li=se.v.length-1;
    s+='<circle cx="'+px(li).toFixed(1)+'" cy="'+py(se.v[li]).toFixed(1)+'" r="3" fill="'+se.c+'" class="gpulse"/>';
    lbs.push({y:py(se.v[li])-6,c:se.c,t:se.lab});
  });
  lbs.sort(function(a,b){return a.y-b.y;});
  for(let i=0;i<lbs.length;i++){lbs[i].y=Math.max(lbs[i].y,T+9);if(i&&lbs[i].y-lbs[i-1].y<11)lbs[i].y=lbs[i-1].y+11;}
  lbs.forEach(function(l){s+='<text x="'+(R-2)+'" y="'+l.y.toFixed(1)+'" fill="'+l.c+'" font-size="10" text-anchor="end">'+l.t+'</text>';});
  s+='<text x="'+L+'" y="'+(H-4)+'" fill="rgba(255,255,255,0.45)" font-size="9">'+o.x0+'</text>';
  s+='<text x="'+R+'" y="'+(H-4)+'" fill="rgba(255,255,255,0.45)" font-size="9" text-anchor="end">'+o.x1+'</text>';
  return s+'</svg>';
}

// 格名、軸定義、按兵不動帶、窗格一律照報告；四個窗口的落點由 FUT 現算，不寫死
const FQ_WINS=[[1,'當日'],[5,'5日'],[20,'20日'],[60,'60日']];
const FQ_CELL={
 tr:{n:'偏多',c:'#ff6b7d',s:'買＋期指往多',d:'買股票、期指也往多＝兩隻手同向做多'},
 br:{n:'避險',c:'#ffd28a',s:'買＋期指加空',d:'買股票、期指加空＝買現貨、鎖指數（中性）'},
 tl:{n:'保守調節',c:'#8fd3e8',s:'賣＋期指往多',d:'賣股票、期指反而往多＝獲利了結式調節，方向沒翻（中性）'},
 bl:{n:'偏空',c:'#7fd0a0',s:'賣＋期指加空',d:'賣股票、期指又加空＝兩隻手同向看壞'},
 bandB:{n:'偏多（現貨主導）',c:'#e6c463',s:'',d:'現貨買、期貨按兵不動——用股票表態，沒開槓桿'},
 bandS:{n:'兩邊都沒動作',c:'#9ab8ff',s:'',d:'現貨賣、期貨按兵不動——調節持股但沒有踩空，不是方向翻轉的賣法（中性）'}};
// 落在按兵不動帶：點現貨那一邊的任一格都算對
function fqHit(ans,cell){return ans===cell||(ans==='bandB'&&(cell==='tr'||cell==='br'))||(ans==='bandS'&&(cell==='tl'||cell==='bl'));}
function fqVal(i,w){const lo=Math.max(0,i-w+1);let a=0,c=0;
 for(let j=lo;j<=i;j++){if(FUT.spot[j]!=null){a+=FUT.spot[j];c++;}}
 if(!c)return null;const lo2=i-w,base=(lo2>=0)?FUT.eq[lo2]:FUT.eq[0];
 return {x:Math.round(a*100)/100,y:FUT.eq[i]-base,part:(lo2<0)||(c<(i-lo+1))};}
function fqStance(x,y){if(Math.abs(y)<FUT.band)return x>0?'bandB':'bandS';
 if(x>0&&y>0)return 'tr';if(x>0)return 'br';if(y>0)return 'tl';return 'bl';}
function fqScale(w){const xs=[],ys=[];
 for(let i=0;i<FUT.eq.length;i++){const v=fqVal(i,w);if(v){xs.push(Math.abs(v.x));ys.push(Math.abs(v.y));}}
 const pct=function(a){if(!a.length)return 1;a.sort(function(m,q){return m-q;});return a[Math.floor((a.length-1)*0.90)];};
 return [Math.max(pct(xs)*1.15,150),Math.max(pct(ys)*1.15,FUT.band*2.2)];}
const FQ_LAST=FUT.eq.length-1;
const FQ=FQ_WINS.map(function(w){const v=fqVal(FQ_LAST,w[0]),sc=fqScale(w[0]);
 return {w:w[0],n:w[1],x:v.x,y:v.y,part:v.part,ans:fqStance(v.x,v.y),xm:sc[0],ym:sc[1]};});
function fqNum(v,unit){return (v>0?'+':v<0?'−':'')+Math.abs(Math.round(v)).toLocaleString('en-US')+unit;}
function fqSpot(v){return (v>0?'買超 ':'賣超 ')+Math.abs(Math.round(v)).toLocaleString('en-US')+' 億';}
const FQG={X0:34,X1:290,Y0:16,Y1:220};FQG.cx=(FQG.X0+FQG.X1)/2;FQG.cy=(FQG.Y0+FQG.Y1)/2;FQG.hw=(FQG.X1-FQG.X0)/2;FQG.hh=(FQG.Y1-FQG.Y0)/2;
function fqClamp(t){return Math.max(-1,Math.min(1,t));}
function fqXY(k){const f=FQ[k];return [FQG.cx+fqClamp(f.x/f.xm)*(FQG.hw-10),FQG.cy-fqClamp(f.y/f.ym)*(FQG.hh-10)];}

 const b1=qy(FUT.band),b2=qy(-FUT.band);
 s+='<rect x="'+g.X0+'" y="'+b1.toFixed(1)+'" width="'+(g.hw*2)+'" height="'+Math.max(1,b2-b1).toFixed(1)+'" fill="rgba(170,180,200,0.20)" pointer-events="none"/>';
 s+='<line x1="'+g.X0+'" y1="'+b1.toFixed(1)+'" x2="'+g.X1+'" y2="'+b1.toFixed(1)+'" stroke="rgba(200,210,225,0.55)" stroke-dasharray="3 3" pointer-events="none"/>';
 s+='<line x1="'+g.X0+'" y1="'+b2.toFixed(1)+'" x2="'+g.X1+'" y2="'+b2.toFixed(1)+'" stroke="rgba(200,210,225,0.55)" stroke-dasharray="3 3" pointer-events="none"/>';

 const chips=r.chips?'<div style="max-width:480px;margin:0 auto 0.4rem">'+r.chips.map(function(c){return '<span class="data-chip">'+c+'</span>';}).join('')+'</div>':'';
 const so=r.so?'<div class="sowhat">'+r.so+'</div>':'';
 const fig=r.svg?'<div style="margin:0.5rem auto 0.2rem">'+r.svg+'</div>':'';
 return '<div class="chapter-label t-label">'+r.label+'</div><div class="chapter-title t-main" style="font-size:22px;margin-bottom:0.9rem">'+r.title+'</div><div class="round-text t-sub">'+r.text+'</div>'+so+layers+chips+fig;}
function note(r){return r.note?'<div class="fig-note">'+r.note+'</div>':'';}
function btnGive(i){return '<button class="continue-btn" style="opacity:0.72" onclick="giveAnswer('+i+')">給我答案</button>';}
function okBox(txt){return '<div style="max-width:480px;margin:0.7rem auto 0;background:rgba(0,0,0,0.32);border:1px solid rgba(255,255,255,0.26);border-radius:10px;padding:0.9rem 1.1rem;font-size:13.5px;line-height:1.8;color:#fff;text-align:left;backdrop-filter:blur(6px)">'+txt+'</div>';}

function showStart(){
 const mins=gameMins();
 G.innerHTML=scene('sky-start','farhills',
  '<div class="chapter-label t-label" style="margin-bottom:1rem">YODA RESEARCH · 判斷力學校</div>'
  +'<div class="chapter-title t-main" style="font-size:30px;font-weight:200;letter-spacing:1px;margin-bottom:0.4rem">讀懂台股報告</div>'
  +'<div class="t-sub" style="font-size:14px;margin-bottom:0.3rem;font-style:italic">看得懂每一個數字，卻被一天的數字甩著走</div>'
  +'<div class="t-label" style="font-size:12px;line-height:1.9;margin-bottom:2.6rem">約 '+mins+' 分鐘 · '+ROUNDS.length+' 站，跟著報告 '+SECS.length+' 段走<br>讀數取自 '+ASOF+' 那一份台股報告</div>'
  +'<button class="continue-btn" style="font-size:15px;padding:0.85rem 3.2rem;border-radius:6px;letter-spacing:2px" onclick="fade(startOpening)">開始</button>');}
let oi=0;function startOpening(){oi=0;renderOpening();}
function renderOpening(){const q=OPENING.quotes[oi],last=oi>=OPENING.quotes.length-1;
 G.innerHTML=scene(OPENING.sky,OPENING.bg,'<div class="chapter-label t-label">'+OPENING.label+'</div><div class="chapter-title t-main">'+OPENING.title+'</div><div class="chapter-quote t-sub">'+q+'</div><button class="continue-btn" onclick="nextOpening()">'+(last?'開始第一站 ›':'繼續 ›')+'</button>');}
function nextOpening(){oi++;if(oi>=OPENING.quotes.length)fade(function(){showRound(0);});else fade(renderOpening);}

function showRound(i){state.idx=i;prog();const r=ROUNDS[i];
 if(r.type==='ab')renderAB(i);
 else if(r.type==='place')renderPlace(i);
 else if(r.type==='hotspot')renderHotspot(i);
 else if(r.type==='slider')renderSlider(i);
 else if(r.type==='sort')renderSort(i);
 else if(r.type==='match')renderMatch(i);
 else if(r.type==='flip')renderFlip(i);
 else if(r.type==='chain')renderChain(i);
 else if(r.type==='fxquad')renderFxquad(i);
 else if(r.type==='fxhedge')renderFxhedge(i);
 else if(r.type==='build')renderBuild(i);}

// ── 選擇題 ──
function renderAB(i){const r=ROUNDS[i];
 G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+note(r)+'<div class="round-q t-main">'+r.q+'</div>'
  +'<div class="choices">'+r.choices.map(function(c,k){return '<button class="choice-btn" onclick="abPick('+i+','+k+')">'+c+'</button>';}).join('')+'</div>'
  +btnGive(i));}
function abPick(i,k){const r=ROUNDS[i];if(k===r.correct)state.score++;
 const col=k===r.correct?'#a5d6a7':'#ffcc80';
 G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+'<div class="feedback" style="color:'+col+';min-height:auto;font-size:14px">'+r.fb[k]+'</div><button class="continue-btn" onclick="record('+i+')">繼續 ›</button>');}

// ── 兩段式點選歸位（place / build 共用）──
function placeBody(i,cards,slots,wide,rev,marks){
 const used={};Object.keys(state.pl).forEach(function(s){state.pl[s].forEach(function(c){used[c]=1;});});
 const pool=cards.filter(function(c){return !used[c[0]];});
 let h='<div class="pl-pool">'+(pool.length?pool.map(function(c){
   return '<div class="pl-card'+(state.plSel===c[0]?' sel':'')+'" onclick="plCard(\''+c[0]+'\')">'+c[1]+'</div>';}).join(''):'<div class="t-label" style="font-size:12px">都放好了 —— 按「檢查」</div>')+'</div>';
 h+='<div class="pl-slots">'+slots.map(function(s){
   const got=state.pl[s[0]]||[];
   const chips=got.map(function(cid){const cc=cards.filter(function(x){return x[0]===cid;})[0];return '<span class="pl-chip">'+cc[1]+'</span>';}).join('');
   let cls='pl-slot'+(wide?' wide':'');
   if(marks&&marks[s[0]]!==undefined)cls+=marks[s[0]]?' right':' wrong';
   else if(state.plSel)cls+=' armed';
   return '<div class="'+cls+'" onclick="plSlot(\''+s[0]+'\','+i+')"><div class="sl-t">'+s[1]+'</div><div class="sl-v">'+(chips||'<span style="font-size:11.5px;color:rgba(255,255,255,0.4)">點這裡放進來</span>')+'</div></div>';}).join('')+'</div>';
 return h;}
function plCard(id){state.plSel=(state.plSel===id?null:id);window.plDraw();}
function plSlot(sid,i){const r=ROUNDS[i];const slots=(r.type==='flip')?r.slots:r.slots;
 const cap=slots.filter(function(s){return s[0]===sid;})[0][2].split(',').length;
 if(state.plSel){
   Object.keys(state.pl).forEach(function(k){state.pl[k]=state.pl[k].filter(function(c){return c!==state.plSel;});});
   if(!state.pl[sid])state.pl[sid]=[];
   if(state.pl[sid].length>=cap)state.pl[sid].shift();
   state.pl[sid].push(state.plSel);state.plSel=null;
 }else if(state.pl[sid]&&state.pl[sid].length){state.pl[sid].pop();}
 window.plDraw();}
function plFull(slots){let n=0;Object.keys(state.pl).forEach(function(k){n+=state.pl[k].length;});
 let need=0;slots.forEach(function(s){need+=s[2].split(',').length;});return n===need;}
function plMarks(slots){const m={};slots.forEach(function(s){
  const want=s[2].split(',').sort().join(',');const got=(state.pl[s[0]]||[]).slice().sort().join(',');m[s[0]]=(want===got);});return m;}
function renderPlace(i){const r=ROUNDS[i];
 if(state.plFor!==i){state.plFor=i;state.pl={};state.plSel=null;}
 function draw(){G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+note(r)+'<div class="round-q t-main" style="font-size:15px">'+r.q+'</div>'
   +placeBody(i,r.cards,r.slots,r.wide)
   +'<div class="btnrow">'+(plFull(r.slots)?'<button class="continue-btn" onclick="plCheck('+i+')">檢查</button>':'')+btnGive(i)+'</div>');}
 window.plDraw=draw;draw();}
function plCheck(i){const r=ROUNDS[i];const m=plMarks(r.slots);
 let ok=0;Object.keys(m).forEach(function(k){if(m[k])ok++;});
 if(ok===r.slots.length)state.score++;
 G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+placeBody(i,r.cards,r.slots,r.wide,true,m)
  +'<div class="feedback" style="color:'+(ok===r.slots.length?'#a5d6a7':'#ffcc80')+';min-height:auto;font-size:13.5px">放對 '+ok+'/'+r.slots.length+' 格</div>'
  +okBox(r.done)+'<button class="continue-btn" onclick="record('+i+')">繼續 ›</button>');}

// ── 點圖熱區 ──
function hsPick(k){const i=state.hsFor,r=ROUNDS[i];const p=state.hs.indexOf(k);
 if(p>=0)state.hs.splice(p,1);
 else{if(state.hs.length>=r.need.length)state.hs.shift();state.hs.push(k);}
 window.hsDraw();}
function renderHotspot(i){const r=ROUNDS[i];
 if(state.hsFor!==i){state.hsFor=i;state.hs=[];}
 function draw(){const done=state.hs.length===r.need.length;
  G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+'<div class="round-q t-main" style="font-size:15px">'+r.q+'</div>'
   +quadBox(r.quad,state.hs,null)+note(r)
   +'<div class="btnrow">'+(done?'<button class="continue-btn" onclick="hsCheck('+i+')">檢查</button>':'')+btnGive(i)+'</div>');}
 window.hsDraw=draw;draw();}
function hsCheck(i){const r=ROUNDS[i];
 const ok=r.need.slice().sort().join(',')===state.hs.slice().sort().join(',');
 if(ok)state.score++;
 G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+quadBox(r.quad,state.hs,r.need)+note(r)
  +okBox('<span style="color:'+(ok?'#a5d6a7':'#ffcc80')+'">'+(ok?'答對了。':'差一點——正解已經標綠。')+'</span><br>'+(ok?r.fbOk:r.fbNo+'<br><br>'+r.fbOk))
  +'<button class="continue-btn" onclick="record('+i+')">繼續 ›</button>');}

// ── 滑桿 ──
function slUpd(){const i=state.slFor,r=ROUNDS[i];
 const f=document.getElementById('slfig');if(f)f.innerHTML=r.fig(state.sv);
 const l=document.getElementById('slval');if(l)l.innerHTML=r.vlab(state.sv);}
function renderSlider(i){const r=ROUNDS[i];
 if(state.slFor!==i){state.slFor=i;state.sv=r.slider.init;}
 G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+'<div class="round-q t-main" style="font-size:15px">'+r.q+'</div>'
  +'<div id="slfig">'+r.fig(state.sv)+'</div>'+note(r)
  +'<div class="gauge-wrap" style="max-width:440px"><input type="range" class="gsl" min="'+r.slider.min+'" max="'+r.slider.max+'" value="'+state.sv+'" oninput="state.sv=parseInt(this.value);slUpd()">'
  +'<div class="gsl-ends"><span>'+r.slider.min+'</span><span>'+r.slider.max+'</span></div></div>'
  +'<div id="slval" class="feedback" style="min-height:38px;font-size:13.5px;color:#fff">'+r.vlab(state.sv)+'</div>'
  +'<div class="btnrow"><button class="continue-btn" onclick="slDone('+i+')">就這樣 ›</button>'+btnGive(i)+'</div>');}
function slDone(i){const r=ROUNDS[i];const ok=r.correct(state.sv);if(ok)state.score++;
 G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+'<div id="slfig">'+r.fig(state.sv)+'</div>'+note(r)
  +'<div class="feedback" style="min-height:auto;font-size:13.5px;color:#fff">'+r.vlab(state.sv)+'</div>'
  +okBox('<span style="color:'+(ok?'#a5d6a7':'#ffcc80')+'">'+(ok?'到了。':'還沒到——不過答案在這裡。')+'</span><br>'+(ok?r.fbOk:r.fbNo+'<br><br>'+r.fbOk))
  +'<button class="continue-btn" onclick="record('+i+')">繼續 ›</button>');}

// ── 排序（點兩張互換）──
function soPick(k){if(state.soSel===null){state.soSel=k;}
 else if(state.soSel===k){state.soSel=null;}
 else{const a=state.so[state.soSel];state.so[state.soSel]=state.so[k];state.so[k]=a;state.soSel=null;}
 window.soDraw();}
function soBody(r,marks){return '<div class="st-list">'+state.so.map(function(v,k){
  let cls='st-row'+(state.soSel===k?' sel':'');
  if(marks)cls+=(v===k?' right':' wrong');
  return '<div class="'+cls+'" onclick="soPick('+k+')"><b>'+(k+1)+'</b><span>'+r.items[v].replace(/^\d+\s/,'')+'</span></div>';}).join('')+'</div>';}
function renderSort(i){const r=ROUNDS[i];
 if(state.soFor!==i){state.soFor=i;state.so=r.shuffle.slice();state.soSel=null;}
 function draw(){G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+'<div class="round-q t-main" style="font-size:15px">'+r.q+'</div>'
   +soBody(r)+note(r)
   +'<div class="btnrow"><button class="continue-btn" onclick="soCheck('+i+')">檢查</button>'+btnGive(i)+'</div>');}
 window.soDraw=draw;draw();}
function soCheck(i){const r=ROUNDS[i];let ok=0;state.so.forEach(function(v,k){if(v===k)ok++;});
 if(ok>=r.items.length-1)state.score++;
 G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+soBody(r,true)
  +'<div class="feedback" style="color:'+(ok===r.items.length?'#a5d6a7':'#ffcc80')+';min-height:auto;font-size:13.5px">排對 '+ok+'/'+r.items.length+' 格</div>'
  +okBox(r.fbOk)+'<button class="continue-btn" onclick="record('+i+')">繼續 ›</button>');}

// ── 連連看 ──
function mtPick(side,k){if(side==='L'){state.mtSel=(state.mtSel===k?null:k);}
 else if(state.mtSel){
   Object.keys(state.mt).forEach(function(l){if(state.mt[l]===k)delete state.mt[l];});
   state.mt[state.mtSel]=k;state.mtSel=null;}
 window.mtDraw();}
function mtLines(){const svg=document.getElementById('mtlines');if(!svg)return;
 const wrap=document.getElementById('mtwrap');if(!wrap)return;
 const wb=wrap.getBoundingClientRect();let s='';
 Object.keys(state.mt).forEach(function(l){
   const a=document.getElementById('mtL'+l),b=document.getElementById('mtR'+state.mt[l]);
   if(!a||!b)return;
   const ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();
   const x1=ra.right-wb.left,y1=ra.top-wb.top+ra.height/2,x2=rb.left-wb.left,y2=rb.top-wb.top+rb.height/2;
   const mid=(x1+x2)/2;
   s+='<path d="M'+x1+','+y1+' C'+mid+','+y1+' '+mid+','+y2+' '+x2+','+y2+'" fill="none" stroke="rgba(224,165,38,0.85)" stroke-width="2"/>';
   s+='<circle cx="'+x1+'" cy="'+y1+'" r="3.5" fill="#e0a526"/><circle cx="'+x2+'" cy="'+y2+'" r="3.5" fill="#e0a526"/>';});
 svg.innerHTML=s;svg.setAttribute('viewBox','0 0 '+wb.width+' '+wb.height);}
function mtBody(r,marks){
 let h='<div class="mt-wrap" id="mtwrap"><svg class="mt-lines" id="mtlines" preserveAspectRatio="none"></svg><div class="mt-cols"><div class="mt-col">';
 h+=r.left.map(function(x){let c='mt-item'+(state.mtSel===x[0]?' sel':'')+(state.mt[x[0]]?' on':'');
   if(marks)c+=(state.mt[x[0]]===x[0]?' right':' wrong');
   return '<div class="'+c+'" id="mtL'+x[0]+'" onclick="mtPick(\'L\',\''+x[0]+'\')">'+x[1]+'</div>';}).join('');
 h+='</div><div class="mt-col">';
 h+=r.right.map(function(x){const linked=Object.keys(state.mt).filter(function(l){return state.mt[l]===x[0];}).length>0;
   return '<div class="mt-item'+(linked?' on':'')+'" id="mtR'+x[0]+'" onclick="mtPick(\'R\',\''+x[0]+'\')">'+x[1]+'</div>';}).join('');
 return h+'</div></div></div>';}
function renderMatch(i){const r=ROUNDS[i];
 if(state.mtFor!==i){state.mtFor=i;state.mt={};state.mtSel=null;}
 function draw(){const done=Object.keys(state.mt).length===r.left.length;
  G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+'<div class="round-q t-main" style="font-size:15px">'+r.q+'</div>'
   +mtBody(r)+note(r)
   +'<div class="btnrow">'+(done?'<button class="continue-btn" onclick="mtCheck('+i+')">檢查</button>':'')+btnGive(i)+'</div>');
  mtLines();}
 window.mtDraw=draw;draw();}
function mtCheck(i){const r=ROUNDS[i];let ok=0;r.left.forEach(function(x){if(state.mt[x[0]]===x[0])ok++;});
 if(ok===r.left.length)state.score++;
 G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+mtBody(r,true)
  +'<div class="feedback" style="color:'+(ok===r.left.length?'#a5d6a7':'#ffcc80')+';min-height:auto;font-size:13.5px">接對 '+ok+'/'+r.left.length+' 條</div>'
  +okBox(ok===r.left.length?r.fbOk:r.fbNo+'<br><br>'+r.fbOk)
  +'<button class="continue-btn" onclick="record('+i+')">繼續 ›</button>');
 mtLines();}

// ── 翻牌 ＋ 建構收尾 ──
function renderFlip(i){const r=ROUNDS[i];
 if(state.fpFor!==i){state.fpFor=i;state.fp=0;state.pl={};state.plSel=null;state.plFor=i;}
 if(state.fp===0){
   G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+'<div class="round-q t-main" style="font-size:15px">'+r.q+'</div>'
    +'<div class="fp-bets">'+r.bets.map(function(b){return '<button class="fp-bet" onclick="fpBet('+i+',\''+b[0]+'\')">'+b[1]+'</button>';}).join('')+'</div>'
    +btnGive(i));
 }else{fpBuild(i);}}
function fpBet(i,k){const r=ROUNDS[i];if(k===r.betOk)state.score++;
 G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+r.reveal
  +okBox('<span style="color:'+(k===r.betOk?'#a5d6a7':'#ffcc80')+'">'+(k===r.betOk?'你押對了。':'押反了——但重點不在猜對。')+'</span><br>'+r.revealTxt)
  +(r.cards?'<button class="continue-btn" onclick="fpNext('+i+')">最後一件事 ›</button>':'<button class="continue-btn" onclick="record('+i+')">繼續 ›</button>'));}
function fpNext(i){state.fp=1;fade(function(){fpBuild(i);});}
function fpBuild(i){const r=ROUNDS[i];
 G.innerHTML=scene('sky-clear','range',dots(i)
  +'<div class="chapter-label t-label">'+r.label+' · 收尾</div><div class="chapter-title t-main" style="font-size:22px;margin-bottom:0.9rem">親手把開牌日排進日曆</div>'
  +'<div class="round-q t-main" style="font-size:15px">'+r.buildQ+'</div>'
  +placeBody(i,r.cards,r.slots,true)
  +'<div class="btnrow">'+(plFull(r.slots)?'<button class="continue-btn" onclick="fpDone('+i+')">排好了 ›</button>':'')+btnGive(i)+'</div>');
 window.plDraw=function(){fpBuild(i);};}
function fpDone(i){const r=ROUNDS[i];const m=plMarks(r.slots);
 let ok=0;Object.keys(m).forEach(function(k){if(m[k])ok++;});
 G.innerHTML=scene('sky-clear','range',dots(i)
  +'<div class="chapter-label t-label">'+r.label+' · 收尾</div><div class="chapter-title t-main" style="font-size:22px;margin-bottom:0.9rem">親手把開牌日排進日曆</div>'
  +placeBody(i,r.cards,r.slots,true,true,m)
  +okBox(r.done)+'<button class="continue-btn" onclick="record('+i+')">看我學會了什麼 ›</button>');}

// ── 外資四格：點窗口切換 ＋ 點格判讀（§08）──
let FQ_TIMER=null;
function fqAnimate(from,to){if(FQ_TIMER){clearInterval(FQ_TIMER);FQ_TIMER=null;}
 const t0=Date.now(),D=520;
 FQ_TIMER=setInterval(function(){let t=(Date.now()-t0)/D;if(t>1)t=1;const e=1-Math.pow(1-t,3);
   const g=document.getElementById('fqdotg');
   if(g)g.setAttribute('transform','translate('+(from[0]+(to[0]-from[0])*e).toFixed(1)+','+(from[1]+(to[1]-from[1])*e).toFixed(1)+')');
   if(t>=1||!g){clearInterval(FQ_TIMER);FQ_TIMER=null;}},30);}
function fqNextWin(){for(let k=0;k<FQ.length;k++){if(state.fqPicks[k]===undefined)return k;}return -1;}
function fqSeg(){return '<div class="fq-seg">'+FQ.map(function(f,k){const p=state.fqPicks[k];
  let cls=(k===state.fqWin?'on':''),mk='';
  if(p!==undefined)mk=(fqHit(f.ans,p)?' <span class="ok">✓</span>':' <span class="ng">✗</span>');
  else if(k!==state.fqWin&&fqNextWin()===k)cls+=' nx';
  return '<button class="'+cls+'" onclick="fqWinSel('+k+')">'+f.n+mk+'</button>';}).join('')+'</div>';}
function fqRead(k){const f=FQ[k];
 return '<div class="fq-read"><b>'+f.n+'窗</b> · '+FUT.d[FQ_LAST]+'<br>現貨窗內累計 <span class="'+(f.x>0?'sgp':'sgn')+'">'+fqSpot(f.x)+'</span>　×　期指窗內增減 <span class="'+(f.y>0?'sgp':'sgn')+'">'+fqNum(f.y,' 口')+'</span>'
  +(f.part?'<br><span style="font-size:11.5px;opacity:.72">※ 帳本只有 '+FUT.eq.length+' 天，這個窗以現有紀錄計</span>':'')+'</div>';}
function fqLine(k){const f=FQ[k],p=state.fqPicks[k];
 if(p===undefined)return '<div class="fig-note">點圖上的一格。中間灰帶＝按兵不動帶（±'+FUT.band.toLocaleString('en-US')+' 口）</div>';
 const C=FQ_CELL[f.ans];
 return '<div class="feedback" style="min-height:auto;font-size:13px;color:'+(fqHit(f.ans,p)?'#a5d6a7':'#ffcc80')+'">'+(fqHit(f.ans,p)?'✓ 對：':'✗ 差一點，落點在「'+C.n+'」：')+f.n+'窗＝<b style="color:'+C.c+'">'+C.n+'</b>——'+C.d+'</div>';}
function renderFxquad(i){
 if(state.fqFor!==i){state.fqFor=i;state.fqStep=0;state.fqWin=0;state.fqPicks={};state.fqChecked=false;}
 fqDraw(i,null);}
function fqDraw(i,at){const r=ROUNDS[i],k=state.fqWin,done=state.fqPicks[k]!==undefined,nx=fqNextWin();
 G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+'<div class="round-q t-main" style="font-size:15px">'+r.q+'</div>'
  +fqSeg()+fqRead(k)
  +fqSvg(k,{click:!done,pick:state.fqPicks[k],reveal:done,dot:done,at:at})
  +fqLine(k)
  +'<div class="btnrow">'+(nx<0?'<button class="continue-btn" onclick="fqCheck('+i+')">把 '+FQ.length+' 個窗口放在一起看 ›</button>':(done?'<button class="continue-btn" onclick="fqWinSel('+nx+')">下一個窗口：'+FQ[nx].n+' ›</button>':''))+btnGive(i)+'</div>');}
function fqPick(cell){const i=state.fqFor,k=state.fqWin;
 if(state.fqStep!==0||state.fqPicks[k]!==undefined)return;
 state.fqPicks[k]=cell;const from=[FQG.cx,FQG.cy];
 fqDraw(i,from);fqAnimate(from,fqXY(k));}
function fqWinSel(k){const i=state.fqFor;if(state.fqStep!==0||k<0||k>=FQ.length)return;
 const prev=state.fqWin,from=(state.fqPicks[prev]!==undefined)?fqXY(prev):[FQG.cx,FQG.cy];
 state.fqWin=k;
 if(state.fqPicks[k]!==undefined){fqDraw(i,from);fqAnimate(from,fqXY(k));}else fqDraw(i,null);}
function fqCheck(i){const r=ROUNDS[i];let ok=0;FQ.forEach(function(f,k){if(fqHit(f.ans,state.fqPicks[k]))ok++;});
 if(!state.fqChecked){state.fqChecked=true;if(ok>=FQ.length-1)state.score++;}
 G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+fqSeg()+fqMini()
  +'<div class="feedback" style="color:'+(ok===FQ.length?'#a5d6a7':'#ffcc80')+';min-height:auto;font-size:13.5px">'+FQ.length+' 個窗口點對 '+ok+' 個</div>'
  +okBox(r.fbOk)+'<button class="continue-btn" onclick="record('+i+')">繼續 ›</button>');}

// ── ② 外資多空力道：點圖例開線 → 點線作答；再押避險比重（§08）──
function renderFxhedge(i){
 if(state.fhFor!==i){state.fhFor=i;state.fhStep=0;state.fhVis={tot:true,sp:false,fu:false};state.fhPick=null;state.fhGave=false;}
 if(state.fhStep===1){fhA(i);return;}
 fhDraw(i);}
function fhDraw(i){const r=ROUNDS[i],v=state.fhVis,both=v.sp&&v.fu,p=state.fhPick,done=p!=null;
 let tail;
 if(!done)tail='<div class="btnrow">'+btnGive(i)+'</div>';
 else{const ok=p===FH.ans;
   tail='<div class="feedback" style="min-height:auto;font-size:13px;color:'+(ok?'#a5d6a7':'#ffcc80')+'">'+(ok?'✓ 對：這一週推得多的是'+FXH_LN[FH.ans].n+'。':'✗ '+(r.fbNo[p]||'再看一次拆開的兩條線。'))+'</div>'
     +okBox(r.fbOk)+'<button class="continue-btn" onclick="fhNext('+i+')">下一題：避險比重 ›</button>';}
 G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+'<div class="round-q t-main" style="font-size:15px">'+(both||done?r.q:r.qOpen)+'</div>'
  +fhSvg({vis:v,click:both&&!done,pick:p,ans:done?FH.ans:null})+fhLegend(v,true)
  +'<div class="fig-note">'+(both?'兩條都打開了。':'圖例是按鈕：點一下打開、再點一下關掉。')+'　淡金色框＝這一週</div>'+tail);}
function fhToggle(k){if(state.fhStep!==0)return;state.fhVis[k]=!state.fhVis[k];fhDraw(state.fhFor);}
function fhPick(k){const i=state.fhFor;if(state.fhStep!==0||state.fhPick!=null)return;
 if(!(state.fhVis.sp&&state.fhVis.fu))return;
 state.fhPick=k;if(k===FH.ans&&!state.fhGave)state.score++;fhDraw(i);}
function fhNext(i){state.fhStep=1;fade(function(){fhA(i);});}
function fhAHead(r){return '<div class="chapter-label t-label">'+r.label+' · 外資避險比重</div><div class="chapter-title t-main" style="font-size:22px;margin-bottom:0.9rem">'+r.hTitle+'</div><div class="round-text t-sub">'+r.hText+'</div>'
 +'<div class="layer-list">'+r.hLayers.map(function(ly){return '<div class="ly"><b>'+ly[0]+'</b><span>'+ly[1]+'</span></div>';}).join('')+'</div>'+fhGrid()+fhTiles();}
function fhA(i){const r=ROUNDS[i];
 G.innerHTML=scene(r.sky,r.bg,dots(i)+fhAHead(r)+'<div class="round-q t-main" style="font-size:15px;margin-top:0.8rem">'+r.hQ+'</div>'
  +'<div class="fp-bets">'+r.hBets.map(function(b){return '<button class="fp-bet" onclick="fhBet('+i+',\''+b[0]+'\')">'+b[1]+'</button>';}).join('')+'</div>'
  +btnGive(i));}
function fhBet(i,k){const r=ROUNDS[i],ok=k===r.hOk;
 G.innerHTML=scene(r.sky,r.bg,dots(i)+fhAHead(r)
  +okBox('<span style="color:'+(ok?'#a5d6a7':'#ffcc80')+'">'+(ok?'對，是保險。':r.hNo[k])+'</span><br>'+r.hReveal)
  +'<button class="continue-btn" onclick="record('+i+')">繼續 ›</button>');}

// ── 舊版排序＋建構引擎（目前沒有關卡使用；保留引擎，不保留題目）（收尾建構行為）──
function renderChain(i){const r=ROUNDS[i];
 if(state.chFor!==i){state.chFor=i;state.chStep=0;state.so=r.shuffle.slice();state.soSel=null;state.soFor=i;state.pl={};state.plSel=null;state.plFor=i;}
 if(state.chStep===0){
   const draw=function(){G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+'<div class="round-q t-main" style="font-size:15px">'+r.q+'</div>'
     +soBody(r)+'<div class="btnrow"><button class="continue-btn" onclick="chCheck('+i+')">檢查</button>'+btnGive(i)+'</div>');};
   window.soDraw=draw;draw();
 }else{chBuild(i);}}
function chCheck(i){const r=ROUNDS[i];let ok=0;state.so.forEach(function(v,k){if(v===k)ok++;});
 const all=ok===r.items.length;if(all)state.score++;
 G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+soBody(r,true)
  +'<div class="feedback" style="color:'+(all?'#a5d6a7':'#ffcc80')+';min-height:auto;font-size:13.5px">排對 '+ok+'/'+r.items.length+' 格</div>'
  +okBox((all?'':'<span style="color:#ffcc80">順序還沒對——正確的順序是：事實 → 機制 → 含意 → 判定。</span><br>')+r.sortOk)
  +'<button class="continue-btn" onclick="chNext('+i+')">最後一件事 ›</button>');}
function chNext(i){state.chStep=1;state.pl={};state.plSel=null;fade(function(){chBuild(i);});}
function chHead(r){return '<div class="chapter-label t-label">'+r.label+' · 收尾</div><div class="chapter-title t-main" style="font-size:22px;margin-bottom:0.9rem">'+r.buildTitle+'</div>';}
function chBuild(i){const r=ROUNDS[i];
 G.innerHTML=scene('sky-clear','range',dots(i)+chHead(r)
  +'<div class="round-q t-main" style="font-size:15px">'+r.buildQ+'</div>'
  +placeBody(i,r.cards,r.slots,true)
  +'<div class="btnrow">'+(plFull(r.slots)?'<button class="continue-btn" onclick="chDone('+i+')">排好了 ›</button>':'')+btnGive(i)+'</div>');
 window.plDraw=function(){chBuild(i);};}
function chDone(i){const r=ROUNDS[i];const m=plMarks(r.slots);
 let ok=0;Object.keys(m).forEach(function(k){if(m[k])ok++;});
 G.innerHTML=scene('sky-clear','range',dots(i)+chHead(r)
  +placeBody(i,r.cards,r.slots,true,true,m)
  +'<div class="feedback" style="color:'+(ok===r.slots.length?'#a5d6a7':'#ffcc80')+';min-height:auto;font-size:13.5px">放對 '+ok+'/'+r.slots.length+' 格'+(ok===r.slots.length?'':'（放錯的格子是紅框，正解在下面）')+'</div>'
  +okBox((ok===r.slots.length?'':'<b style="color:#ffcc80">正解：</b><br>'+r.slots.map(function(sl){const c=r.cards.filter(function(x){return x[0]===sl[2];})[0];return sl[1]+'　←　'+c[1];}).join('<br>')+'<br><br>')+r.done)+'<button class="continue-btn" onclick="record('+i+')">看我學會了什麼 ›</button>');}

// ── 收尾建構：翻多卡八項點選歸位 ✓／✗ → 押現在走到哪一步（§00 第 8 步）──
function bdWant(r){const w={};r.slots.forEach(function(s){s[2].split(',').forEach(function(c){w[c]=s[0];});});return w;}
function bdRight(r){const w=bdWant(r);let ok=0;Object.keys(state.pl).forEach(function(s){(state.pl[s]||[]).forEach(function(c){if(w[c]===s)ok++;});});return ok;}
function renderBuild(i){const r=ROUNDS[i];
 if(state.bdFor!==i){state.bdFor=i;state.bdStep=0;state.bdPick=null;state.pl={};state.plSel=null;state.plFor=i;}
 if(state.bdStep===0)bdDraw(i);else bdBetDraw(i);}
function bdDraw(i){const r=ROUNDS[i];
 G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+'<div class="round-q t-main" style="font-size:15px">'+r.buildQ+'</div>'
  +placeBody(i,r.cards,r.slots,true)
  +'<div class="btnrow">'+(plFull(r.slots)?'<button class="continue-btn" onclick="bdCheck('+i+')">排好了 ›</button>':'')+btnGive(i)+'</div>');
 window.plDraw=function(){bdDraw(i);};}
function bdCheck(i){const r=ROUNDS[i];const ok=bdRight(r);
 if(state.bdStep===0&&ok===r.cards.length)state.score++;
 state.bdStep=1;state.bdOkN=ok;bdBetDraw(i);}
function bdFix(r){const w=bdWant(r);return '<div style="font-size:13px;line-height:1.8;color:rgba(255,255,255,0.9);text-align:left;max-width:480px;margin:0.4rem auto 0">'
  +r.slots.map(function(s){return s[1]+'：'+s[2].split(',').map(function(c){return r.cards.filter(function(x){return x[0]===c;})[0][1].replace(/<span class="sm">.*?<\/span>/,'').replace(/<\/?b>/g,'');}).join('、');}).join('<br>')+'</div>';}
function bdBetDraw(i){const r=ROUNDS[i],ok=state.bdOkN||0,all=ok===r.cards.length,p=state.bdPick;
 let tail;
 if(p==null){tail='<div class="round-q t-main" style="font-size:15px;margin-top:0.9rem">'+r.betQ+'</div>'
   +'<div class="fp-bets">'+r.bets.map(function(b){return '<button class="fp-bet" onclick="bdBet('+i+',\''+b[0]+'\')">'+b[1]+'</button>';}).join('')+'</div>'
   +'<div class="btnrow">'+btnGive(i)+'</div>';}
 else{const good=p===r.betOk;
   tail=okBox('<span style="color:'+(good?'#a5d6a7':'#ffcc80')+'">'+(good?'對：現在走到「還沒止跌」。':(r.betNo[p]||'再看一次第一段。')+'<br>卡上寫的是「還沒止跌」。')+'</span><br><br>'+r.done)
     +'<button class="continue-btn" onclick="record('+i+')">看我學會了什麼 ›</button>';}
 G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+placeBody(i,r.cards,r.slots,true,true,plMarks(r.slots))
  +'<div class="feedback" style="color:'+(all?'#a5d6a7':'#ffcc80')+';min-height:auto;font-size:13.5px">放對 '+ok+'/'+r.cards.length+' 張'+(all?'':'（紅框那一欄有放錯，正解如下）')+'</div>'
  +(all?'':bdFix(r))+tail);
 window.plDraw=function(){};}
function bdBet(i,k){if(state.bdPick!=null)return;state.bdPick=k;bdBetDraw(i);}

// ── 給我答案：就地揭示 ──
function giveAnswer(i){const r=ROUNDS[i],a0=ANS[i];
 const a=(r.type==='fxhedge'&&state.fhStep===1&&a0.answer2)?{answer:a0.answer2,terms:a0.terms2}:a0;
 const gloss='<div style="font-size:11px;letter-spacing:2px;color:rgba(255,255,255,0.5);margin:0.9rem 0 0.5rem">名詞白話</div>'
  +'<div class="layer-list" style="background:none;border:none;padding:0;margin:0">'+a.terms.map(function(t){return '<div class="ly"><b>'+t[0]+'</b><span>'+t[1]+'</span></div>';}).join('')+'</div>';
 const ansLine='<div style="font-size:14px;line-height:1.75;color:#fff;text-align:left"><b style="color:#a5d6a7">答案：</b>'+a.answer+'</div>';

 if(r.type==='ab'){
   mid='<div class="choices">'+r.choices.map(function(c,k){return '<div class="choice-btn" style="cursor:default;'+(k===r.correct?'border-color:#a5d6a7;background:rgba(80,200,110,0.14)':'opacity:0.45')+'">'+(k===r.correct?'✓ ':'')+c+'</div>';}).join('')+'</div>'

 }else if(r.type==='place'){
   state.pl={};r.slots.forEach(function(s){state.pl[s[0]]=s[2].split(',');});state.plSel=null;

 }else if(r.type==='sort'){

 }else if(r.type==='chain'){
   if(state.chStep===0){state.so=r.items.map(function(_,k){return k;});state.soSel=null;
     mid=soBody(r,true)+'<div style="font-size:13.5px;line-height:1.8;color:rgba(255,255,255,0.9);text-align:left;max-width:480px;margin:0.5rem auto 0">'+r.sortOk+'</div>';}
   else{state.pl={};r.slots.forEach(function(s){state.pl[s[0]]=s[2].split(',');});state.plSel=null;
     mid=placeBody(i,r.cards,r.slots,true,true,plMarks(r.slots))+'<div style="font-size:13.5px;line-height:1.8;color:rgba(255,255,255,0.9);text-align:left;max-width:480px;margin:0.5rem auto 0">'+r.done+'</div>';}
 }else if(r.type==='flip'){
   if(state.fp===0){mid=r.reveal+'<div style="font-size:13.5px;line-height:1.8;color:rgba(255,255,255,0.9);text-align:left;max-width:480px;margin:0.5rem auto 0">'+r.revealTxt+'</div>';}
   else{state.pl={};r.slots.forEach(function(s){state.pl[s[0]]=s[2].split(',');});state.plSel=null;
     mid=placeBody(i,r.cards,r.slots,true,true,plMarks(r.slots))+'<div style="font-size:13.5px;line-height:1.8;color:rgba(255,255,255,0.9);text-align:left;max-width:480px;margin:0.5rem auto 0">'+r.done+'</div>';}
 }else if(r.type==='build'){
   state.pl={};r.slots.forEach(function(s){state.pl[s[0]]=s[2].split(',');});state.plSel=null;state.bdOkN=r.cards.length;
   mid=placeBody(i,r.cards,r.slots,true,true,plMarks(r.slots))
     +'<div class="fp-bets" style="margin-top:0.6rem">'+r.bets.map(function(b){return '<div class="fp-bet" style="cursor:default;'+(b[0]===r.betOk?'border-color:#a5d6a7;background:rgba(80,200,110,0.14)':'opacity:0.45')+'">'+(b[0]===r.betOk?'✓ ':'')+b[1]+'</div>';}).join('')+'</div>'
     +'<div style="font-size:13.5px;line-height:1.8;color:rgba(255,255,255,0.9);text-align:left;max-width:480px;margin:0.5rem auto 0">'+r.done+'</div>';
 }else if(r.type==='fxquad'){
   FQ.forEach(function(f,k){state.fqPicks[k]=f.ans;});state.fqChecked=true;
   mid=fqMini()+'<div style="font-size:13.5px;line-height:1.8;color:rgba(255,255,255,0.9);text-align:left;max-width:480px;margin:0.5rem auto 0">'+r.fbOk+'</div>';
 }else if(r.type==='fxhedge'){
   if(state.fhStep===0){state.fhVis={tot:true,sp:true,fu:true};state.fhGave=true;
     mid=fhSvg({vis:state.fhVis,click:false,ans:FH.ans})+fhLegend(state.fhVis,false)+'<div style="font-size:13.5px;line-height:1.8;color:rgba(255,255,255,0.9);text-align:left;max-width:480px;margin:0.5rem auto 0">'+r.fbOk+'</div>';}
   else{mid='<div class="fp-bets">'+r.hBets.map(function(b){return '<div class="fp-bet" style="cursor:default;'+(b[0]===r.hOk?'border-color:#a5d6a7;background:rgba(80,200,110,0.14)':'opacity:0.45')+'">'+(b[0]===r.hOk?'✓ ':'')+b[1]+'</div>';}).join('')+'</div>'
     +'<div style="font-size:13.5px;line-height:1.8;color:rgba(255,255,255,0.9);text-align:left;max-width:480px;margin:0.5rem auto 0">'+r.hReveal+'</div>';}
 }
 let nextBtn='<button class="continue-btn" onclick="record('+i+')">懂了，繼續 ›</button>';
 if(r.type==='build')nextBtn='<button class="continue-btn" onclick="record('+i+')">看我學會了什麼 ›</button>';
 if(r.type==='fxhedge'&&state.fhStep===0)nextBtn='<button class="continue-btn" onclick="fhNext('+i+')">下一題：避險比重 ›</button>';
 if(r.type==='flip'&&state.fp===0&&r.cards)nextBtn='<button class="continue-btn" onclick="fpNext('+i+')">最後一件事 ›</button>';
 if(r.type==='chain'&&state.chStep===0)nextBtn='<button class="continue-btn" onclick="chNext('+i+')">最後一件事 ›</button>';
 const hd=(r.type==='fxhedge'&&state.fhStep===1)?fhAHead(r):head(r);
 G.innerHTML=scene(r.sky,r.bg,dots(i)+hd+mid+okBox(ansLine+gloss)+nextBtn);
 if(r.type==='match')mtLines();}

  '#yc-bar{position:fixed;left:0;right:0;bottom:0;z-index:9998;background:linear-gradient(0deg,rgba(8,10,18,.97),rgba(8,10,18,.86));'
  +'border-top:1px solid rgba(212,175,55,.4);padding:11px 16px;padding-bottom:calc(11px + env(safe-area-inset-bottom));'
  +'display:flex;align-items:center;gap:12px;backdrop-filter:blur(10px);'
  +"font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif}"
  +'#yc-bar .yc-txt{flex:1;min-width:0;font-size:13px;line-height:1.5;color:#dfe6f4}'
  +'#yc-bar .yc-txt b{color:#e8c86a}'
  +'#yc-go{flex:0 0 auto;padding:10px 18px;border-radius:999px;border:none;cursor:pointer;font-weight:700;font-size:14px;'
  +'color:#1a1200;background:linear-gradient(135deg,#d4af37,#f0d488);box-shadow:0 4px 14px rgba(212,175,55,.35)}'
  +'#yc-mask{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.62);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:18px}'
  +'#yc-mask.on{display:flex}'
  +'#yc-modal{width:100%;max-width:400px;background:#0d1120;border:1px solid rgba(212,175,55,.34);border-radius:18px;padding:24px 22px;'
  +'box-shadow:0 20px 60px rgba(0,0,0,.6);color:#eef2fb;'
  +"font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif}"
  +'#yc-modal h3{font-size:19px;font-weight:800;margin:0 0 6px}'
  +'#yc-modal p{font-size:13.5px;line-height:1.6;color:#aab3c8;margin:0 0 14px}'
  +'#yc-modal input{width:100%;padding:12px 14px;font-size:15px;border-radius:11px;border:1px solid rgba(255,255,255,.16);'
  +'background:#05070f;color:#fff;outline:none;margin-bottom:6px}'
  +'#yc-modal input:focus{border-color:#d4af37}'
  +'#yc-modal .yc-hint{font-size:11.5px;color:#8590a6;margin:0 0 14px}'
  +'#yc-submit{width:100%;padding:13px;border-radius:11px;border:none;cursor:pointer;font-weight:800;font-size:15px;'
  +'color:#1a1200;background:linear-gradient(135deg,#d4af37,#f0d488)}'
  +'#yc-submit:disabled{opacity:.55;cursor:default}'
  +'#yc-msg{font-size:13px;margin-top:11px;min-height:18px;line-height:1.5}'
  +'#yc-msg.ok{color:#7fd6a6}#yc-msg.err{color:#f08a8a}'
  +'#yc-close,#yc-close2{background:none;border:none;color:#8590a6;font-size:13px;text-decoration:underline;cursor:pointer;display:block;margin:12px auto 0}'
  +'#yc-done .yc-badge{font-size:54px;line-height:1;margin:2px 0 8px;text-align:center}';
  document.head.appendChild(css);

  var bar=document.createElement('div');
  bar.id='yc-bar';
  bar.innerHTML='<div class="yc-txt">🎓 玩到最後了嗎？完成這個導覽，<b>領取《'+name+'報告》檢核徽章</b></div><button id="yc-go">領取檢核</button>';
  document.body.appendChild(bar);
  // 只在最後結果頁才浮出「領取檢核」——沒玩到結果頁不顯示（2026-08-06）
  var ycCertified=false;
  function ycOnResult(){return !!document.querySelector('.result-name,.result-type');}
  function ycSync(){bar.style.display=(!ycCertified&&ycOnResult())?'flex':'none';}
  ycSync();
  new MutationObserver(ycSync).observe(document.body,{childList:true,subtree:true});

  var mask=document.createElement('div');
  mask.id='yc-mask';
  mask.innerHTML='<div id="yc-modal">'
    +'<div id="yc-form">'
      +'<h3>領取《'+name+'報告》檢核</h3>'
      +'<p>輸入你的 <b style="color:#e8c86a">email 與會員存取碼</b>（僅用於比對身分），系統會記下你已完成本教材。</p>'
      +'<input id="yc-email" type="email" placeholder="訂閱用的 email" autocomplete="off">'
      +'<input id="yc-pw" type="password" placeholder="你的會員密碼" autocomplete="off">'
      +'<div class="yc-hint">這組密碼只是會員存取碼，請勿使用你其他重要帳號的密碼。</div>'
      +'<button id="yc-submit">送出，領取徽章</button>'
      +'<div id="yc-msg"></div>'
      +'<button id="yc-close">稍後再說</button>'
    +'</div>'
    +'<div id="yc-done" style="display:none">'
      +'<div class="yc-badge">🏅</div>'
      +'<h3 style="text-align:center">已通過《'+name+'報告》檢核</h3>'
      +'<p id="yc-done-txt" style="text-align:center"></p>'
      +'<button id="yc-close2">完成</button>'
    +'</div>'
  +'</div>';
  document.body.appendChild(mask);

  var $=function(id){return document.getElementById(id);};
  function openModal(){mask.classList.add('on');setTimeout(function(){$('yc-email').focus();},50);}
  function closeModal(){mask.classList.remove('on');}
  $('yc-go').onclick=openModal;
  $('yc-close').onclick=closeModal;
  $('yc-close2').onclick=closeModal;
  mask.addEventListener('click',function(e){if(e.target===mask)closeModal();});

  function submit(){
    var email=$('yc-email').value.trim(), pw=$('yc-pw').value.trim(), msg=$('yc-msg');
    if(!email||!pw){msg.className='err';msg.textContent='請輸入 email 與會員密碼';return;}
    var btn=$('yc-submit');btn.disabled=true;msg.className='';msg.textContent='驗證中…';
    fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:'certify',email:email,password:pw,reportType:t})})
      .then(function(r){return r.json();})
      .then(function(res){
        btn.disabled=false;
        if(res&&res.done){
          $('yc-form').style.display='none';
          $('yc-done').style.display='block';
          $('yc-done-txt').innerHTML=(res.alreadyCertified?'你先前已通過（'+res.certifiedAt+'）。':'通過日：'+res.certifiedAt+'。')
            +'<br>此紀錄只是教材完成紀錄，與訂閱權益、報告寄送無關。';
          ycCertified=true;bar.style.display='none';
        }else{
          msg.className='err';msg.textContent=(res&&res.error)?res.error:'驗證失敗，請稍後再試';
        }
      })
      .catch(function(){btn.disabled=false;msg.className='err';msg.textContent='連線失敗，請檢查網路後再試';});
  }
  $('yc-submit').onclick=submit;
  $('yc-pw').addEventListener('keydown',function(e){if(e.key==='Enter')submit();});
  $('yc-email').addEventListener('keydown',function(e){if(e.key==='Enter')submit();});
})();
</script>
