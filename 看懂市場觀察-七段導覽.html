<script>
const G=document.getElementById('game'),PB=document.getElementById('progress');
const BGM=document.getElementById('bgm'),MUTEBTN=document.getElementById('muteBtn');
let bgmStarted=false,bgmMuted=false;try{bgmMuted=localStorage.getItem('yoda_bgm_muted')==='1';}catch(e){}
if(BGM)BGM.volume=0.30;
function mIcon(){if(MUTEBTN)MUTEBTN.textContent=bgmMuted?'🔇':'🔊';}mIcon();
function toggleMute(){bgmMuted=!bgmMuted;try{localStorage.setItem('yoda_bgm_muted',bgmMuted?'1':'0');}catch(e){}if(bgmMuted){if(BGM)BGM.pause();}else if(BGM)BGM.play().then(()=>bgmStarted=true).catch(()=>{});mIcon();}
window.toggleMute=toggleMute;
document.addEventListener('click',()=>{if(!bgmStarted&&!bgmMuted&&BGM)BGM.play().then(()=>bgmStarted=true).catch(()=>{});});

// ===== 水墨背景 bg(type,sky) =====

 peak:(f,n,l)=>`<path d="M0,104 C260,100 430,94 520,56 C560,40 600,20 640,20 C680,20 720,42 760,60 C860,100 1000,102 1200,100 L1200,120 L0,120Z" fill="${n}"/><path d="M600,28 C612,42 628,54 640,60" fill="none" stroke="${l}" stroke-width="1.4"/><rect x="300" y="62" width="620" height="10" fill="${f}"/><path d="M120,86 h240 M470,86 h180 M760,90 h300" stroke="${f}" stroke-width="8" stroke-linecap="round" opacity="0.7"/>`,
 river:(f,n,l)=>`<path d="M0,90 C300,82 500,86 1200,84 L1200,120 L0,120Z" fill="${f}"/><path d="M470,82 Q540,98 610,82" fill="none" stroke="${l}" stroke-width="1.8" stroke-linecap="round"/><path d="M120,94 q80,-4 160,0 t160,0 M700,96 q80,-4 160,0 t160,0" fill="none" stroke="${l}" stroke-width="1" opacity="0.6"/>`};

// §01 四支溫度計（橫向：左球右管，水銀柱寬度持續變化＝溫度一直在變）
function thermo4SVG(){
 const T=[{c:'#ffb060',lab:'資金流',lo:60,hi:150},{c:'#ffcc80',lab:'情緒',lo:45,hi:178},{c:'#5b8def',lab:'風險',lo:28,hi:92},{c:'#7fd0a0',lab:'廣度',lo:95,hi:165}];
 const x0=64,tubeW=196,rowH=33,top=26;
 const body=T.map((t,i)=>{const cy=top+i*rowH,beg=(i*0.5).toFixed(2)+'s';
  return `<g><text x="46" y="${cy+4}" fill="rgba(255,255,255,0.8)" font-size="11" text-anchor="end">${t.lab}</text>`
   +`<circle cx="${x0-6}" cy="${cy}" r="9" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.28)"/><circle cx="${x0-6}" cy="${cy}" r="6" fill="${t.c}"/>`
   +`<rect x="${x0}" y="${cy-5}" width="${tubeW}" height="10" rx="5" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.26)"/>`
   +`<line x1="${x0+64}" y1="${cy-7}" x2="${x0+64}" y2="${cy-5}" stroke="rgba(255,255,255,0.25)" stroke-width="1"/><line x1="${x0+130}" y1="${cy-7}" x2="${x0+130}" y2="${cy-5}" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>`
   +`<rect x="${x0}" y="${cy-3.5}" height="7" rx="3.5" fill="${t.c}"><animate attributeName="width" values="${t.lo};${t.hi};${t.lo}" dur="2.6s" begin="${beg}" repeatCount="indefinite"/></rect>`
   +`</g>`;
 }).join('');
 return `<svg viewBox="0 0 300 158" style="width:100%;max-width:300px;margin:0.5rem auto 0.2rem;display:block">${body}</svg>`;
}

 const cells=tools.map(t=>`<div style="background:rgba(0,0,0,0.28);border:1px solid rgba(255,255,255,0.18);border-radius:8px;padding:6px 5px 4px"><div style="height:64px;overflow:hidden;display:flex;align-items:center;justify-content:center">${t[0]}</div><div style="font-size:10px;color:rgba(255,255,255,0.72);margin-top:3px;letter-spacing:.5px">${t[1]}</div></div>`).join('');
 return `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-width:460px;margin:0.5rem auto 1.1rem">${cells}</div>`;
}

 {answer:'進攻＝半導體、資訊科技、非必需消費；防禦＝必需消費、醫療保健、公用事業。',terms:[
   ['進攻板塊','景氣好、大家敢花錢時領漲的（科技、想要但非必需的東西）'],
   ['防禦板塊','再壞也得買的（吃的、藥、水電），景氣差時相對抗跌'],
   ['三條歷史線','每個板塊點開＝近一週（紅）／近一月（黃）／近三月（藍）相對大盤的走勢'],
   ['核心邏輯鍊小結','板塊小結最前面用一條 A→B→C 把「錢往哪換」收成一句']]},
 {answer:'B（只有 40% 個股站上均線）比較脆。',terms:[
   ['均線','一段時間的平均成本線；「站上均線」＝股價在這條線之上，偏強'],
   ['市場廣度','有多少比例的股票「一起」在漲；報告用那斯達克／標普兩條折線畫'],
   ['50% 分水嶺','站上均線家數的多空分界；兩條折線都在上面＝厚，跌破＝變薄'],
   ['廣度背離','指數創新高，但多數股沒跟上＝少數大牛股硬撐，地基虛，較脆']]},
 {answer:'跌破 Put 牆 → 做市商被迫追賣、加速下跌（負 Gamma）。',terms:[
   ['Put 牆','大量「賣權」堆積的價位，形成下方支撐；跌破常引爆賣壓'],
   ['Call 牆','大量「買權」堆積的價位，形成上檔壓力／天花板'],
   ['Max Pain','磁吸中樞——到期時讓多數選擇權變壁紙的價位，股價常被吸過去'],
   ['負 Gamma','做市商為了避險，被迫追跌殺、追漲買，把波動放大']]},
 {answer:'先寫好多方／空方兩套劇本，再看市場的反應。',terms:[
   ['未來一季事件','把未來三個月的已知大事一次攤開（不只下個月）'],
   ['FOMC＋點陣圖','Fed 利率決議＋官員對未來利率的預期點陣圖，牽動全球資金成本'],
   ['四巫日','大量選擇權、期貨同時結算的日子，盤中波動容易放大'],
   ['退出線','事先定好「跌到哪就走」的價位——沒有退出線的進場就是賭']]},
 {answer:'方向未定偏防禦 → 降曝險、盯關鍵價、留退出線（給傾向＋風控，不喊死方向）。',terms:[
   ['核心邏輯鍊','完整研判最前面的 現象→機制→所以怎麼看，先給判斷骨幹'],
   ['收斂','把每格線索標成偏多／偏空／中性，加權後給出一個「傾向」'],
   ['曝險','你暴露在市場裡的部位大小；降曝險＝先減碼、留現金'],
   ['地圖不是答案','報告給的是「現在在哪、該注意什麼」，不是「保證漲跌」的明牌']]}
];
function giveAnswer(i){const r=ROUNDS[i],a=ANS[i];
 const gloss=`<div style="font-size:11px;letter-spacing:2px;color:rgba(255,255,255,0.5);margin:0.85rem 0 0.5rem">名詞白話</div>`+a.terms.map(t=>`<div style="font-size:13px;line-height:1.7;color:rgba(255,255,255,0.9);margin-bottom:0.42rem;text-align:left"><b style="color:#e0a526">${t[0]}</b>：${t[1]}</div>`).join('');
 const box=inner=>`<div style="max-width:470px;margin:0.5rem auto 0;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.28);border-radius:10px;padding:1rem 1.2rem;backdrop-filter:blur(6px)">${inner}</div>`;
 const ansLine=`<div style="font-size:14px;line-height:1.7;color:#fff;text-align:left"><b style="color:#a5d6a7">答案：</b>${a.answer}</div>`;
 if(r.type==='classify'){
   r.items.forEach((it,k)=>state.cls[k]=it[1]);
   const rows=r.items.map(it=>`<div class="cls-row right"><div class="cls-name">${it[0]}</div><button class="cls-btn ${it[1]} on" disabled>${it[1]==='atk'?'進攻':'防禦'}</button></div>`).join('');
   G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r)}<div class="round-q t-main">${r.q}</div><div class="cls-list">${rows}</div>${box(ansLine+`<div style="font-size:13px;line-height:1.7;color:rgba(255,255,255,0.86);margin-top:0.55rem;text-align:left">${r.reveal}</div>`+gloss)}<button class="continue-btn" onclick="record(${i})">懂了，繼續 ›</button>`);
 }else if(r.type==='match'){
   r.items.forEach((it,k)=>state.match[k]=it.a);
   const rows=r.items.map(it=>`<div class="cls-row right"><div class="cls-name">${it.name}</div><button class="cls-btn on" style="border-color:#7cdc9a;background:rgba(80,200,110,0.18)" disabled>${it.a}</button></div>`).join('');
   G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r)}<div class="round-q t-main">${r.q}</div><div class="cls-list">${rows}</div>${box(ansLine+`<div style="font-size:13px;line-height:1.7;color:rgba(255,255,255,0.86);margin-top:0.55rem;text-align:left">${r.reveal}</div>`+gloss)}<button class="continue-btn" onclick="record(${i})">懂了，繼續 ›</button>`);
 }else if(r.type==='gauge'){
   G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r)}<div class="gauge-wrap">${gaugeSVG(18)}<div class="feedback" style="margin-top:0.6rem">${r.fb(18)}</div></div>${box(ansLine+gloss)}<button class="continue-btn" onclick="record(${i})">懂了，繼續 ›</button>`);
 }else{
   const ch=r.choices.map((c,k)=>`<div class="choice-btn" style="cursor:default;${k===r.correct?'border-color:#a5d6a7;background:rgba(80,200,110,0.14)':'opacity:0.45'}">${k===r.correct?'✓ ':''}${c}</div>`).join('');
   G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r)}<div class="choices">${ch}</div><div class="feedback" style="color:#a5d6a7;min-height:auto;font-size:14px">${r.fb[r.correct]}</div>${box(gloss)}<button class="continue-btn" onclick="record(${i})">懂了，繼續 ›</button>`);
 }}

 G.innerHTML=scene(r.sky,r.bg,`${dots(i)}<div class="chapter-label t-label">${r.label}</div><div class="chapter-title t-main" style="font-size:22px;margin-bottom:0.8rem">${r.title}</div>

   <div style="margin-bottom:0.55rem"><b style="color:#e0a526">② 情緒</b>：大家是貪還是怕——用波動大小、賭盤方向來量。</div>

  <div class="round-text t-sub" style="font-size:12.5px;margin-top:0.2rem;opacity:0.85">四支溫度計的水銀柱一直在動——市場的溫度每天都在變。每一支都是很多細指標壓成的一個「溫度」。來，試讀第三支：風險偏好。</div>

function prog(){PB.style.width=(Math.max(0,state.idx)/ROUNDS.length*100)+'%';}
function dots(i){return `<div class="step-dots">${ROUNDS.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div>`;}
function fade(fn){G.style.transition='opacity .32s';G.style.opacity='0';setTimeout(()=>{fn();G.style.opacity='1';},330);}
function scene(sky,bgtype,inner){return `<div class="scene ${sky}">${bg(bgtype,sky)}<div class="overlay">${inner}</div></div>`;}
function head(r){return `<div class="chapter-label t-label">${r.label}</div><div class="chapter-title t-main" style="font-size:22px;margin-bottom:0.9rem">${r.title}</div><div class="round-text t-sub">${r.text}</div>`;}

function showStart(){G.innerHTML=scene('sky-start','farhills',`
  <div class="chapter-label t-label" style="margin-bottom:1rem">YODA RESEARCH · 判斷力學校</div>
  <div class="chapter-title t-main" style="font-size:30px;font-weight:200;letter-spacing:1px;margin-bottom:0.4rem">看懂市場觀察</div>
  <div class="t-sub" style="font-size:14px;margin-bottom:0.3rem;font-style:italic">八段導覽：學會自己讀完整份市場觀察</div>
  <div class="t-label" style="font-size:12px;margin-bottom:2.6rem">約 5 分鐘 · 跟著報告走一遍（封面四表→核心指標→板塊動態圖→板塊對位→市場廣度→Gamma 防線→未來一季事件→完整研判）· 通用範例，非任何一日的實際研判</div>
  <button class="continue-btn" style="font-size:15px;padding:0.85rem 3.2rem;border-radius:6px;letter-spacing:2px" onclick="fade(startOpening)">開始</button>`);}
let oi=0;function startOpening(){oi=0;renderOpening();}
function renderOpening(){const q=OPENING.quotes[oi],last=oi>=OPENING.quotes.length-1;
 G.innerHTML=scene(OPENING.sky,OPENING.bg,`<div class="chapter-label t-label">${OPENING.label}</div><div class="chapter-title t-main">${OPENING.title}</div><div class="chapter-quote t-sub">${q}</div><button class="continue-btn" onclick="nextOpening()">${last?'開始讀第一段 ›':'繼續 ›'}</button>`);}

function showRound(i){state.idx=i;prog();const r=ROUNDS[i];
 if(r.type==='gauge')renderGaugeIntro(i);else if(r.type==='classify')renderClassify(i);else if(r.type==='match')renderMatch(i);else renderAB(i);}

// R1 儀表滑桿
function gaugeSVG(val){const min=0,max=100,f=v=>Math.PI*(1-(v-min)/(max-min)),R=120,ax=250+R*Math.cos(f(val)),ay=170-R*Math.sin(f(val));
 return `<svg viewBox="0 0 500 200" style="width:100%;max-width:320px"><path d="M130,170 A120,120 0 0,1 370,170" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="14"/><line x1="250" y1="170" x2="${ax}" y2="${ay}" stroke="#e0a526" stroke-width="5" stroke-linecap="round"/><circle cx="250" cy="170" r="8" fill="#e0a526"/><text x="250" y="128" fill="#fff" font-size="26" font-weight="300" text-anchor="middle">${val}</text><text x="130" y="192" fill="rgba(91,141,239,0.9)" font-size="12" text-anchor="middle">防禦</text><text x="370" y="192" fill="rgba(224,83,83,0.9)" font-size="12" text-anchor="middle">冒險</text></svg>`;}
function renderGauge(i){const r=ROUNDS[i];state.gv=50;
 function draw(){G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r)}<div class="round-q t-main" style="font-size:14.5px">${r.q}</div>
   <div class="gauge-wrap">${gaugeSVG(state.gv)}<input type="range" class="gsl" min="0" max="100" value="${state.gv}" oninput="state.gv=parseInt(this.value);drawGauge()">
   <div class="gsl-ends"><span>${r.left}</span><span>${r.right}</span></div><div class="feedback" id="fbg"></div></div>
   <div style="display:flex;gap:0.6rem;justify-content:center;flex-wrap:wrap"><button class="continue-btn" onclick="gaugeDone(${i})">就這樣 ›</button><button class="continue-btn" style="opacity:0.72" onclick="giveAnswer(${i})">給我答案</button></div>`);}
 window.drawGauge=draw;draw();}
function gaugeDone(i){const r=ROUNDS[i];
 G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r)}<div class="gauge-wrap">${gaugeSVG(state.gv)}<div class="feedback" style="margin-top:0.8rem">${r.fb(state.gv)}</div></div><button class="continue-btn" onclick="renderFourRead(${i})">再看整張封面 ›</button>`);}
function thermo(t){const w=Math.max(4,Math.min(100,t.s));return `<div style="background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:0.5rem 0.75rem;margin-bottom:0.4rem"><div style="display:flex;align-items:center;gap:0.5rem"><div style="flex:1;text-align:left;font-size:13px;color:#fff">${t.n}</div><div style="font-size:16px;color:#fff;font-weight:300;min-width:34px;text-align:right">${t.s}</div><div style="font-size:12px;color:${t.c};min-width:72px;text-align:right">${t.l}</div></div><div style="height:5px;border-radius:3px;background:rgba(255,255,255,0.12);margin-top:0.35rem;overflow:hidden"><div style="height:100%;width:0;border-radius:3px;background:${t.c}"><\/div><\/div></div>`.replace('width:0','width:'+w+'%');}
function fourHead(r){return `${dots(0)}<div class="chapter-label t-label">${r.label}</div><div class="chapter-title t-main" style="font-size:20px;margin-bottom:0.7rem">讀整張封面（四表合讀）</div>`;}
function renderFourRead(i){const r=ROUNDS[i];const board=r.fr_scores.map(thermo).join('');
 G.innerHTML=scene(r.sky,r.bg,`${fourHead(r)}<div class="round-text t-sub" style="margin-bottom:0.8rem">${r.fr_intro}</div><div style="max-width:420px;margin:0 auto 0.9rem">${board}</div><div class="round-q t-main" style="font-size:14.5px">${r.fr_q}</div><div class="choices">${r.fr_choices.map((c,k)=>`<button class="choice-btn" onclick="fourReadPick(${i},${k})">${c}</button>`).join('')}</div><button class="continue-btn" style="opacity:0.72" onclick="fourReadAnswer(${i})">給我答案</button>`);}
function fourReadPick(i,k){const r=ROUNDS[i];if(k===r.fr_correct)state.score++;const col=k===r.fr_correct?'#a5d6a7':'#ffcc80';const board=r.fr_scores.map(thermo).join('');
 G.innerHTML=scene(r.sky,r.bg,`${fourHead(r)}<div style="max-width:420px;margin:0 auto 0.9rem">${board}</div><div class="feedback" style="color:${col};font-size:14px;min-height:auto">${r.fr_fb[k]}</div><button class="continue-btn" onclick="record(${i})">繼續 ›</button>`);}
function fourReadAnswer(i){const r=ROUNDS[i];const board=r.fr_scores.map(thermo).join('');
 const gloss=r.fr_terms.map(t=>`<div style="margin-bottom:0.42rem;text-align:left"><b style="color:#e0a526">${t[0]}</b>：${t[1]}</div>`).join('');
 G.innerHTML=scene(r.sky,r.bg,`${fourHead(r)}<div style="max-width:420px;margin:0 auto 0.9rem">${board}</div><div style="max-width:440px;margin:0 auto;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.28);border-radius:10px;padding:1rem 1.2rem"><div style="font-size:14px;color:#fff;text-align:left"><b style="color:#a5d6a7">答案：</b>${r.fr_answer}</div><div style="font-size:11px;letter-spacing:2px;color:rgba(255,255,255,0.5);margin:0.8rem 0 0.5rem">名詞白話</div><div style="font-size:13px;line-height:1.7;color:rgba(255,255,255,0.9)">${gloss}</div></div><button class="continue-btn" onclick="record(${i})">懂了，繼續 ›</button>`);}

function renderClassify(i){const r=ROUNDS[i];
 function draw(){const rows=r.items.map((it,k)=>`<div class="cls-row" id="cr${k}"><div class="cls-name">${it[0]}</div>
   <button class="cls-btn atk ${state.cls[k]==='atk'?'on':''}" onclick="setCls(${k},'atk')">進攻</button>

 window.drawCls=draw;draw();}

function clsCheck(i){const r=ROUNDS[i];let ok=0;
 r.items.forEach((it,k)=>{const row=document.getElementById('cr'+k);const right=state.cls[k]===it[1];if(right)ok++;row.classList.add(right?'right':'wrong');});
 state.score+= (ok>=5?1:0);
 document.getElementById('fbc').innerHTML=`<span style="color:${ok===6?'#a5d6a7':'#ffcc80'}">答對 ${ok}/6。${r.reveal}</span>`;
 G.querySelector('.continue-btn').outerHTML=`<button class="continue-btn" onclick="record(${i})">繼續 ›</button>`;}

// 二選一 / 三選一
function renderAB(i){const r=ROUNDS[i];
 G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r)}<div class="round-q t-main">${r.q}</div>
  <div class="choices">${r.choices.map((c,k)=>`<button class="choice-btn" onclick="abPick(${i},${k})">${c}</button>`).join('')}</div>
  <button class="continue-btn" style="opacity:0.72" onclick="giveAnswer(${i})">給我答案</button>`);}

 const col=k===r.correct?'#a5d6a7':'#ffcc80';

// 核心指標配對（match）
function renderMatch(i){const r=ROUNDS[i];state.match=[null,null,null,null];state.mChecked=false;
 function draw(){
  const rows=r.items.map((it,k)=>{
   let cls='';if(state.mChecked)cls=state.match[k]===it.a?'right':'wrong';
   const btns=r.cats.map(c=>`<button class="cls-btn ${state.match[k]===c?'on':''}" style="${state.match[k]===c?'border-color:#e0a526;background:rgba(224,165,38,0.28)':''}" ${state.mChecked?'disabled':''} onclick="setMatch(${k},'${c}')">${c}</button>`).join('');
   return `<div class="cls-row ${cls}" style="flex-wrap:wrap"><div class="cls-name" style="flex:1 0 100%;margin-bottom:0.3rem">${it.name}</div><div style="display:flex;gap:0.3rem;flex-wrap:wrap;width:100%">${btns}</div></div>`;
  }).join('');
  const done=state.match.every(x=>x!==null);
  let fb='',btnrow='';
  if(state.mChecked){const ok=r.items.filter((it,k)=>state.match[k]===it.a).length;
   fb=`<span style="color:${ok===r.items.length?'#a5d6a7':'#ffcc80'}">答對 ${ok}/${r.items.length}。${r.reveal}</span>`;
   btnrow=`<button class="continue-btn" onclick="record(${i})">繼續 ›</button>`;
  }else{
   btnrow=`<div style="display:flex;gap:0.6rem;justify-content:center;flex-wrap:wrap">${done?`<button class="continue-btn" onclick="matchDoCheck(${i})">檢查</button>`:''}<button class="continue-btn" style="opacity:0.72" onclick="giveAnswer(${i})">給我答案</button></div>`;
  }
  G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r)}<div class="round-q t-main">${r.q}</div><div class="cls-list">${rows}</div><div class="feedback" style="min-height:24px">${fb}</div>${btnrow}`);
 }
 window.drawMatch=draw;draw();}
function setMatch(k,c){state.match[k]=c;window.drawMatch();}
function matchDoCheck(i){const r=ROUNDS[i];const ok=r.items.filter((it,k)=>state.match[k]===it.a).length;if(ok>=r.items.length-1)state.score++;state.mChecked=true;window.drawMatch();}

function record(i){const t=TRANSITIONS[i];if(t)fade(()=>showTrans(t,i));else advance(i);}
function showTrans(txt,i){G.innerHTML=`<div class="scene" style="background:linear-gradient(180deg,#020408,#0a0714,#141020);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 1.5rem"><div class="overlay"><div class="transition-quote">${txt}</div><button class="continue-btn" onclick="advance(${i})">繼續 ›</button></div></div>`;}

<script>
(function(){
  var GAS_URL='https://script.google.com/macros/s/AKfycbwQQ02EzseXtzvHxH3yegvgvQKncv7ReoGaqqsVxzco6cdagOCW13Tr7KlwX2UJtPc7/exec';
  var TYPES={mw:'市場觀察',tw:'台股',us:'美股',key:'簡報',macro:'總經'};
  var t=new URLSearchParams(location.search).get('cert');
  if(!t||!TYPES[t]) return;                 // 非檢核模式 → 什麼都不做，遊戲照舊
  var name=TYPES[t];
  var css=document.createElement('style');
  css.textContent=
  '#yc-bar{position:fixed;left:0;right:0;bottom:0;z-index:9998;background:linear-gradient(0deg,rgba(8,10,18,.97),rgba(8,10,18,.86));'
  +'border-top:1px solid rgba(212,175,55,.4);padding:11px 16px;padding-bottom:calc(11px + env(safe-area-inset-bottom));'
  +'display:flex;align-items:center;gap:12px;backdrop-filter:blur(10px);'
  +"font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif}"
  +'#yc-bar .yc-txt{flex:1;min-width:0;font-size:13px;line-height:1.5;color:#dfe6f4}'
  +'#yc-bar .yc-txt b{color:#e8c86a}'
  +'#yc-go{flex:0 0 auto;padding:10px 18px;border-radius:999px;border:none;cursor:pointer;font-weight:700;font-size:14px;'
  +'color:#1a1200;background:linear-gradient(135deg,#d4af37,#f0d488);box-shadow:0 4px 14px rgba(212,175,55,.35)}'
  +'#yc-mask{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.62);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:18px}'
  +'#yc-mask.on{display:flex}'
  +'#yc-modal{width:100%;max-width:400px;background:#0d1120;border:1px solid rgba(212,175,55,.34);border-radius:18px;padding:24px 22px;'
  +'box-shadow:0 20px 60px rgba(0,0,0,.6);color:#eef2fb;'
  +"font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif}"
  +'#yc-modal h3{font-size:19px;font-weight:800;margin:0 0 6px}'
  +'#yc-modal p{font-size:13.5px;line-height:1.6;color:#aab3c8;margin:0 0 14px}'
  +'#yc-modal input{width:100%;padding:12px 14px;font-size:15px;border-radius:11px;border:1px solid rgba(255,255,255,.16);'
  +'background:#05070f;color:#fff;outline:none;margin-bottom:6px}'
  +'#yc-modal input:focus{border-color:#d4af37}'
  +'#yc-modal .yc-hint{font-size:11.5px;color:#8590a6;margin:0 0 14px}'
  +'#yc-submit{width:100%;padding:13px;border-radius:11px;border:none;cursor:pointer;font-weight:800;font-size:15px;'
  +'color:#1a1200;background:linear-gradient(135deg,#d4af37,#f0d488)}'
  +'#yc-submit:disabled{opacity:.55;cursor:default}'
  +'#yc-msg{font-size:13px;margin-top:11px;min-height:18px;line-height:1.5}'
  +'#yc-msg.ok{color:#7fd6a6}#yc-msg.err{color:#f08a8a}'
  +'#yc-close,#yc-close2{background:none;border:none;color:#8590a6;font-size:13px;text-decoration:underline;cursor:pointer;display:block;margin:12px auto 0}'
  +'#yc-done .yc-badge{font-size:54px;line-height:1;margin:2px 0 8px;text-align:center}';
  document.head.appendChild(css);

  var bar=document.createElement('div');
  bar.id='yc-bar';
  bar.innerHTML='<div class="yc-txt">🎓 玩到最後了嗎？完成這個導覽，<b>領取《'+name+'報告》檢核徽章</b></div><button id="yc-go">領取檢核</button>';
  document.body.appendChild(bar);
  // 只在最後結果頁才浮出「領取檢核」——沒玩到結果頁不顯示，避免中途誤領（2026-08-06）
  var ycCertified=false;
  function ycOnResult(){return !!document.querySelector('.result-name,.result-type');}
  function ycSync(){bar.style.display=(!ycCertified&&ycOnResult())?'flex':'none';}
  ycSync();
  new MutationObserver(ycSync).observe(document.body,{childList:true,subtree:true});

  var mask=document.createElement('div');
  mask.id='yc-mask';
  mask.innerHTML='<div id="yc-modal">'
    +'<div id="yc-form">'
      +'<h3>領取《'+name+'報告》檢核</h3>'
      +'<p>輸入你的<b style="color:#e8c86a">會員密碼</b>（訂閱時自設的那組），系統會記下你已看懂這份報告怎麼判讀。</p>'
      +'<input id="yc-email" type="email" placeholder="訂閱用的 email" autocomplete="off">'
      +'<input id="yc-pw" type="password" placeholder="你的會員密碼" autocomplete="off">'
      +'<div class="yc-hint">這組密碼只是會員存取碼，請勿使用你其他重要帳號的密碼。</div>'
      +'<button id="yc-submit">送出，領取徽章</button>'
      +'<div id="yc-msg"></div>'
      +'<button id="yc-close">稍後再說</button>'
    +'</div>'
    +'<div id="yc-done" style="display:none">'
      +'<div class="yc-badge">🏅</div>'
      +'<h3 style="text-align:center">已通過《'+name+'報告》檢核</h3>'
      +'<p id="yc-done-txt" style="text-align:center"></p>'
      +'<button id="yc-close2">完成</button>'
    +'</div>'
  +'</div>';
  document.body.appendChild(mask);

  var $=function(id){return document.getElementById(id);};
  function openModal(){mask.classList.add('on');setTimeout(function(){$('yc-pw').focus();},50);}
  function closeModal(){mask.classList.remove('on');}
  $('yc-go').onclick=openModal;
  $('yc-close').onclick=closeModal;
  $('yc-close2').onclick=closeModal;
  mask.addEventListener('click',function(e){if(e.target===mask)closeModal();});

  function submit(){
    var email=$('yc-email').value.trim(), pw=$('yc-pw').value.trim(), msg=$('yc-msg');
    if(!email||!pw){msg.className='err';msg.textContent='請輸入 email 與會員密碼';return;}
    var btn=$('yc-submit');btn.disabled=true;msg.className='';msg.textContent='驗證中…';
    fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:'certify',email:email,password:pw,reportType:t})})
      .then(function(r){return r.json();})
      .then(function(res){
        btn.disabled=false;
        if(res&&res.done){
          $('yc-form').style.display='none';
          $('yc-done').style.display='block';
          $('yc-done-txt').innerHTML=(res.alreadyCertified?'你先前已通過（'+res.certifiedAt+'）。':'通過日：'+res.certifiedAt+'。')
            +'<br>之後就能安心收到每期《'+name+'報告》了。';
          ycCertified=true;bar.style.display='none';
        }else{
          msg.className='err';msg.textContent=(res&&res.error)?res.error:'驗證失敗，請稍後再試';
        }
      })
      .catch(function(){btn.disabled=false;msg.className='err';msg.textContent='連線失敗，請檢查網路後再試';});
  }
  $('yc-submit').onclick=submit;
  $('yc-pw').addEventListener('keydown',function(e){if(e.key==='Enter')submit();});
})();
</script>
