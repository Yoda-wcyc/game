<audio id="bgm" loop preload="auto"><source src="day_one.mp3"></audio>
<button id="muteBtn" class="mute-btn" onclick="toggleMute()">🔊</button>
<div class="progress-bar" id="progress"></div>
<div id="game"></div>
<script>
const G=document.getElementById('game'),PB=document.getElementById('progress');
const BGM=document.getElementById('bgm'),MUTEBTN=document.getElementById('muteBtn');
let bgmStarted=false,bgmMuted=false;try{bgmMuted=localStorage.getItem('yoda_bgm_muted')==='1';}catch(e){}
if(BGM)BGM.volume=0.30;
function mIcon(){if(MUTEBTN)MUTEBTN.textContent=bgmMuted?'🔇':'🔊';}mIcon();
function toggleMute(){bgmMuted=!bgmMuted;try{localStorage.setItem('yoda_bgm_muted',bgmMuted?'1':'0');}catch(e){}if(bgmMuted){if(BGM)BGM.pause();}else if(BGM)BGM.play().then(()=>bgmStarted=true).catch(()=>{});mIcon();}
window.toggleMute=toggleMute;
document.addEventListener('click',()=>{try{if(!bgmStarted&&!bgmMuted&&BGM)BGM.play().then(()=>bgmStarted=true).catch(()=>{});}catch(e){}});

// ===== 水墨背景 bg(type,sky) =====
function inkCols(sky){const dark=['sky-storm','sky-valley','sky-dawn','sky-dusk','sky-night','sky-start'].includes(sky);
  return dark?['rgba(210,220,245,0.10)','rgba(180,195,230,0.16)','rgba(222,232,252,0.32)']:['rgba(30,35,60,0.10)','rgba(25,30,55,0.16)','rgba(20,25,50,0.28)'];}
const MOTIFS={
 farhills:(f,n,l)=>`<path d="M0,70 C120,50 220,58 340,44 C460,32 560,52 700,40 C840,30 960,50 1080,42 L1200,46 L1200,120 L0,120Z" fill="${f}"/><path d="M0,86 C160,74 300,82 460,70 C640,58 780,76 940,68 C1060,62 1140,72 1200,70 L1200,120 L0,120Z" fill="${n}"/><path d="M0,70 C120,50 220,58 340,44 C460,32 560,52 700,40 C840,30 960,50 1080,42 L1200,46" fill="none" stroke="${l}" stroke-width="1.4"/>`,
 range:(f,n,l)=>`<path d="M0,64 C180,40 300,52 460,36 C620,20 760,44 920,34 C1040,26 1140,40 1200,38 L1200,120 L0,120Z" fill="${f}"/><path d="M0,82 C160,66 320,76 480,60 C640,46 800,70 960,60 C1080,54 1160,64 1200,62 L1200,120 L0,120Z" fill="${n}"/><path d="M0,100 C220,90 420,96 640,86 C860,78 1020,92 1200,84 L1200,120 L0,120Z" fill="${n}"/><path d="M0,64 C180,40 300,52 460,36 C620,20 760,44 920,34 C1040,26 1140,40 1200,38" fill="none" stroke="${l}" stroke-width="1.2" opacity="0.85"/>`,
 peak:(f,n,l)=>`<path d="M0,104 C260,100 430,94 520,56 C560,40 600,20 640,20 C680,20 720,42 760,60 C860,100 1000,102 1200,100 L1200,120 L0,120Z" fill="${n}"/><path d="M600,28 C612,42 628,54 640,60" fill="none" stroke="${l}" stroke-width="1.4"/><rect x="300" y="62" width="620" height="10" fill="${f}"/><path d="M120,86 h240 M470,86 h180 M760,90 h300" stroke="${f}" stroke-width="8" stroke-linecap="round" opacity="0.7"/>`,
 river:(f,n,l)=>`<path d="M0,90 C300,82 500,86 1200,84 L1200,120 L0,120Z" fill="${f}"/><path d="M470,82 Q540,98 610,82" fill="none" stroke="${l}" stroke-width="1.8" stroke-linecap="round"/><path d="M120,94 q80,-4 160,0 t160,0 M700,96 q80,-4 160,0 t160,0" fill="none" stroke="${l}" stroke-width="1" opacity="0.6"/>`};
function bg(type,sky){const m=MOTIFS[type];if(!m)return '';const[f,n,l]=inkCols(sky);return `<svg class="ink-bg" viewBox="0 0 1200 120" preserveAspectRatio="none">${m(f,n,l)}</svg>`;}

// ================= 資料錨定：2026-10-03 市場觀察（資料到 10/02 美股收盤） =================
const ASOF='10/03';
const DATA_DAY='10/02 美股收盤';
// 顏色慣例：漲／偏多／強＝紅、跌／偏空／弱＝綠（全報告同一套）；綠色 #a5d6a7 另用於「答對」回饋
const C_UP='#ff6b7d',C_DN='#7fd0a0',C_Y='#ffd28a',C_O='#ffa060';

// ================= 共用小工具 =================
let PULSE=null;
function startPulse(){if(PULSE)return;PULSE=setInterval(function(){
  const t=Date.now()/1000;
  const a=(0.4+0.5*(0.5+0.5*Math.sin(t*3.0))).toFixed(2);
  const els=document.querySelectorAll('.gpulse');for(let i=0;i<els.length;i++)els[i].setAttribute('opacity',a);
},70);}

// 2×2 象限盒（§03 量價用）：cells 順序＝左上、右上、左下、右下
function quadBox(o,sel,rev){
  const X0=40,Y0=20,X1=286,Y1=214,mx=(X0+X1)/2,my=(Y0+Y1)/2,cw=(X1-X0)/2,ch=(Y1-Y0)/2;
  const box=[[X0,Y0],[mx,Y0],[X0,my],[mx,my]];
  let s='<svg viewBox="0 0 300 250" style="width:100%;max-width:300px;margin:0.4rem auto 0;display:block;background:rgba(6,10,22,0.42);border-radius:12px">';
  s+='<rect x="'+X0+'" y="'+Y0+'" width="'+(X1-X0)+'" height="'+(Y1-Y0)+'" fill="none" stroke="rgba(255,255,255,0.16)"/>';
  for(let i=0;i<4;i++){
    const c=o.cells[i],x=box[i][0],y=box[i][1];
    const on=sel&&sel.indexOf(c.k)>=0, good=rev&&rev.indexOf(c.k)>=0;
    let fill='rgba(255,255,255,0.02)';
    if(good)fill='rgba(120,220,140,0.22)';else if(on)fill='rgba(224,165,38,0.24)';
    s+='<rect class="hz" data-k="'+c.k+'" x="'+x+'" y="'+y+'" width="'+cw+'" height="'+ch+'" fill="'+fill+'" stroke="'+((on||good)?(good?'#7fd6a6':'#e0a526'):'rgba(255,255,255,0.10)')+'" stroke-width="'+((on||good)?2:1)+'" onclick="hsPick(\''+c.k+'\')"/>';
    s+='<text x="'+(x+cw/2)+'" y="'+(y+22)+'" fill="'+(c.col||'rgba(255,255,255,0.86)')+'" font-size="12.5" font-weight="700" text-anchor="middle" pointer-events="none">'+c.n+'</text>';
    if(c.s)s+='<text x="'+(x+cw/2)+'" y="'+(y+39)+'" fill="rgba(255,255,255,0.66)" font-size="10.5" text-anchor="middle" pointer-events="none">'+c.s+'</text>';
  }
  s+='<line x1="'+mx+'" y1="'+Y0+'" x2="'+mx+'" y2="'+Y1+'" stroke="rgba(255,255,255,0.3)" pointer-events="none"/>';
  s+='<line x1="'+X0+'" y1="'+my+'" x2="'+X1+'" y2="'+my+'" stroke="rgba(255,255,255,0.3)" pointer-events="none"/>';
  s+=(o.extra||'');
  if(rev&&o.extraRev)s+=o.extraRev;
  s+='<text x="163" y="236" fill="rgba(255,255,255,0.6)" font-size="10" text-anchor="middle" pointer-events="none">'+o.xlab+'</text>';
  s+='<text x="14" y="117" fill="rgba(255,255,255,0.6)" font-size="10" text-anchor="middle" transform="rotate(-90 14 117)" pointer-events="none">'+o.ylab+'</text>';
  return s+'</svg>';
}

// 市場一分鐘：框內第一列環境判定 → 四題（答案膠囊待你接）→ 定調
const FLOW4_SVG=(function(){
  const nm=['借錢變難了嗎？','市場還怕嗎？','指數站得住嗎？','底下有人跟嗎？'];
  let s='<svg viewBox="0 0 300 250" style="width:100%;max-width:300px;display:block;margin:0 auto">';
  s+='<rect x="6" y="4" width="288" height="26" rx="7" fill="rgba(255,107,125,0.16)" stroke="'+C_UP+'" stroke-opacity="0.7"/>';
  s+='<text x="150" y="21" fill="#fff" font-size="11" text-anchor="middle">環境判定（框內第一列）· 順風 · 上行</text>';
  for(let i=0;i<4;i++){const y=42+i*40;
    s+='<rect x="20" y="'+y+'" width="128" height="26" rx="8" fill="rgba(0,0,0,0.38)" stroke="rgba(224,165,38,0.75)"/>';

// ================= 引擎（ROUNDS／ANS／TRANSITIONS 三陣列同索引；關數一律由 length 算） =================
function prog(){PB.style.width=(Math.max(0,state.idx)/ROUNDS.length*100)+'%';}
function dots(i){return '<div class="step-dots">'+ROUNDS.map(function(_,k){return '<i class="'+(k<=i?'on':'')+'"></i>';}).join('')+'</div>';}
function fade(fn){G.style.transition='opacity .32s';G.style.opacity='0';setTimeout(function(){fn();G.style.opacity='1';},330);}
function scene(sky,bgtype,inner){return '<div class="scene '+sky+'">'+bg(bgtype,sky)+'<div class="overlay">'+inner+'</div></div>';}
function head(r){
 const layers=r.layers?'<div class="layer-list">'+r.layers.map(function(ly){return '<div class="ly"><b>'+ly[0]+'</b><span>'+ly[1]+'</span></div>';}).join('')+'</div>':'';
 const chips=r.chips?'<div style="max-width:480px;margin:0 auto 0.4rem">'+r.chips.map(function(c){return '<span class="data-chip">'+c+'</span>';}).join('')+'</div>':'';
 const so=r.so?'<div class="sowhat">'+r.so+'</div>':'';
 const fig=r.svg?'<div style="margin:0.5rem auto 0.2rem">'+r.svg+'</div>':'';
 return '<div class="chapter-label t-label">'+r.label+'</div><div class="chapter-title t-main" style="font-size:22px;margin-bottom:0.9rem">'+r.title+'</div><div class="round-text t-sub">'+r.text+'</div>'+so+layers+chips+fig;}
function note(r){return r.note?'<div class="fig-note">'+r.note+'</div>':'';}
function btnGive(i){return '<button class="continue-btn" style="opacity:0.72" onclick="giveAnswer('+i+')">給我答案</button>';}
function okBox(txt){return '<div style="max-width:480px;margin:0.7rem auto 0;background:rgba(0,0,0,0.36);border:1px solid rgba(255,255,255,0.26);border-radius:10px;padding:0.9rem 1.1rem;font-size:13.5px;line-height:1.8;color:#fff;text-align:left;backdrop-filter:blur(6px)">'+txt+'</div>';}
function mins(){return Math.max(6,Math.round(ROUNDS.length*0.75));}

function showStart(){
 G.innerHTML=scene('sky-start','farhills',
  '<div class="chapter-label t-label" style="margin-bottom:1rem">YODA RESEARCH · 判斷力學校</div>'
  +'<div class="chapter-title t-main" style="font-size:30px;font-weight:200;letter-spacing:1px;margin-bottom:0.4rem">看懂市場觀察</div>'
  +'<div class="t-sub" style="font-size:14px;margin-bottom:0.3rem;font-style:italic">定調是果，下面那些段落是因</div>'
  +'<div class="t-label" style="font-size:12px;line-height:1.9;margin-bottom:2.6rem">約 '+mins()+' 分鐘 · '+ROUNDS.length+' 站<br>從最上面的市場一分鐘，一路走到最後的驗證點總表<br>讀數取自 '+ASOF+' 那份市場觀察（資料到 '+DATA_DAY+'），用來練讀法</div>'
  +'<button class="continue-btn" style="font-size:15px;padding:0.85rem 3.2rem;border-radius:6px;letter-spacing:2px" onclick="fade(startOpening)">開始</button>');}
let oi=0;function startOpening(){oi=0;renderOpening();}
function renderOpening(){const qs=OPENING.quotes(),q=qs[oi],last=oi>=qs.length-1;
 G.innerHTML=scene(OPENING.sky,OPENING.bg,'<div class="chapter-label t-label">'+OPENING.label+'</div><div class="chapter-title t-main">'+OPENING.title+'</div><div class="chapter-quote t-sub">'+q+'</div><button class="continue-btn" onclick="nextOpening()">'+(last?'從最上面開始 ›':'繼續 ›')+'</button>');}
function nextOpening(){oi++;if(oi>=OPENING.quotes().length)fade(function(){showRound(0);});else fade(renderOpening);}

function showRound(i){state.idx=i;prog();const r=ROUNDS[i];
 if(r.type==='ab')renderAB(i);
 else if(r.type==='place')renderPlace(i);
 else if(r.type==='hotspot')renderHotspot(i);
 else if(r.type==='slider')renderSlider(i);
 else if(r.type==='sort')renderSort(i);
 else if(r.type==='match')renderMatch(i);
 else if(r.type==='flip')renderFlip(i);}

// ── 選擇題 ──
function renderAB(i){const r=ROUNDS[i];
 G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+note(r)+'<div class="round-q t-main">'+r.q+'</div>'
  +'<div class="choices">'+r.choices.map(function(c,k){return '<button class="choice-btn" onclick="abPick('+i+','+k+')">'+c+'</button>';}).join('')+'</div>'
  +btnGive(i));}
function abPick(i,k){const r=ROUNDS[i];if(k===r.correct)state.score++;
 const col=k===r.correct?'#a5d6a7':'#ffcc80';
 G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+'<div class="feedback" style="color:'+col+';min-height:auto;font-size:14px">'+r.fb[k]+'</div><button class="continue-btn" onclick="record('+i+')">繼續 ›</button>');}

// ── 兩段式點選歸位（place / build 共用；點選式，不用原生拖曳 API）──
function placeBody(i,cards,slots,wide,rev,marks){
 const used={};Object.keys(state.pl).forEach(function(s){state.pl[s].forEach(function(c){used[c]=1;});});
 const pool=cards.filter(function(c){return !used[c[0]];});
 let h='<div class="pl-pool">'+(pool.length?pool.map(function(c){
   return '<div class="pl-card'+(state.plSel===c[0]?' sel':'')+'" onclick="plCard(\''+c[0]+'\')">'+c[1]+'</div>';}).join(''):(rev?'':'<div class="t-label" style="font-size:12px">都放好了 —— 按下面的按鈕</div>'))+'</div>';
 h+='<div class="pl-slots">'+slots.map(function(s){
   const got=state.pl[s[0]]||[];
   const chips=got.map(function(cid){const cc=cards.filter(function(x){return x[0]===cid;})[0];return '<span class="pl-chip">'+cc[1]+'</span>';}).join('');
   let cls='pl-slot'+(wide?' wide':'');
   if(marks&&marks[s[0]]!==undefined)cls+=marks[s[0]]?' right':' wrong';
   else if(state.plSel)cls+=' armed';
   return '<div class="'+cls+'" onclick="plSlot(\''+s[0]+'\','+i+')"><div class="sl-t">'+s[1]+'</div><div class="sl-v">'+(chips||'<span style="font-size:11.5px;color:rgba(255,255,255,0.45)">點這裡放進來</span>')+'</div></div>';}).join('')+'</div>';
 return h;}
function plCard(id){state.plSel=(state.plSel===id?null:id);window.plDraw();}
function plSlot(sid,i){const r=ROUNDS[i];
 const cap=r.slots.filter(function(s){return s[0]===sid;})[0][2].split(',').length;
 if(state.plSel){
   Object.keys(state.pl).forEach(function(k){state.pl[k]=state.pl[k].filter(function(c){return c!==state.plSel;});});
   if(!state.pl[sid])state.pl[sid]=[];
   if(state.pl[sid].length>=cap)state.pl[sid].shift();
   state.pl[sid].push(state.plSel);state.plSel=null;
 }else if(state.pl[sid]&&state.pl[sid].length){state.pl[sid].pop();}
 if(window.plDraw)window.plDraw();}
function plFull(slots){let n=0;Object.keys(state.pl).forEach(function(k){n+=state.pl[k].length;});
 let need=0;slots.forEach(function(s){need+=s[2].split(',').length;});return n===need;}
function plMarks(slots){const m={};slots.forEach(function(s){
  const want=s[2].split(',').sort().join(',');const got=(state.pl[s[0]]||[]).slice().sort().join(',');m[s[0]]=(want===got);});return m;}
function renderPlace(i){const r=ROUNDS[i];
 if(state.plFor!==i){state.plFor=i;state.pl={};state.plSel=null;}
 function draw(){G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+note(r)+'<div class="round-q t-main" style="font-size:15px">'+r.q+'</div>'
   +placeBody(i,r.cards,r.slots,r.wide)
   +'<div class="btnrow">'+(plFull(r.slots)?'<button class="continue-btn" onclick="plCheck('+i+')">檢查</button>':'')+btnGive(i)+'</div>');}
 window.plDraw=draw;draw();}
function plCheck(i){const r=ROUNDS[i];const m=plMarks(r.slots);
 let ok=0;Object.keys(m).forEach(function(k){if(m[k])ok++;});
 if(ok===r.slots.length)state.score++;
 G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+placeBody(i,r.cards,r.slots,r.wide,true,m)
  +'<div class="feedback" style="color:'+(ok===r.slots.length?'#a5d6a7':'#ffcc80')+';min-height:auto;font-size:13.5px">放對 '+ok+'/'+r.slots.length+' 格'+(ok===r.slots.length?'':'（紅框那幾格放錯了）')+'</div>'
  +okBox(r.done)+'<button class="continue-btn" onclick="record('+i+')">繼續 ›</button>');}

// ── 點圖熱區 ──
function hsPick(k){const i=state.hsFor,r=ROUNDS[i];if(!r||r.type!=='hotspot')return;const p=state.hs.indexOf(k);
 if(p>=0)state.hs.splice(p,1);
 else{if(state.hs.length>=r.need.length)state.hs.shift();state.hs.push(k);}
 if(window.hsDraw)window.hsDraw();}
function renderHotspot(i){const r=ROUNDS[i];
 if(state.hsFor!==i){state.hsFor=i;state.hs=[];}
 function draw(){const done=state.hs.length===r.need.length;
  G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+'<div class="round-q t-main" style="font-size:15px">'+r.q+'</div>'
   +(r.hsFig?r.hsFig(state.hs,null):quadBox(r.quad,state.hs,null))+note(r)
   +'<div class="btnrow">'+(done?'<button class="continue-btn" onclick="hsCheck('+i+')">檢查</button>':'')+btnGive(i)+'</div>');}
 window.hsDraw=draw;draw();}
function hsCheck(i){const r=ROUNDS[i];
 const ok=r.need.slice().sort().join(',')===state.hs.slice().sort().join(',');
 if(ok)state.score++;
 window.hsDraw=null;
 G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+(r.hsFig?r.hsFig(state.hs,r.need):quadBox(r.quad,state.hs,r.need))+note(r)
  +okBox('<span style="color:'+(ok?'#a5d6a7':'#ffcc80')+'">'+(ok?'答對了。':'差一點——正解已經標出來。')+'</span><br>'+(ok?r.fbOk:r.fbNo+'<br><br>'+r.fbOk))
  +'<button class="continue-btn" onclick="record('+i+')">繼續 ›</button>');}

// ── 拉桿 ──
function slUpd(){const i=state.slFor,r=ROUNDS[i];
 const f=document.getElementById('slfig');if(f)f.innerHTML=r.fig(state.sv);
 const l=document.getElementById('slval');if(l)l.innerHTML=r.vlab(state.sv);}
function renderSlider(i){const r=ROUNDS[i];
 if(state.slFor!==i){state.slFor=i;state.sv=r.slider.init;}
 G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+'<div class="round-q t-main" style="font-size:15px">'+r.q+'</div>'
  +'<div id="slfig">'+r.fig(state.sv)+'</div>'+note(r)
  +'<div class="gauge-wrap" style="max-width:440px"><input type="range" class="gsl" min="'+r.slider.min+'" max="'+r.slider.max+'" value="'+state.sv+'" oninput="state.sv=parseInt(this.value);slUpd()">'
  +'<div class="gsl-ends"><span>'+r.slider.lo+'</span><span>'+r.slider.hi+'</span></div></div>'
  +'<div id="slval" class="feedback" style="min-height:38px;font-size:13.5px;color:#fff">'+r.vlab(state.sv)+'</div>'
  +'<div class="btnrow"><button class="continue-btn" onclick="slDone('+i+')">就這樣 ›</button>'+btnGive(i)+'</div>');}
function slDone(i){const r=ROUNDS[i];const ok=r.correct(state.sv);if(ok)state.score++;
 G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+'<div id="slfig">'+r.fig(state.sv)+'</div>'+note(r)
  +'<div class="feedback" style="min-height:auto;font-size:13.5px;color:#fff">'+r.vlab(state.sv)+'</div>'
  +okBox('<span style="color:'+(ok?'#a5d6a7':'#ffcc80')+'">'+(ok?'到了。':'還沒到——答案在這裡。')+'</span><br>'+(ok?r.fbOk:r.fbNo+'<br><br>'+r.fbOk))
  +'<button class="continue-btn" onclick="record('+i+')">繼續 ›</button>');}

// ── 排序（點兩張互換，不用上下鍵）──
function soPick(k){if(state.soSel===null){state.soSel=k;}
 else if(state.soSel===k){state.soSel=null;}
 else{const a=state.so[state.soSel];state.so[state.soSel]=state.so[k];state.so[k]=a;state.soSel=null;}
 if(window.soDraw)window.soDraw();}
function soBody(r,marks){return '<div class="st-list">'+state.so.map(function(v,k){
  let cls='st-row'+(state.soSel===k&&!marks?' sel':'');
  if(marks)cls+=(v===k?' right':' wrong');
  return '<div class="'+cls+'" onclick="'+(marks?'':'soPick('+k+')')+'"><b>'+(k+1)+'</b><span>'+r.items[v]+'</span></div>';}).join('')+'</div>';}
function renderSort(i){const r=ROUNDS[i];
 if(state.soFor!==i){state.soFor=i;state.so=r.shuffle.slice();state.soSel=null;}
 function draw(){G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+'<div class="round-q t-main" style="font-size:15px">'+r.q+'</div>'
   +soBody(r)+note(r)
   +'<div class="btnrow"><button class="continue-btn" onclick="soCheck('+i+')">檢查</button>'+btnGive(i)+'</div>');}
 window.soDraw=draw;draw();}
function soCheck(i){const r=ROUNDS[i];let ok=0;state.so.forEach(function(v,k){if(v===k)ok++;});
 if(ok===r.items.length)state.score++;
 window.soDraw=null;
 G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+soBody(r,true)
  +'<div class="feedback" style="color:'+(ok===r.items.length?'#a5d6a7':'#ffcc80')+';min-height:auto;font-size:13.5px">排對 '+ok+'/'+r.items.length+' 格</div>'
  +okBox((ok===r.items.length?'':'正確順序由上到下：<br>'+r.items.map(function(t,k){return (k+1)+'　'+t;}).join('<br>')+'<br><br>')+r.fbOk)+'<button class="continue-btn" onclick="record('+i+')">繼續 ›</button>');}

// ── 連連看 ──
function mtPick(side,k){if(side==='L'){state.mtSel=(state.mtSel===k?null:k);}
 else if(state.mtSel){
   Object.keys(state.mt).forEach(function(l){if(state.mt[l]===k)delete state.mt[l];});
   state.mt[state.mtSel]=k;state.mtSel=null;}
 if(window.mtDraw)window.mtDraw();}
function mtLines(){const svg=document.getElementById('mtlines');if(!svg)return;
 const wrap=document.getElementById('mtwrap');if(!wrap)return;
 const wb=wrap.getBoundingClientRect();let s='';
 Object.keys(state.mt).forEach(function(l){
   const a=document.getElementById('mtL'+l),b=document.getElementById('mtR'+state.mt[l]);
   if(!a||!b)return;
   const ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();
   const x1=ra.right-wb.left,y1=ra.top-wb.top+ra.height/2,x2=rb.left-wb.left,y2=rb.top-wb.top+rb.height/2;
   const mid=(x1+x2)/2;
   s+='<path d="M'+x1+','+y1+' C'+mid+','+y1+' '+mid+','+y2+' '+x2+','+y2+'" fill="none" stroke="rgba(224,165,38,0.85)" stroke-width="2"/>';
   s+='<circle cx="'+x1+'" cy="'+y1+'" r="3.5" fill="#e0a526"/><circle cx="'+x2+'" cy="'+y2+'" r="3.5" fill="#e0a526"/>';});
 svg.innerHTML=s;svg.setAttribute('viewBox','0 0 '+Math.max(1,wb.width)+' '+Math.max(1,wb.height));}
function mtBody(r,marks){
 let h='<div class="mt-wrap" id="mtwrap"><svg class="mt-lines" id="mtlines" preserveAspectRatio="none"></svg><div class="mt-cols"><div class="mt-col">';
 h+=r.left.map(function(x){let c='mt-item'+(state.mtSel===x[0]?' sel':'')+(state.mt[x[0]]?' on':'');
   if(marks)c+=(state.mt[x[0]]===x[0]?' right':' wrong');
   return '<div class="'+c+'" id="mtL'+x[0]+'" onclick="'+(marks?'':'mtPick(\'L\',\''+x[0]+'\')')+'">'+x[1]+'</div>';}).join('');
 h+='</div><div class="mt-col">';
 h+=r.right.map(function(x){const linked=Object.keys(state.mt).filter(function(l){return state.mt[l]===x[0];}).length>0;
   return '<div class="mt-item'+(linked?' on':'')+'" id="mtR'+x[0]+'" onclick="'+(marks?'':'mtPick(\'R\',\''+x[0]+'\')')+'">'+x[1]+'</div>';}).join('');
 return h+'</div></div></div>';}
function renderMatch(i){const r=ROUNDS[i];
 if(state.mtFor!==i){state.mtFor=i;state.mt={};state.mtSel=null;}
 function draw(){const done=Object.keys(state.mt).length===r.left.length;
  G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+'<div class="round-q t-main" style="font-size:15px">'+r.q+'</div>'
   +mtBody(r)+note(r)
   +'<div class="btnrow">'+(done?'<button class="continue-btn" onclick="mtCheck('+i+')">檢查</button>':'')+btnGive(i)+'</div>');
  mtLines();}
 window.mtDraw=draw;draw();}
function mtCheck(i){const r=ROUNDS[i];let ok=0;r.left.forEach(function(x){if(state.mt[x[0]]===x[0])ok++;});
 if(ok===r.left.length)state.score++;
 const wrongOnes=r.left.filter(function(x){return state.mt[x[0]]!==x[0];});
 const fix=wrongOnes.length?'正解：<br>'+wrongOnes.map(function(x){const rr=r.right.filter(function(y){return y[0]===x[0];})[0];return x[1]+' → '+rr[1];}).join('<br>')+'<br><br>':'';
 window.mtDraw=null;
 G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+mtBody(r,true)
  +'<div class="feedback" style="color:'+(ok===r.left.length?'#a5d6a7':'#ffcc80')+';min-height:auto;font-size:13.5px">接對 '+ok+'/'+r.left.length+' 條</div>'
  +okBox(ok===r.left.length?r.fbOk:r.fbNo+'<br>'+fix+r.fbOk)
  +'<button class="continue-btn" onclick="record('+i+')">繼續 ›</button>');
 mtLines();}

// ── 翻牌 ＋ 建構收尾 ──
function renderFlip(i){const r=ROUNDS[i];
 if(state.fpFor!==i){state.fpFor=i;state.fp=0;state.pl={};state.plSel=null;state.plFor=i;}
 if(state.fp===0){
   G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+'<div class="round-q t-main" style="font-size:15px">'+r.q+'</div>'
    +'<div class="fp-bets">'+r.bets.map(function(b){return '<button class="fp-bet" onclick="fpBet('+i+',\''+b[0]+'\')">'+b[1]+'</button>';}).join('')+'</div>'
    +btnGive(i));
 }else{fpBuild(i);}}
function fpBet(i,k){const r=ROUNDS[i];if(k===r.betOk)state.score++;
 G.innerHTML=scene(r.sky,r.bg,dots(i)+head(r)+r.reveal
  +okBox('<span style="color:'+(k===r.betOk?'#a5d6a7':'#ffcc80')+'">'+(k===r.betOk?'你猜對了。':'猜反了——但重點不在猜對。')+'</span><br>'+r.revealTxt)
  +(r.buildTitle?'<button class="continue-btn" onclick="fpNext('+i+')">最後一件事 ›</button>':'<button class="continue-btn" onclick="record('+i+')">繼續 ›</button>'));}
function fpNext(i){state.fp=1;state.pl={};state.plSel=null;fade(function(){fpBuild(i);});}
function fpBuild(i){const r=ROUNDS[i];
 G.innerHTML=scene('sky-clear','range',dots(i)
  +'<div class="chapter-label t-label">'+r.label+' · 收尾</div><div class="chapter-title t-main" style="font-size:22px;margin-bottom:0.9rem">'+r.buildTitle+'</div>'
  +'<div class="round-q t-main" style="font-size:15px">'+r.buildQ+'</div>'
  +placeBody(i,r.cards,r.slots,true)
  +'<div class="btnrow">'+(plFull(r.slots)?'<button class="continue-btn" onclick="fpDone('+i+')">排好了 ›</button>':'')+btnGive(i)+'</div>');
 window.plDraw=function(){fpBuild(i);};}
function fpDone(i){const r=ROUNDS[i];const m=plMarks(r.slots);
 let ok=0;Object.keys(m).forEach(function(k){if(m[k])ok++;});
 window.plDraw=null;
 G.innerHTML=scene('sky-clear','range',dots(i)

  +'box-shadow:0 20px 60px rgba(0,0,0,.6);color:#eef2fb;'
  +"font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif}"
  +'#yc-modal h3{font-size:19px;font-weight:800;margin:0 0 6px}'
  +'#yc-modal p{font-size:13.5px;line-height:1.6;color:#aab3c8;margin:0 0 14px}'
  +'#yc-modal input{width:100%;padding:12px 14px;font-size:15px;border-radius:11px;border:1px solid rgba(255,255,255,.16);'
  +'background:#05070f;color:#fff;outline:none;margin-bottom:6px}'
  +'#yc-modal input:focus{border-color:#d4af37}'
  +'#yc-modal .yc-hint{font-size:11.5px;color:#8590a6;margin:0 0 14px}'
  +'#yc-submit{width:100%;padding:13px;border-radius:11px;border:none;cursor:pointer;font-weight:800;font-size:15px;'
  +'color:#1a1200;background:linear-gradient(135deg,#d4af37,#f0d488)}'
  +'#yc-submit:disabled{opacity:.55;cursor:default}'
  +'#yc-msg{font-size:13px;margin-top:11px;min-height:18px;line-height:1.5}'
  +'#yc-msg.ok{color:#7fd6a6}#yc-msg.err{color:#f08a8a}'
  +'#yc-close,#yc-close2{background:none;border:none;color:#8590a6;font-size:13px;text-decoration:underline;cursor:pointer;display:block;margin:12px auto 0}'
  +'#yc-done .yc-badge{font-size:54px;line-height:1;margin:2px 0 8px;text-align:center}';
  document.head.appendChild(css);

  var bar=document.createElement('div');
  bar.id='yc-bar';
  bar.innerHTML='<div class="yc-txt">🎓 玩到最後了嗎？完成這個導覽，<b>領取《'+name+'報告》檢核徽章</b></div><button id="yc-go">領取檢核</button>';
  document.body.appendChild(bar);
  // 只在最後結果頁才浮出「領取檢核」——沒玩到結果頁不顯示，避免中途誤領（2026-08-06）
  var ycCertified=false;
  function ycOnResult(){return !!document.querySelector('.result-name,.result-type');}
  function ycSync(){bar.style.display=(!ycCertified&&ycOnResult())?'flex':'none';}
  ycSync();
  new MutationObserver(ycSync).observe(document.body,{childList:true,subtree:true});

  var mask=document.createElement('div');
  mask.id='yc-mask';
  mask.innerHTML='<div id="yc-modal">'
    +'<div id="yc-form">'
      +'<h3>領取《'+name+'報告》檢核</h3>'
      +'<p>輸入你的<b style="color:#e8c86a">會員存取碼</b>（訂閱時自設的那組，僅用於比對身分），系統會記下你已完成本教材。</p>'
      +'<input id="yc-email" type="email" placeholder="訂閱用的 email" autocomplete="off">'
      +'<input id="yc-pw" type="password" placeholder="你的會員密碼" autocomplete="off">'
      +'<div class="yc-hint">這組密碼只是會員存取碼，請勿使用你其他重要帳號的密碼。</div>'
      +'<button id="yc-submit">送出，領取徽章</button>'
      +'<div id="yc-msg"></div>'
      +'<button id="yc-close">稍後再說</button>'
    +'</div>'
    +'<div id="yc-done" style="display:none">'
      +'<div class="yc-badge">🏅</div>'
      +'<h3 style="text-align:center">已通過《'+name+'報告》檢核</h3>'
      +'<p id="yc-done-txt" style="text-align:center"></p>'
      +'<button id="yc-close2">完成</button>'
    +'</div>'
  +'</div>';
  document.body.appendChild(mask);

  var $=function(id){return document.getElementById(id);};
  function openModal(){mask.classList.add('on');setTimeout(function(){$('yc-pw').focus();},50);}
  function closeModal(){mask.classList.remove('on');}
  $('yc-go').onclick=openModal;
  $('yc-close').onclick=closeModal;
  $('yc-close2').onclick=closeModal;
  mask.addEventListener('click',function(e){if(e.target===mask)closeModal();});

  function submit(){
    var email=$('yc-email').value.trim(), pw=$('yc-pw').value.trim(), msg=$('yc-msg');
    if(!email||!pw){msg.className='err';msg.textContent='請輸入 email 與會員密碼';return;}
    var btn=$('yc-submit');btn.disabled=true;msg.className='';msg.textContent='驗證中…';
    fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:'certify',email:email,password:pw,reportType:t})})
      .then(function(r){return r.json();})
      .then(function(res){
        btn.disabled=false;
        if(res&&res.done){
          $('yc-form').style.display='none';
          $('yc-done').style.display='block';
          $('yc-done-txt').innerHTML=(res.alreadyCertified?'你先前已通過（'+res.certifiedAt+'）。':'通過日：'+res.certifiedAt+'。')
            +'<br>此紀錄只是教材完成紀錄，與訂閱權益、報告寄送無關。';
          ycCertified=true;bar.style.display='none';
        }else{
          msg.className='err';msg.textContent=(res&&res.error)?res.error:'驗證失敗，請稍後再試';
        }
      })
      .catch(function(){btn.disabled=false;msg.className='err';msg.textContent='連線失敗，請檢查網路後再試';});
  }
  $('yc-submit').onclick=submit;
  $('yc-pw').addEventListener('keydown',function(e){if(e.key==='Enter')submit();});
})();
</script>
