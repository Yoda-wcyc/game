<body>
<audio id="bgm" loop preload="auto"><source src="day_one.mp3" type="audio/mpeg"></audio>
<button id="muteBtn" class="mute-btn" onclick="toggleMute()" aria-label="音樂開關">🔊</button>
<div class="progress-bar" id="progress"></div>
<div id="game"></div>
<script>
const G=document.getElementById('game');
const PB=document.getElementById('progress');

// ---- 背景音樂控制 ----
const BGM=document.getElementById('bgm');
const MUTEBTN=document.getElementById('muteBtn');
let bgmStarted=false;
let bgmMuted=false;
try{ bgmMuted = localStorage.getItem('yoda_bgm_muted')==='1'; }catch(e){}
if(BGM){ BGM.volume=0.30; }
function updateMuteIcon(){ if(MUTEBTN) MUTEBTN.textContent = bgmMuted ? '🔇' : '🔊'; }
updateMuteIcon();
function startBGM(){
  if(bgmStarted || bgmMuted || !BGM) return;
  BGM.play().then(function(){ bgmStarted=true; }).catch(function(){});
}
function toggleMute(){
  bgmMuted=!bgmMuted;
  try{ localStorage.setItem('yoda_bgm_muted', bgmMuted?'1':'0'); }catch(e){}
  if(bgmMuted){ if(BGM) BGM.pause(); }
  else{ if(BGM){ BGM.play().then(function(){bgmStarted=true;}).catch(function(){}); } }
  updateMuteIcon();
}
window.toggleMute=toggleMute;
// 第一次任何點擊都嘗試啟動音樂（解鎖瀏覽器自動播放限制）
document.addEventListener('click', startBGM, {once:false});


const CHAPTERS=[
  {label:'第一章',title:'修術',sky:'sky-dawn',quotes:['你買了課、追了粉專、做了筆記。<br>但每次要下單，還是不知道從哪裡開始。']},
  {label:'第二章',title:'修道',sky:'sky-valley',quotes:['有一天，你突然看見了。升息、美元、油價、債券——<br>它們不是獨立的，它們在說同一件事。','市場不是隨機的。它有節奏。只是你還沒找到那個頻率。<br>經濟是一張立體拼圖，你以前只看到一塊，<br>現在，你開始看見它們如何咬合。','牽一髮動全身。<br>這句話在你第一次看懂一個完整的傳導鏈之後，才真正有了重量。','從這裡開始，你看市場的方式，會慢慢不一樣。']},
  {label:'第三章',title:'修心',sky:'sky-mountain',quotes:['長線需要耐心。短線需要紀律。兩者都需要你足夠了解自己。','有些人用長線睡得著覺。有些人靠短線感覺活著。<br>答案沒有對錯，只有適不適合。']},
  {label:'第四章',title:'融合',sky:'sky-clear',quotes:['當你停止尋找唯一正確的答案，才開始建立自己的系統。','沒有哪一樣武器可以獨立戰鬥。<br>總經是地圖，技術是指南針，基本面是糧草。','你走到這裡，不是為了得到答案。而是為了開始問對問題。','系統不是別人給你的。是你一次次選擇之後，留下來的東西。']}
];

const ROUNDS=[
  {ch:0,sky:'sky-dawn',title:'資訊的迷宮',text:'你訂閱了十個財經粉專。每天早上打開手機，A說升息要買債，B說現在是佈局科技股的好時機，C說要現金為王。三種聲音，三種邏輯，聽起來都有道理。',question:'你選擇相信誰？',choices:['找最多人推薦的那個，跟著大家走比較安全','先擱置，繼續學，等自己想清楚再說']},
  {ch:0,sky:'sky-gray',title:'技術分析的誘惑',text:'你開始學K線。黃金交叉、死亡交叉、RSI超買超賣。<br>買了課，做了筆記，自以為看懂了圖。<br>第一次出手，照著型態買，結果隔天跳空下跌。',question:'你怎麼解讀這次失敗？',choices:['圖表分析本來就是騙人的，我不玩了','我的判斷有問題，要繼續研究，找出哪裡看錯了']},
  {ch:0,sky:'sky-noon',title:'總經焦慮症',text:'你開始關注宏觀。Fed利率、CPI、PCE、殖利率曲線、PMI……每個數據公布，市場都在震盪。你試圖每個都追，每天花三個小時看報告，卻發現愈看愈焦慮，愈焦慮愈不敢動。',question:'你怎麼面對這種焦慮？',choices:['資訊太多了，我決定只看最重要的幾個指標，其他不管','繼續全追，資訊就是武器，我不能放棄任何一塊']},
  {ch:0,sky:'sky-afternoon',title:'好公司，壞時機',text:'你研究了一家公司半個月。財報漂亮、護城河深、管理層優秀。你買進了。然後股價五年都沒動，甚至還跌了15%。同期大盤漲了60%。',question:'你的結論是什麼？',choices:['基本面分析沒用，市場根本不在乎企業真實價值','好公司是必要條件，但進場時機同樣關鍵，我的功課還沒做完']},
  {ch:0,sky:'sky-dusk',title:'知道太多，動不了',text:'你學了技術分析、基本面、總體經濟。每次想出手，腦袋裡同時響起五個聲音：技術面說可以、基本面說還早、總經說不確定、新聞說要小心、內心說算了。最後你什麼都沒做。',question:'你意識到問題在哪裡？',choices:['問題是資訊還不夠，我需要更多確定性才能行動','問題是我沒有一個屬於自己的判斷框架，資訊沒有主軸']},
  {ch:1,sky:'sky-valley',title:'第一次看見連結',text:'某天你在看一篇分析。作者說：Fed升息→美元走強→新興市場資金外逃→匯率貶值→央行被迫跟進升息→壓制內需→企業盈餘下修。你第一次感覺，原來這些事情不是各自獨立發生的。',question:'這個頓悟帶給你什麼感受？',choices:['原來要先搞懂宏觀，才能看懂個股在做什麼','這太複雜了，我寧願找個簡單的公式']},
  {ch:1,sky:'sky-storm',title:'市場的節奏',text:'你開始研究景氣循環。擴張、高峰、收縮、谷底。你發現，歷史上每一次大跌，幾乎都能在總經數據裡找到先行警訊。市場不是隨機的，它有節奏，有慣性，有記憶。',question:'你對週期的理解是？',choices:['懂週期就能預測市場，我要開始用這個做決策','週期是地圖，不是時刻表。它告訴我方向，但不告訴我今天幾點']},
  {ch:1,sky:'sky-clouds',title:'三種工具的位置',text:'你開始思考：總經給你大方向，技術分析幫你找進出場時機，基本面讓你對標的有信心。這三者不是競爭關係，是分工關係。',question:'你的下一步是？',choices:['先精通一種，其他的以後再說','開始練習同時用三種視角看同一個市場']},
  {ch:1,sky:'sky-storm',title:'信仰的破綻',text:'你最信任的方法，在某個特定環境下完全失效了。信總經的人遇到了「Fed降息但股市反跌」；信技術的人遇到了「完美型態卻跳空崩潰」；信基本面的人持有的好公司股價持續創新低。',question:'這次的失效教會了你什麼？',choices:['每一種方法都有它的盲點，沒有萬能公式','我選錯方法了，要換一種試試']},
  {ch:2,sky:'sky-mountain',title:'你真正想要什麼',text:'你在投資上花了大量時間和精力。有時候你問自己：我為什麼要做這件事？是要財富自由？財富自由之後要做什麼？是要不用上班？還是要能夠掌控自己的時間？還是只是不想被錢追著跑？',question:'你最誠實的答案是？',choices:['我想要時間自由——能選擇自己要做什麼，不被工作綁架','我想要安全感——不再擔心錢的問題，生活有底氣']},
  {ch:2,sky:'sky-mountain',title:'長線還是短線',text:'你站在一個岔路口。長線投資說：複利的力量，時間是你的朋友，耐心等待，讓好公司替你工作。短線交易說：現在就要有現金流，等三十年太遠，機會是抓住當下的。',question:'你傾向哪一條路？',choices:['長線——我相信複利，我願意等，我想睡得著','短線——我需要現在的成就感和現金流，等太久我撐不住']},
  {ch:2,sky:'sky-starry',title:'兩者能並行嗎',text:'選了長線的你：上週大盤跌12%，你的長線部位帳面虧損，你撐得住嗎？選了短線的你：要維持一定勝率需要每天花4-6小時盯盤，這是你願意付出的代價嗎？',question:'你的答案是？',choices:['也許長線和短線不是非此即彼，可以用不同資金分別執行','不，我必須選一個專注，分心只會兩頭都做不好']},
  {ch:3,sky:'sky-clear',title:'建立你的系統',text:'你已經走過了資訊的迷宮，看見了經濟的立體拼圖，也誠實面對了自己對財富的渴望。\n\n現在，調整屬於你的投資配重。沒有標準答案。只有適合你的那一個。',question:'',choices:[]}
];

  null,

];

const PERSONALITIES=[
  {icon:'🔥',name:'衝動型',desc:'你跟著感覺走，市場讓你又愛又恨。情緒是你最大的資產，也是最大的敵人。<br><br>下一步：先建立一個「冷卻期」——每次想出手，等24小時再做決定。'},
  {icon:'🧊',name:'分析癱瘓型',desc:'你懂得很多，但就是下不了手。你需要的不是更多資訊，而是一個「夠好就行」的決策標準。<br><br>下一步：設定3個條件都滿足就進場的規則，然後執行它。'},
  {icon:'🌿',name:'緩慢覺醒型',desc:'你走過了彎路，正在找到自己的節奏。你比大多數人更了解自己的盲點，這是最珍貴的資產。<br><br>下一步：把你的交易記錄下來，你會發現屬於自己的模式。'},
  {icon:'🏔️',name:'系統型',desc:'你已經開始用框架思考，而不是追單一個股。這是成熟投資者的標誌。<br><br>下一步：用小倉位測試你的系統，驗證之後再逐步放大。'},
  {icon:'🔭',name:'融合型',desc:'你走過了三條路的掙扎，開始建立屬於自己的視角。總經、技術、基本面，你不再選邊，而是開始整合。<br><br>下一步：找到你最擅長的那一塊，讓它成為系統的核心。'},
  {icon:'⚖️',name:'配重師',desc:'你懂得長短並行、工具互補，並且誠實面對了自己真正想要什麼。<br><br>下一步：你已經準備好了。去找一個能幫你把這套系統落地的框架。'}
];

const BALANCE_ITEMS=[
  {key:'index',label:'大盤指數',color:'#e0a526'},
  {key:'stock',label:'個股選股',color:'#68d391'},
  {key:'longterm',label:'長線投資',color:'#63b3ed'},
  {key:'shortterm',label:'短線交易',color:'#fc8181'},
];

let state={chIndex:-1,roundIndex:-1,scores:[],balance:{index:25,stock:25,longterm:25,shortterm:25},quoteIndex:0};

function updateProgress(){
  const total=13;
  const done=state.scores.length;
  PB.style.width=(done/total*100)+'%';
}

function mtn(sky){
  const dark=['sky-night','sky-starry','sky-storm','sky-valley','sky-dawn','sky-start','sky-dusk'].includes(sky);
  const c1=dark?'rgba(10,10,28,0.88)':'rgba(25,25,55,0.48)';
  const c2=dark?'rgba(4,4,15,0.97)':'rgba(12,12,35,0.68)';
  return `<svg class="mountains" viewBox="0 0 1200 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,180 L100,95 L200,140 L320,68 L440,115 L560,48 L680,105 L800,58 L920,92 L1040,44 L1200,82 L1200,220 L0,220Z" fill="${c1}"/>
    <path d="M0,210 L80,172 L180,188 L280,155 L380,174 L500,138 L620,162 L740,130 L860,155 L980,118 L1100,142 L1200,125 L1200,220 L0,220Z" fill="${c2}"/>
  </svg>`;
}

function fade(fn){
  G.style.transition='opacity 0.32s';
  G.style.opacity='0';
  setTimeout(()=>{fn();G.style.opacity='1';},330);
}

function showStart(){
  G.innerHTML=`<div class="scene sky-start">
    ${mtn('sky-start')}
    <div class="overlay">
      <div class="chapter-label t-label" style="margin-bottom:1rem">YODA RESEARCH</div>
      <div class="chapter-title t-main" style="font-size:36px;font-weight:200;letter-spacing:2px;margin-bottom:0.5rem">投資者的修行</div>
      <div class="t-sub" style="font-size:14px;margin-bottom:0.4rem;font-style:italic">一段關於人性、方法與智慧的旅程</div>
      <div class="t-label" style="font-size:12px;margin-bottom:3rem;letter-spacing:1px">共 13 輪選擇 · 四章敘事</div>
      <button class="continue-btn" style="font-size:15px;padding:0.85rem 3.5rem;border-radius:6px;letter-spacing:2px" onclick="fade(()=>showChapter(0))">開始旅程</button>
    </div>
  </div>`;
}

function showChapter(idx){
  state.chIndex=idx;state.quoteIndex=0;
  renderChapterQuote(idx);
}

function renderChapterQuote(idx){
  const ch=CHAPTERS[idx];
  const q=ch.quotes[state.quoteIndex];
  const isLast=state.quoteIndex>=ch.quotes.length-1;
  G.innerHTML=`<div class="scene ${ch.sky}">
    ${mtn(ch.sky)}
    <div class="overlay">
      <div class="chapter-label t-label">${ch.label}</div>
      <div class="chapter-title t-main">${ch.title}</div>
      <div class="chapter-quote t-sub">${q}</div>
      <button class="continue-btn" onclick="nextCQ(${idx})">${isLast?'進入 ›':'繼續 ›'}</button>
    </div>
  </div>`;
}

function nextCQ(idx){
  const ch=CHAPTERS[idx];
  state.quoteIndex++;
  if(state.quoteIndex>=ch.quotes.length){
    const starts=[0,5,9,12];
    fade(()=>showRound(starts[idx]));
  } else {
    fade(()=>renderChapterQuote(idx));
  }
}

function showRound(ri){
  state.roundIndex=ri;
  updateProgress();
  const r=ROUNDS[ri];
  if(ri===12){showBalanceRound();return;}
  const chNames=['修術','修道','修心','融合'];
  G.innerHTML=`<div class="scene ${r.sky}">
    ${mtn(r.sky)}
    <div class="overlay">
      <div class="chapter-label t-label">${CHAPTERS[r.ch].label} · ${chNames[r.ch]}</div>
      <div class="chapter-title t-main" style="font-size:21px;margin-bottom:1rem">${r.title}</div>
      <div class="round-text t-sub">${r.text}</div>
      <div class="round-question t-main">${r.question}</div>
      <div class="choices">
        ${r.choices.map((c,i)=>`<button class="choice-btn" onclick="choose(${ri},${i})">${c}</button>`).join('')}
      </div>
    </div>
  </div>`;
}

function choose(ri,ci){
  state.scores.push({round:ri,choice:ci});
  updateProgress();
  const tr=TRANSITIONS[ri];
  if(tr){fade(()=>showTransition(tr,ri));}
  else{advanceFromRound(ri);}
}

function showTransition(text,fromRi){
  G.innerHTML=`<div class="scene sky-night" style="background:linear-gradient(180deg,#020408,#060d18,#0e1828)">
    ${mtn('sky-night')}
    <div class="overlay">
      <div class="transition-quote">${text}</div>
      <button class="continue-btn" onclick="advanceFromRound(${fromRi})">繼續 ›</button>
    </div>
  </div>`;
}

function advanceFromRound(fromRi){
  const next=fromRi+1;
  if(next>=ROUNDS.length){fade(()=>showResult());return;}
  const curCh=ROUNDS[fromRi].ch;
  const nxtCh=ROUNDS[next].ch;
  if(nxtCh!==curCh){fade(()=>showChapter(nxtCh));}
  else{fade(()=>showRound(next));}
}

function showBalanceRound(){
  function getTotal(){return Object.values(state.balance).reduce((a,b)=>a+b,0);}
  function render(){
    const total=getTotal();
    const ok=total===100;
    G.innerHTML=`<div class="scene sky-clear">
      ${mtn('sky-clear')}
      <div class="overlay">
        <div class="chapter-label t-label">第四章 · 融合</div>
        <div class="chapter-title t-main" style="font-size:22px;margin-bottom:0.75rem">建立你的系統</div>
        <div class="round-text t-sub" style="margin-bottom:1.75rem">你已經走過了資訊的迷宮，看見了經濟的立體拼圖，<br>也誠實面對了自己對財富的渴望。<br><br>現在，調整屬於你自己的投資配重。<br>沒有標準答案，只有適合你的那一個。</div>
        <div class="balance-container">
          ${BALANCE_ITEMS.map(it=>`
            <div class="balance-item">
              <div class="balance-label t-sub" style="color:${it.color};font-size:13px">${it.label}</div>
              <input type="range" class="bslider" min="5" max="70" step="5" value="${state.balance[it.key]}"
                style="accent-color:${it.color}"
                data-key="${it.key}"
                oninput="state.balance[this.dataset.key]=parseInt(this.value);renderBal()">
              <div class="balance-pct" style="color:${it.color}">${state.balance[it.key]}%</div>
            </div>
          `).join('')}
          <div style="text-align:center;margin-top:0.5rem">
            <span class="balance-total ${ok?'bal-ok':'bal-warn'}">
              總計：${total}%　${ok?'✓ 完成':'請調整至 100%'}
            </span>
          </div>
        </div>
        ${ok?`<br><button class="continue-btn" style="margin-top:0.75rem;font-size:14px;padding:0.7rem 2.5rem" onclick="fade(()=>showResult())">揭示我的投資人格 →</button>`:''}
      </div>
    </div>`;
  }
  window.renderBal=render;
  render();
}

function calcPersonality(){
  const get=(ri)=>state.scores.find(x=>x.round===ri)?.choice??0;
  const ch0=[0,1,2,3,4].map(i=>get(i));
  const ch1=[5,6,7,8].map(i=>get(i));
  const ch2=[9,10,11].map(i=>get(i));
  const impulsive=ch0.filter(c=>c===0).length;
  const systematic=ch1.filter(c=>c===1).length;
  const parallel=ch2[2]===0;
  if(parallel&&systematic>=3)return 5;
  if(parallel)return 4;
  if(systematic>=3)return 3;
  if(impulsive>=4)return 0;
  if(ch0.filter(c=>c===1).length>=4)return 1;
  return 2;
}

function showResult(){
  PB.style.width='100%';
  const pi=calcPersonality();
  const p=PERSONALITIES[pi];
  const b=state.balance;
  G.innerHTML=`<div class="scene sky-result" style="padding:3.5rem 1.5rem;min-height:100vh">
    ${mtn('sky-result')}
    <div class="overlay">
      <div class="chapter-label t-label" style="margin-bottom:1rem">你的修行結果</div>
      <div class="result-icon">${p.icon}</div>
      <div class="result-type t-main">${p.name}</div>
      <div class="result-desc t-sub">${p.desc}</div>
      <div class="result-config">
        <div class="result-config-title">你的投資配重</div>
        ${BALANCE_ITEMS.map(it=>`
          <div class="result-config-row">
            <span class="t-sub" style="font-size:13px">${it.label}</span>
            <span style="color:${it.color};font-weight:500;font-size:14px">${b[it.key]}%</span>
          </div>`).join('')}
      </div>
      <div class="t-sub" style="font-size:13px;line-height:1.95;margin-bottom:1.5rem;max-width:400px;margin-left:auto;margin-right:auto">
        準備好把這套系統落地了嗎？<br>
        Yoda Research 每週追蹤總體經濟、技術面與個股選股，<br>
        幫你把框架轉化為真實的決策。
      </div>
      <div style="display:flex;gap:0.75rem;justify-content:center;margin-top:1rem;flex-wrap:wrap">
        <a class="yoda-btn" href="https://iamtwispin.substack.com/" target="_blank" rel="noopener">免費訂閱簡報 →</a>
        <a class="yoda-btn" href="https://yoda-research-next.vercel.app/" target="_blank" rel="noopener">Yoda Research</a>
        <button class="share-btn" id="shareBtn" onclick="shareGame()"><span id="shareIcon">&#8679;</span> 分享這個遊戲</button>
      </div>
      <div style="margin-top:0.9rem"><button class="continue-btn" style="font-size:12px;opacity:0.6" onclick="restart()">重新開始</button></div>
      <div id="shareFeedback" style="font-size:12px;color:rgba(160,220,255,0.7);margin-top:0.6rem;height:18px;transition:opacity 0.3s"></div>
      <div style="font-size:11px;color:rgba(255,255,255,0.35);margin-top:1.5rem;letter-spacing:0.3px">背景音樂 by <a href="https://www.youtube.com/@BiBiPiano" target="_blank" style="color:rgba(224,165,38,0.6);text-decoration:none">BiBiPiano</a>，版權為原作者所有</div>
    </div>
  </div>`;
}

function restart(){
  state={chIndex:-1,roundIndex:-1,scores:[],balance:{index:25,stock:25,longterm:25,shortterm:25},quoteIndex:0};
  PB.style.width='0%';
  fade(()=>showStart());
}

function shareGame(){
  const url=window.location.href.split('?')[0];
  const text='我剛完成了《投資者的修行》，一個關於人性與投資智慧的互動體驗。你也來試試看你是哪種投資人格？';
  const btn=document.getElementById('shareBtn');
  const fb=document.getElementById('shareFeedback');
  if(navigator.share){
    navigator.share({title:'投資者的修行 · Yoda Research',text:text,url:url}).catch(()=>{});
    return;
  }
  navigator.clipboard.writeText(url).then(()=>{
    btn.classList.add('copied');
    btn.innerHTML='&#10003; 網址已複製';
    fb.textContent='貼到 LINE、Facebook 或任何地方分享吧';
    fb.style.opacity='1';
    setTimeout(()=>{
      btn.classList.remove('copied');
      btn.innerHTML='&#8679; 分享這個遊戲';
      fb.style.opacity='0';
    },3000);
  }).catch(()=>{
    const box=document.createElement('input');
    box.value=url;
    document.body.appendChild(box);
    box.select();
    document.execCommand('copy');
    document.body.removeChild(box);
    fb.textContent='網址已複製！';
    fb.style.opacity='1';
    setTimeout(()=>{fb.style.opacity='0';},3000);
  });
}
window.shareGame=shareGame;
window.fade=fade;
window.showChapter=showChapter;
window.nextCQ=nextCQ;
window.choose=choose;
window.advanceFromRound=advanceFromRound;
window.showResult=showResult;
window.restart=restart;
window.state=state;

showStart();
</script>
