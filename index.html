<meta charset="UTF-8">

<title>投資者的修行 · Yoda Research</title>
<meta property="og:title" content="投資者的修行 · Yoda Research">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;font-family:-apple-system,'PingFang TC','Noto Sans TC',sans-serif}
body{background:linear-gradient(180deg,#05070a 0%,#0a0e14 40%,#0d1018 100%);min-height:100vh;color:#fff;overflow-x:hidden}

.wrap{max-width:960px;margin:0 auto;padding:4rem 1.5rem 5rem;position:relative;z-index:2}

/* Ambient glow */
.glow{position:fixed;border-radius:50%;filter:blur(120px);opacity:0.22;pointer-events:none;z-index:1}
.glow1{width:500px;height:500px;background:#e0a526;top:-150px;right:-100px}
.glow2{width:400px;height:400px;background:#c62828;bottom:10%;left:-150px;opacity:0.15}
.glow3{width:350px;height:350px;background:#0288d1;top:40%;right:-80px;opacity:0.12}

/* Header */
.hero{text-align:center;margin-bottom:3.5rem}
.brand{font-size:12px;letter-spacing:5px;text-transform:uppercase;color:rgba(224,165,38,0.7);margin-bottom:1.25rem}
.hero h1{font-size:clamp(30px,6vw,46px);font-weight:200;letter-spacing:3px;margin-bottom:1rem;background:linear-gradient(135deg,#fff 30%,#e0a526 120%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{font-size:15px;line-height:1.9;color:rgba(255,255,255,0.6);max-width:440px;margin:0 auto;text-wrap:balance}

/* Divider */
.divider{width:40px;height:2px;background:linear-gradient(90deg,transparent,#e0a526,transparent);margin:2rem auto}

/* Section label */
.sec-label{font-size:12px;letter-spacing:2px;color:rgba(255,255,255,0.4);text-transform:uppercase;margin-bottom:1.5rem;text-align:center}

/* Game grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.5rem}

.card{position:relative;border-radius:16px;overflow:hidden;cursor:pointer;text-decoration:none;color:inherit;border:1px solid rgba(255,255,255,0.1);transition:transform 0.3s,border-color 0.3s,box-shadow 0.3s;display:flex;flex-direction:column;min-height:230px}
.card:hover{transform:translateY(-6px);border-color:rgba(224,165,38,0.4);box-shadow:0 12px 40px rgba(0,0,0,0.5)}
.card.locked{cursor:default;opacity:0.55}
.card.locked:hover{transform:none;border-color:rgba(255,255,255,0.1);box-shadow:none}

.card-sky{height:130px;position:relative;overflow:hidden}
.card-mtn{position:absolute;bottom:0;left:0;right:0;height:45px}

.card-num{position:absolute;top:0.85rem;left:1rem;font-size:12px;letter-spacing:1px;color:rgba(255,255,255,0.7);z-index:3;font-weight:500}
.card-status{position:absolute;top:0.85rem;right:1rem;font-size:10px;letter-spacing:1px;padding:0.2rem 0.6rem;border-radius:20px;z-index:3;background:rgba(0,0,0,0.35);backdrop-filter:blur(4px)}
.status-live{color:#a5d6a7;border:1px solid rgba(165,214,167,0.4)}
.status-soon{color:rgba(255,255,255,0.6);border:1px solid rgba(255,255,255,0.25)}

.card-body{padding:1.1rem 1.25rem 1.4rem;background:rgba(15,18,24,0.85);flex:1;display:flex;flex-direction:column}
.card-title{font-size:19px;font-weight:400;margin-bottom:0.5rem;letter-spacing:0.5px}
.card-pain{font-size:13px;line-height:1.7;color:rgba(255,255,255,0.55);flex:1;text-wrap:pretty}
.card-cta{font-size:12px;color:#e0a526;margin-top:0.9rem;letter-spacing:1px;display:flex;align-items:center;gap:0.3rem}
.card-cta.soon{color:rgba(255,255,255,0.4)}

/* Footer */
.foot{text-align:center;margin-top:4rem}
.yoda-link{display:inline-block;background:linear-gradient(135deg,#e0a526,#b8860b);color:#fff;padding:0.85rem 2.5rem;border-radius:8px;text-decoration:none;font-size:14px;letter-spacing:1px;transition:opacity 0.2s,transform 0.2s}
.yoda-link:hover{opacity:0.9;transform:translateY(-2px)}
.foot-note{font-size:12px;color:rgba(255,255,255,0.35);margin-top:1.5rem;letter-spacing:0.5px}
</style>
</head>
<body>
<div class="glow glow1"></div>
<div class="glow glow2"></div>
<div class="glow glow3"></div>

<div class="wrap">
  <div class="hero">
    <div class="brand">Yoda Research</div>
    <h1>投資者的修行</h1>
    <p>一系列關於投資人性的互動體驗。<br>每一段旅程，都是一次照見自己的機會。</p>
  </div>

  <div class="divider"></div>
  <div class="sec-label">選擇你的旅程</div>

  <div class="grid" id="grid"></div>

  <div class="foot">
    <a class="yoda-link" href="https://yoda-research-next.vercel.app/" target="_blank">前往 Yoda Research →</a>
    <div class="foot-note">總經找方向 · 技術看進出 · 配重定節奏</div>
  </div>
</div>

<script>
// ============================================
// 新增遊戲：複製一個 { } 區塊，改內容即可
// status: 'live' = 已上線, 'soon' = 即將推出
// sky: 天色漸層 CSS（延續遊戲場景風格）
// ============================================兒童AI-會唬爛-10到14
const GAMES=[
  {
    date:'2026.8.8',
    title:'檢討 2026-8',
    pain:'2026 這一波：狂漲→見頂→血洗→7/30 落底→翻上。每個轉折，訊號其實都說了——你當時讀懂了嗎？',
    file:'檢討_2026-8.html',
    status:'live',
    sky:'linear-gradient(180deg,#12131f 0%,#4a0f16 45%,#7a5a8e 100%)',
    dark:true
  },
  {
    date:'2026.8.4',
    title:'我是一筆日圓',
    pain:'你是一筆被借走的日圓，每天替人賺利差——但頭上，一直懸著一把刀。何時該走？',
    file:'我是一筆日圓.html',
    status:'live',
    sky:'linear-gradient(180deg,#0a0e1a 0%,#2a1a3d 45%,#7a1a1a 100%)',
    dark:true
  },
  {
    date:'2026.8.3',
    title:'報告導航',
    pain:'六種報告，今天到底該讀哪一份？選一個，我帶你玩懂它。',
    file:'報告導航.html',
    status:'live',
    sky:'linear-gradient(180deg,#5D9FFF 0%,#FFB347 50%,#FFCC33 100%)',
    dark:false
  },
  {
    date:'2026.8.2',
    title:'讀懂美股報告',
    pain:'股票那麼多，你到底要選誰？跟著資金流，一層層篩掉 99%。',
    file:'讀懂美股報告.html',
    status:'live',
    sky:'linear-gradient(180deg,#1a1a2e 0%,#e8b86d 60%,#f4a261 100%)',
    dark:true
  },
   {
    date:'2026.8.2',
    title:'景氣循環的DNA',
    pain:'完全讀懂總經報告',
    file:'景氣循環的DNA-20260802.html',
    status:'live',
    sky:'linear-gradient(180deg,#1a1a2e 0%,#e8b86d 60%,#f4a261 100%)',
    dark:true
  },
  {
    date:'2026.8.1',
    title:'看懂簡報',
    pain:'你訂閱了簡報，但你只看完標題就滑掉',
    file:'看懂簡報.html',
    status:'live',
    sky:'linear-gradient(180deg,#1a1a2e 0%,#e8b86d 60%,#f4a261 100%)',
    dark:true
  },
  {
    date:'2026.8.1',
    title:'讀懂市場觀察-七段導覽',
    pain:'你訂閱了市場觀察報告，但你只會看第7段',
    file:'看懂市場觀察-七段導覽.html',
    status:'live',
    sky:'linear-gradient(180deg,#1a1a2e 0%,#e8b86d 60%,#f4a261 100%)',
    dark:true
  },
   {
    date:'2026.7.28',
    title:'你適不適合這裡',
    pain:'股市沒有答案，只有地圖。',
    file:'answer-or-map.html',
    status:'live',
    sky: 'linear-gradient(180deg, #5D9FFF 0%, #FFB347 50%, #FFCC33 100%)',
dark: false
  },
  {
    date:'2026.7.25',
    title:'投資者的修行',
    pain:'你買了課、追了粉專、做了筆記，但每次要下單，還是不知道從哪裡開始。',
    file:'投資者的修行-20260725.html',
    status:'live',
    sky:'linear-gradient(180deg,#1a1a2e 0%,#e8b86d 60%,#f4a261 100%)',
    dark:true
  },
  {
    date:'2026.7.26',
    title:'信仰的重量',
    pain:'你重壓的持股崩了，你以為看錯了方向。但也許，錯的從來不是方向。',
    file:'信仰的重量-20260726.html',
    status:'live',
    sky:'linear-gradient(180deg,#1a0505 0%,#3d0a0a 40%,#7a1a1a 100%)',
    dark:true
  },
  {
    date:'2026.7.27',
    title:'敢不敢',
    pain:'這週急殺趕底，你受傷了。但你心裡清楚，方向沒變。你還敢上車嗎？',
    file:'敢不敢.html',
    status:'live',
    sky:'linear-gradient(180deg,#1a0505 0%,#4d0808 40%,#8a1010 100%)',
    dark:true
  },
  {
    date:'2026.7.29',
    title:'落底訊號',
    pain:'收到融資追繳令了，怎麼辦，底到底在哪?',
    file:'落底訊號-20260729.html',
    status:'live',
    sky:'linear-gradient(180deg,#1a0505 0%,#4d0808 40%,#8a1010 100%)',
    dark:true
  },
 
  {
    date:'',
    title:'即將推出',
    pain:'下一段旅程正在路上。',
    file:'',
    status:'soon',
    sky:'linear-gradient(180deg,#1b2631 0%,#2e4057 45%,#5d7a8a 100%)',
    dark:true
  },
];

function mtn(dark){
  const c1=dark?'rgba(10,8,15,0.85)':'rgba(20,25,50,0.45)';
  const c2=dark?'rgba(4,3,10,0.95)':'rgba(10,12,35,0.6)';
  return '<svg class="card-mtn" viewBox="0 0 400 45" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">'+
    '<path d="M0,38 L50,18 L110,30 L170,12 L230,26 L290,10 L350,22 L400,14 L400,45 L0,45Z" fill="'+c1+'"/>'+
    '<path d="M0,44 L60,32 L130,38 L200,28 L270,36 L340,26 L400,32 L400,45 L0,45Z" fill="'+c2+'"/></svg>';
}

const grid=document.getElementById('grid');
GAMES.sort(function(a,b){function dn(d){var p=(d||'0.0.0').split('.').map(Number);return (p[0]||0)*10000+(p[1]||0)*100+(p[2]||0);}return dn(b.date)-dn(a.date);});
GAMES.forEach(function(g){
  const isLive=g.status==='live';
  const statusBadge=isLive
    ? '<div class="card-status status-live">可遊玩</div>'
    : '<div class="card-status status-soon">即將推出</div>';
  const cta=isLive
    ? '<div class="card-cta">開始旅程 →</div>'
    : '<div class="card-cta soon">敬請期待</div>';
  const dateLabel=g.date?'<div class="card-num">'+g.date+'</div>':'';
  const inner=
    '<div class="card-sky" style="background:'+g.sky+'">'+
      dateLabel+
      statusBadge+
      mtn(g.dark)+
    '</div>'+
    '<div class="card-body">'+
      '<div class="card-title">'+g.title+'</div>'+
      '<div class="card-pain">'+g.pain+'</div>'+
      cta+
    '</div>';
  if(isLive){
    const a=document.createElement('a');
    a.className='card';
    a.href=g.file;
    a.innerHTML=inner;
    grid.appendChild(a);
  }else{
    const d=document.createElement('div');
    d.className='card locked';
    d.innerHTML=inner;
    grid.appendChild(d);
  }
});
</script>
<script src="https://yoda-research-next.vercel.app/yoda-game-badge.js" defer></script>
