<meta charset="UTF-8">

<title>股票那麼多，要選誰？｜讀懂美股報告 · Yoda Research</title>
<style>
:root{
  --gold:#d4af37; --gold-dim:#b8960a;
  --card:rgba(9,12,22,.68); --card-bd:rgba(255,255,255,.14);
  --text:#eef2fb; --dim:#aab3c8; --ink:#e7ecf7;
  --good:#5fbf8f; --bad:#e06b6b; --warn:#e8b45f;
  --recovery:#30d158; --growth:#2997ff; --boom:#ff9f0a; --recession:#ff453a;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;
  color:var(--text);background:#05060f;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.72}

.sky-layer{position:fixed;inset:0;z-index:-3;transition:background .8s ease}
.ink-layer{position:fixed;left:0;right:0;bottom:0;height:24vh;min-height:150px;z-index:-2;pointer-events:none}
.ink-layer .ink-bg{width:100%;height:100%;display:block}
.veil{position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 80% at 50% 8%,transparent 40%,rgba(0,0,0,.36));pointer-events:none}
body.sky-noon  .sky-layer{background:linear-gradient(180deg,#22345f,#5f79b0 42%,#d9b978 80%,#edd199)}
body.sky-storm .sky-layer{background:linear-gradient(180deg,#0b0b12,#171733 50%,#33409e)}
body.sky-night .sky-layer{background:linear-gradient(180deg,#05060f,#0e1630 55%,#182a54)}
body.sky-dusk  .sky-layer{background:linear-gradient(180deg,#241436,#6a3a63 42%,#c9743f 80%,#e79a56)}
body.sky-clear .sky-layer{background:linear-gradient(180deg,#173a68,#4a7cc0 44%,#a6cff0 82%,#d9edfb)}
body.sky-valley .sky-layer{background:linear-gradient(180deg,#0c1420,#243247 52%,#3d5470)}

.progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:100;
  background:linear-gradient(90deg,var(--gold-dim),var(--gold));transition:width .5s ease;box-shadow:0 0 8px rgba(212,175,55,.6)}
.mute{position:fixed;top:12px;right:14px;z-index:101;width:38px;height:38px;border-radius:50%;
  border:1px solid var(--card-bd);background:rgba(9,12,22,.55);color:var(--text);font-size:17px;cursor:pointer;backdrop-filter:blur(8px)}
.counter{position:fixed;top:14px;left:16px;z-index:101;font-size:12px;color:var(--dim);
  font-family:'SF Mono',Consolas,monospace;background:rgba(9,12,22,.5);padding:4px 10px;border-radius:999px;backdrop-filter:blur(8px)}

.stage{position:relative;z-index:1;min-height:100%;display:flex;align-items:center;justify-content:center;padding:64px 18px 54px}
#scene{width:100%;max-width:640px;animation:fade .5s ease both}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fadeout{animation:fo .3s ease both}
@keyframes fo{to{opacity:0;transform:translateY(-10px)}}

.card{background:var(--card);border:1px solid var(--card-bd);border-radius:18px;padding:28px 24px;
  backdrop-filter:blur(14px);box-shadow:0 18px 50px rgba(0,0,0,.42)}
.eyebrow{font-size:12px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:12px}
.tag{display:inline-block;font-size:12px;padding:3px 11px;border-radius:999px;background:rgba(212,175,55,.16);
  color:var(--gold);border:1px solid rgba(212,175,55,.3);margin-bottom:12px;letter-spacing:1px}
.tag.teach{background:rgba(41,151,255,.16);color:#7fb8ff;border-color:rgba(41,151,255,.35)}
.tag.prac{background:rgba(95,191,143,.16);color:#7fd6a6;border-color:rgba(95,191,143,.35)}
h1{font-size:33px;font-weight:800;line-height:1.28;letter-spacing:.5px;margin-bottom:8px}
h2{font-size:22px;font-weight:700;line-height:1.42;margin-bottom:12px}
.lead{font-size:17px;color:#dfe6f4;margin:6px 0 18px}
p.body{font-size:16px;color:#e6ebf6;margin:11px 0}
.dim{color:var(--dim)} .hl{color:var(--gold);font-weight:700}
.up{color:#7fd6a6;font-weight:700}.down{color:#f08a8a;font-weight:700}.warnc{color:var(--warn);font-weight:700}
.data-box{background:rgba(255,255,255,.045);border:1px solid var(--card-bd);border-radius:12px;padding:14px 16px;margin:14px 0;font-size:15px;line-height:1.7}
.data-box .row{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
/* 定義型 data-box：左標籤／右說明對齊成兩欄，標籤不再被擠到換行；不影響數值型(.stat/.sig)表 2026-08-06 */
.data-box:has(.row>.dim){display:grid;grid-template-columns:max-content minmax(0,1fr);column-gap:14px;row-gap:5px}
.data-box:has(.row>.dim) .row{display:contents}
.data-box:has(.row>.dim) .row>b{align-self:start}
.data-box:has(.row>.dim) .row>.dim{align-self:start;text-align:left}
.data-box .row b{color:#fff;font-weight:700}
.stat{font-family:'SF Mono',Consolas,monospace}

.btn{display:block;width:100%;text-align:left;font-size:16px;color:var(--text);background:rgba(255,255,255,.05);
  border:1px solid var(--card-bd);border-radius:13px;padding:15px 17px;margin:10px 0;cursor:pointer;transition:all .16s;line-height:1.5}
.btn:hover{background:rgba(255,255,255,.11);border-color:var(--gold);transform:translateY(-1px)}
.btn small{display:block;color:var(--dim);font-size:13px;margin-top:3px}
.btn.pick-good{border-color:var(--good);background:rgba(95,191,143,.18)}
.btn.pick-bad{border-color:var(--bad);background:rgba(224,107,107,.15)}
.btn:disabled{cursor:default}
.cta{display:inline-block;margin-top:18px;padding:13px 30px;border-radius:999px;font-size:16px;font-weight:700;
  color:#1a1200;background:linear-gradient(135deg,var(--gold),#f0d488);border:none;cursor:pointer;box-shadow:0 6px 20px rgba(212,175,55,.32);transition:transform .15s}
.cta:hover{transform:translateY(-2px)}
.cta.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold);box-shadow:none}
.center{text-align:center}

.help{margin-top:14px;text-align:center}
.help button{background:none;border:none;color:var(--dim);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.help button:hover{color:var(--gold)}
.reveal{display:none;margin-top:16px;padding:15px 16px;border-radius:12px;background:rgba(212,175,55,.08);
  border:1px solid rgba(212,175,55,.35);font-size:15px;line-height:1.66}
.reveal.show{display:block;animation:fade .35s ease both}
.reveal b{color:var(--gold)}
.gloss{margin-top:10px;padding-top:10px;border-top:1px dashed rgba(255,255,255,.16);font-size:13.5px;color:var(--dim)}
.gloss span{color:#dbe3f2}

.mono-wrap{text-align:center;padding:6vh 8px}
.mono-wrap p{font-size:25px;font-weight:300;letter-spacing:1.5px;line-height:1.9;color:#f2f4fb;opacity:0;animation:mfade 1.1s ease forwards}
.mono-wrap p:nth-child(2){animation-delay:.9s}
.mono-wrap .next{margin-top:30px;opacity:0;animation:mfade 1s ease forwards;animation-delay:1.9s}
@keyframes mfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 溫度條 */
.tempbar{margin:16px 0 6px}
.tempbar-track{display:grid;grid-template-columns:repeat(4,1fr);border-radius:12px;overflow:hidden;border:1px solid var(--card-bd)}
.tz{padding:16px 6px;text-align:center;cursor:pointer;transition:all .16s;font-size:14px;font-weight:700;position:relative;border-right:1px solid rgba(0,0,0,.25)}
.tz:last-child{border-right:none}
.tz small{display:block;font-size:11.5px;font-weight:400;color:rgba(255,255,255,.7);margin-top:3px}
.tz.z0{background:linear-gradient(180deg,rgba(48,209,88,.32),rgba(48,209,88,.14))}
.tz.z1{background:linear-gradient(180deg,rgba(41,151,255,.32),rgba(41,151,255,.14))}
.tz.z2{background:linear-gradient(180deg,rgba(255,159,10,.34),rgba(255,159,10,.16))}
.tz.z3{background:linear-gradient(180deg,rgba(255,69,58,.34),rgba(255,69,58,.16))}
.tz:hover{filter:brightness(1.25)}
.tz.sel{outline:3px solid var(--gold);outline-offset:-3px;z-index:2}
.tz.correct{outline:3px solid var(--good);outline-offset:-3px;z-index:2}
.tz.wrong{outline:3px solid var(--bad);outline-offset:-3px}
.tempbar-scale{display:grid;grid-template-columns:repeat(4,1fr);font-size:11px;color:var(--dim);margin-top:5px;text-align:center}

/* 半圓儀表 */
.gauge{width:100%;max-width:320px;display:block;margin:8px auto}
.gauge .arc-bg{fill:none;stroke:rgba(255,255,255,.12);stroke-width:16;stroke-linecap:round}
.gauge .arc-ok{fill:none;stroke:var(--good);stroke-width:16;stroke-linecap:round}
.gauge .arc-hot{fill:none;stroke:var(--recession);stroke-width:16;stroke-linecap:round}
.gauge .needle{stroke:var(--gold);stroke-width:4;stroke-linecap:round}
.gauge .hub{fill:var(--gold)}
.gauge text{fill:var(--dim);font-size:12px;font-family:'SF Mono',monospace}
.gauge .val{fill:#fff;font-size:26px;font-weight:800;text-anchor:middle}
.gauge .unit{fill:var(--dim);font-size:12px;text-anchor:middle}

/* 天秤 */
.scale{width:100%;max-width:340px;height:auto;display:block;margin:6px auto 2px}
.scale .stand,.scale .beam,.scale .lstr,.scale .rstr{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.scale .beam{stroke-width:5}.scale .base{fill:var(--ink)}.scale .pivot{fill:var(--gold)}
.scale .lpan,.scale .rpan{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.scale text{fill:var(--text);font-size:14px;font-weight:700;text-anchor:middle;paint-order:stroke;stroke:rgba(0,0,0,.45);stroke-width:3px}
.pick-row{display:flex;gap:10px;margin-top:8px}
.pick-row .btn{margin:0;text-align:center}

/* 分類（先行/同步/滯後） */
.clf-item{border:1px solid var(--card-bd);border-radius:12px;padding:11px 13px;margin:9px 0;background:rgba(255,255,255,.04)}
.clf-item .name{font-size:15px;font-weight:600;margin-bottom:7px}
.clf-item .name small{display:block;color:var(--dim);font-size:12.5px;font-weight:400;margin-top:2px}
.clf-btns{display:flex;gap:7px}
.clf-btns button{flex:1;font-size:13px;padding:8px 4px;border-radius:9px;border:1px solid var(--card-bd);
  background:rgba(255,255,255,.05);color:var(--text);cursor:pointer;transition:all .14s}
.clf-btns button:hover{border-color:var(--gold)}
.clf-btns button.on{background:rgba(212,175,55,.22);border-color:var(--gold);color:#fff;font-weight:700}
.clf-item.right{border-color:var(--good);background:rgba(95,191,143,.12)}
.clf-item.wrong{border-color:var(--bad);background:rgba(224,107,107,.12)}

/* 排序（誰先變） */
.sort-item{display:flex;align-items:center;gap:12px;border:1px solid var(--card-bd);border-radius:12px;
  padding:13px 15px;margin:9px 0;background:rgba(255,255,255,.04);cursor:pointer;transition:all .15s}
.sort-item:hover{border-color:var(--gold)}
.sort-item.picked{opacity:.55;border-color:var(--good)}
.sort-item .rank{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid var(--dim);display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:15px;color:var(--dim)}
.sort-item.picked .rank{background:var(--gold);border-color:var(--gold);color:#1a1200}
.sort-item .lbl{font-size:15px;line-height:1.45}
.sort-item .lbl small{display:block;color:var(--dim);font-size:12.5px}
.sort-item .tag-lead{margin-left:auto;font-size:11px;padding:2px 8px;border-radius:999px;flex-shrink:0}

/* 檢查表 */
.check{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;margin:9px 0;border-radius:12px;
  border:1px solid var(--card-bd);background:rgba(255,255,255,.04);cursor:pointer;transition:all .15s}
.check:hover{border-color:var(--gold)}
.check.on{border-color:var(--good);background:rgba(95,191,143,.14)}
.check .box{flex:0 0 24px;height:24px;border-radius:7px;border:2px solid var(--dim);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;transition:all .15s}
.check.on .box{background:var(--good);border-color:var(--good)}
.check .lbl{font-size:15px;line-height:1.5}
.check .lbl small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px}
/* 翻牌（榮景末前哨清單） */
.flipwrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 4px}
@media(max-width:520px){.flipwrap{grid-template-columns:1fr}}
.flipcard{perspective:1100px;cursor:pointer;min-height:158px}
.flipinner{position:relative;width:100%;height:100%;min-height:158px;transition:transform .55s cubic-bezier(.4,.15,.2,1);transform-style:preserve-3d}
.flipcard.on .flipinner{transform:rotateY(180deg)}
.flipface{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:12px;border:1px solid var(--card-bd);padding:15px;display:flex;flex-direction:column;justify-content:center;overflow:auto}
.flipfront{background:rgba(255,255,255,.05);opacity:1;transition:opacity 0s .27s}
.flipcard.on .flipfront{opacity:0}
.flipcard:hover .flipfront{border-color:var(--gold)}
.flipfront .ft{font-size:15px;line-height:1.5;font-weight:700;color:var(--text)}
.flipfront .hint{margin-top:9px;font-size:11.5px;color:var(--dim)}
.flipback{background:rgba(95,191,143,.14);border-color:var(--good);transform:rotateY(180deg);opacity:0;transition:opacity 0s .27s}
.flipcard.on .flipback{opacity:1}
.flipback .bh{font-size:11px;color:var(--good);font-weight:700;letter-spacing:.05em;margin-bottom:6px}
.flipback .bt{font-size:12.5px;line-height:1.55;color:#e6ebf6}

/* 結果 */
.result-emoji{font-size:62px;text-align:center;line-height:1;margin:4px 0}
.result-name{text-align:center;font-size:27px;font-weight:800;color:var(--gold);margin-bottom:3px}
.result-tier{text-align:center;font-size:12.5px;letter-spacing:2px;color:var(--dim);margin-bottom:8px}
.result-score{text-align:center;font-size:14px;color:var(--dim);margin-bottom:14px}
.unlock{border:1px solid rgba(212,175,55,.4);border-radius:12px;padding:14px 16px;margin:14px 0;background:rgba(212,175,55,.07);font-size:15px;line-height:1.66}
.unlock b{color:var(--gold)}
.fpt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:16px 0}
.fpt{border:1px solid var(--card-bd);border-radius:12px;overflow:hidden;font-size:13px;min-width:560px}
.fpt .fpt-row{display:grid;grid-template-columns:1.25fr .82fr .82fr .95fr .82fr 1.15fr;border-top:1px solid var(--card-bd)}
.fpt .fpt-row:first-child{border-top:none}
.fpt .fpt-row>div{padding:8px 6px;border-right:1px solid var(--card-bd);line-height:1.4}
.fpt .fpt-row>div:last-child{border-right:none}
.fpt .fpt-head{background:rgba(255,255,255,.06);font-weight:700;text-align:center;font-size:12px}
.fpt .fpt-ind{font-weight:600;color:#dbe3f2}
.fpt .cur{background:rgba(212,175,55,.13);color:#e8c86a;font-weight:600}
.act-btns{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.act-btn{display:block;text-align:center;padding:15px 18px;border-radius:13px;font-size:15.5px;font-weight:700;text-decoration:none;transition:transform .15s}
.act-btn:hover{transform:translateY(-2px)}
.act-sub{background:linear-gradient(135deg,var(--gold),#f0d488);color:#1a1200;box-shadow:0 6px 20px rgba(212,175,55,.3)}
.act-report{background:rgba(255,255,255,.07);color:var(--text);border:1px solid var(--gold)}
.act-share{background:rgba(255,255,255,.07);color:var(--text);border:1px solid var(--card-bd)}
.replay{text-align:center;margin-top:16px}.replay a{color:var(--dim);font-size:13px;text-decoration:underline;cursor:pointer}
.credit{text-align:center;margin-top:18px;font-size:11.5px;color:var(--dim);line-height:1.7}.credit a{color:var(--dim)}
.neutral-note{font-size:12px;color:var(--dim);text-align:center;margin-top:12px;opacity:.85}
@media(max-width:480px){h1{font-size:27px}h2{font-size:19px}.card{padding:22px 16px}.mono-wrap p{font-size:21px}
  .fpt .fpt-row{grid-template-columns:1.25fr .82fr .82fr .95fr .82fr 1.15fr;font-size:11px}}
</style>
</head>

/* ===== 狀態 / 導覽 ===== */
let cur=0; const state={score:0,max:0,answered:{}};
const el=id=>document.getElementById(id);
const scene=()=>el('scene');

function applyEnv(i){
  const s=S[i]; document.body.className=s.sky;
  el('ink').innerHTML=bg(s.bg,s.sky);
  el('prog').style.width=(i/(S.length-1)*100)+'%';
  const qnum=S.slice(0,i+1).filter(x=>['classify','flip','phasepick','gauge','scale','templocate','sort'].includes(x.type)).length;
  const qtot=S.filter(x=>['classify','flip','phasepick','gauge','scale','templocate','sort'].includes(x.type)).length;
  el('counter').textContent = s.tag ? (['classify','flip','phasepick','gauge','scale','templocate','sort'].includes(s.type)?`第 ${qnum}/${qtot} 題`:'') : '';
}
function go(i){
  const sc=scene(); sc.classList.add('fadeout');
  setTimeout(()=>{ cur=i; sc.classList.remove('fadeout'); render(i); applyEnv(i);
    window.scrollTo({top:0,behavior:'smooth'});},300);
}
function next(){ if(cur<S.length-1) go(cur+1); }

/* ===== 主 render 分派 ===== */
function render(i){
  const s=S[i], sc=scene(); sc.style.animation='none'; void sc.offsetWidth; sc.style.animation='fade .5s ease both';
  const R=RENDER[s.type]; sc.innerHTML=R.html(s,i); if(R.init) R.init(s,i);
}
function contBtn(label){return `<div class="center"><button class="cta" onclick="next()">${label||'繼續 →'}</button></div>`;}
function helpBtn(i){return `<div class="help" id="help${i}"><button onclick="give(${i})">看不懂？給我答案</button></div>`;}
function nextSlot(i){return `<div class="center" id="nx${i}" style="display:none;margin-top:6px"><button class="cta" onclick="next()">下一步 →</button></div>`;}
function tagHTML(s){return s.tag?`<span class="tag ${s.tagc||''}">${s.tag}</span>`:'';}

/* 完成一題：計分、顯示解說、放行 */
function resolve(i,correct,revealHTML){
  state.answered[i]=true; if(correct)state.score++;
  const rv=el('rv'+i); if(rv){rv.innerHTML=revealHTML; rv.className='reveal show';}
  const h=el('help'+i); if(h)h.style.display='none';
  const nx=el('nx'+i); if(nx)nx.style.display='block';
}

/* ===== 互動處理 ===== */
// 分類
let clfState={};
function clfPick(id,cat,btn){
  const i=cur; if(state.answered[i])return;
  clfState[id]=cat;
  const item=el('ci-'+id); item.querySelectorAll('.clf-btns button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  if(Object.keys(clfState).length===S[i].items.length){
    let ok=0; S[i].items.forEach(it=>{ const right=clfState[it.id]===it.cat;
      el('ci-'+it.id).classList.add(right?'right':'wrong'); if(right)ok++;});
    const all=ok===S[i].items.length;
    resolve(i,all,`<b>${all?'全對 ✓':`對了 ${ok}/${S[i].items.length}`}。</b>先行的最早轉（初領失業金、PMI新訂單），同步的跟當下走（GDP），<b>失業率和違約率是滯後</b>——它們最後才反映，拿來預判會慢半拍。<div class="gloss">白話：${S[i].gloss}</div>`);
  }
}
// 翻面
function flipPick(i,idx){ if(state.answered[i])return;
  const s=S[i], correct=idx===s.correct;
  document.querySelectorAll('#pk'+i+' .btn').forEach((b,k)=>{b.disabled=true;
    if(k===s.correct)b.classList.add('pick-good'); else if(k===idx)b.classList.add('pick-bad');});
  resolve(i,correct,(correct?s.revealGood:s.revealBad)+`<div class="gloss">白話：${s.gloss}</div>`);
}
// 階段選擇
function ppPick(i,idx){ if(state.answered[i])return;
  const s=S[i], correct=idx===s.correct;
  document.querySelectorAll('#pk'+i+' .btn').forEach((b,k)=>{b.disabled=true;
    if(k===s.correct)b.classList.add('pick-good'); else if(k===idx)b.classList.add('pick-bad');});
  resolve(i,correct,(correct?'':'<b>再看一次 —— </b>')+s.reveal+`<div class="gloss">白話：${s.gloss}</div>`);
}
// 儀表
function drawGauge(i,s){
  const svg=el('g'+i); if(!svg)return;
  // 過熱區弧線（threshold→max）
  const a0=Math.PI, a1=0, frac=(s.threshold-s.min)/(s.max-s.min);
  const ang=a0+(a1-a0)*frac; const cx=120,cy=130,r=96;
  const x1=cx+r*Math.cos(ang), y1=cy-r*Math.sin(ang), x2=cx+r*Math.cos(0), y2=cy-r*Math.sin(0);
  el('ghot'+i).setAttribute('d',`M${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 0 1 ${x2.toFixed(1)},${y2.toFixed(1)}`);
  gaugeAnim(i,s.min,s.value,s);
}
function gaugeAnim(i,from,to,s){
  const svg=el('g'+i); if(!svg)return; const t0=Date.now(),dur=800;
  if(svg._iv)clearInterval(svg._iv);
  svg._iv=setInterval(()=>{ let p=Math.min(1,(Date.now()-t0)/dur); const e=1-Math.pow(1-p,3);
    const v=from+(to-from)*e; setNeedle(i,v,s);
    if(p>=1){clearInterval(svg._iv);svg._iv=null;}},16);
}
function setNeedle(i,v,s){
  const cx=120,cy=130,len=84, frac=(v-s.min)/(s.max-s.min), ang=Math.PI+(0-Math.PI)*frac;
  el('gn'+i).setAttribute('x2',(cx+len*Math.cos(ang)).toFixed(1));
  el('gn'+i).setAttribute('y2',(cy-len*Math.sin(ang)).toFixed(1));
  el('gv'+i).textContent=Math.round(v);
}
function gaugePick(i,idx){ if(state.answered[i])return;
  const s=S[i], correct=idx===s.correct;
  document.querySelectorAll('#pk'+i+' .btn').forEach((b,k)=>{b.disabled=true;
    if(k===s.correct)b.classList.add('pick-good'); else if(k===idx)b.classList.add('pick-bad');});
  resolve(i,correct,(correct?'':'<b>再想一下 —— </b>')+s.reveal+`<div class="gloss">白話：${s.gloss}</div>`);
}
// 天秤
function renderScale(svg,t){ if(!svg)return;
  const cx=180,cy=58,arm=120,drop=44, rad=t*22*Math.PI/180;
  const Lx=cx-arm*Math.cos(rad),Ly=cy-arm*Math.sin(rad),Rx=cx+arm*Math.cos(rad),Ry=cy+arm*Math.sin(rad);
  const q=c=>svg.querySelector(c);
  const b=q('.beam');b.setAttribute('x1',Lx);b.setAttribute('y1',Ly);b.setAttribute('x2',Rx);b.setAttribute('y2',Ry);
  const ls=q('.lstr');ls.setAttribute('x1',Lx);ls.setAttribute('y1',Ly);ls.setAttribute('x2',Lx);ls.setAttribute('y2',Ly+drop);
  const rs=q('.rstr');rs.setAttribute('x1',Rx);rs.setAttribute('y1',Ry);rs.setAttribute('x2',Rx);rs.setAttribute('y2',Ry+drop);
  q('.lpan').setAttribute('transform',`translate(${Lx},${Ly+drop})`);
  q('.rpan').setAttribute('transform',`translate(${Rx},${Ry+drop})`);
  const ll=q('.llabel');ll.setAttribute('x',Lx);ll.setAttribute('y',Ly+drop+26);
  const rl=q('.rlabel');rl.setAttribute('x',Rx);rl.setAttribute('y',Ry+drop+26);
  svg._t=t;
}
function animateScale(svg,target,cb){ const start=(typeof svg._t==='number')?svg._t:0,t0=Date.now(),dur=750;
  if(svg._iv)clearInterval(svg._iv);
  svg._iv=setInterval(()=>{ let p=Math.min(1,(Date.now()-t0)/dur); const e=1-Math.pow(1-p,3);
    renderScale(svg,start+(target-start)*e); if(p>=1){clearInterval(svg._iv);svg._iv=null;if(cb)cb();}},16);
}
function scalePick(i,idx){ if(state.answered[i])return;
  const s=S[i], correct=idx===s.correct, svg=el('sc'+i);
  document.querySelectorAll('#pk'+i+' .btn').forEach((b,k)=>{b.disabled=true;
    if(k===s.correct)b.classList.add('pick-good'); else if(k===idx)b.classList.add('pick-bad');});
  animateScale(svg,s.opts[idx].tilt,()=>{ if(!correct) setTimeout(()=>animateScale(svg,s.opts[s.correct].tilt),400);});
  resolve(i,correct,(correct?'':'<b>再看一次 —— </b>')+s.reveal+`<div class="gloss">白話：${s.gloss}</div>`);
}
// 溫度條
function tempPick(i,idx){ if(state.answered[i])return;
  const s=S[i], correct=idx===s.correct;
  document.querySelectorAll('#tb'+i+' .tz').forEach((z,k)=>{ z.style.pointerEvents='none';
    if(k===s.correct)z.classList.add('correct'); else if(k===idx)z.classList.add('wrong');});
  resolve(i,correct,(correct?'':'<b>再想一下 —— </b>')+s.reveal+`<div class="gloss">白話：${s.gloss}</div>`);
}
// 排序
let sortState=[];
function sortTap(i,id){ if(state.answered[i])return; if(sortState.includes(id))return;
  sortState.push(id);
  const item=el('si-'+id); item.classList.add('picked'); item.querySelector('.rank').textContent=sortState.length;
  if(sortState.length===S[i].items.length){
    let ok=0; S[i].items.forEach(it=>{ if(sortState[it.rank]===it.id)ok++;});
    const all=ok===S[i].items.length;
    // 顯示正解順序
    const order=[...S[i].items].sort((a,b)=>a.rank-b.rank).map(it=>it.label.split(' ')[0]).join(' → ');
    resolve(i,all,`<b>${all?'順序正確 ✓':'再看一次順序。'}</b>正解：<b>${order}</b>。先行指標（初領失業金、新訂單、ERP）先翻，同步（GDP/PCE）跟上，滯後（失業率、違約率）最後才動。<div class="gloss">白話：${S[i].gloss}</div>`);
  }
}
// 檢查表
function chkToggle(elm,i){ elm.classList.toggle('on');
  const all=document.querySelectorAll('#ck'+i+' .check').length;
  const on=document.querySelectorAll('#ck'+i+' .check.on').length;
  const btn=el('ckbtn'+i);
  if(on===all){btn.disabled=false; btn.textContent='收進口袋 →';} else {btn.disabled=true; btn.textContent='全部勾選後繼續';}
}
// 翻牌揭示（一次性翻開，全翻完放行）
function flipReveal(elm,i){ elm.classList.add('on');
  const all=document.querySelectorAll('#ck'+i+' .flipcard').length;
  const on=document.querySelectorAll('#ck'+i+' .flipcard.on').length;
  const btn=el('ckbtn'+i);
  if(on===all){btn.disabled=false; btn.textContent='收進口袋 →';}
}

/* ===== 給我答案（就地揭示＋放行，不計分） ===== */
function give(i){ if(state.answered[i])return; state.answered[i]=true;
  const s=S[i];
  if(s.type==='classify'){ S[i].items.forEach(it=>{ const item=el('ci-'+it.id);
      item.querySelectorAll('.clf-btns button').forEach(b=>b.classList.remove('on'));
      const map={lead:0,coin:1,lag:2}; item.querySelectorAll('.clf-btns button')[map[it.cat]].classList.add('on');
      item.classList.add('right'); item.querySelectorAll('.clf-btns button').forEach(b=>b.disabled=true);});
    showGive(i,`<b>答案已填上。</b>先行＝最早轉；同步＝跟當下走；滯後＝最後才反映。<div class="gloss">白話：${s.gloss}</div>`);}
  else if(s.type==='flip'||s.type==='phasepick'||s.type==='gauge'){
    document.querySelectorAll('#pk'+i+' .btn').forEach((b,k)=>{b.disabled=true; if(k===s.correct)b.classList.add('pick-good');});
    if(s.type==='gauge'){}
    showGive(i,`<b>答案：第 ${s.correct+1} 個選項。</b>`+(s.reveal||s.revealGood||'')+`<div class="gloss">白話：${s.gloss}</div>`);}
  else if(s.type==='scale'){ const svg=el('sc'+i);
    document.querySelectorAll('#pk'+i+' .btn').forEach((b,k)=>{b.disabled=true; if(k===s.correct)b.classList.add('pick-good');});
    animateScale(svg,s.opts[s.correct].tilt);
    showGive(i,`<b>答案：${s.opts[s.correct].t}。</b>`+s.reveal+`<div class="gloss">白話：${s.gloss}</div>`);}
  else if(s.type==='templocate'){ document.querySelectorAll('#tb'+i+' .tz').forEach((z,k)=>{z.style.pointerEvents='none'; if(k===s.correct)z.classList.add('correct');});
    showGive(i,`<b>答案：${s.zones[s.correct].t}。</b>`+s.reveal+`<div class="gloss">白話：${s.gloss}</div>`);}
  else if(s.type==='sort'){ const order=[...s.items].sort((a,b)=>a.rank-b.rank);
    document.querySelectorAll('#st'+i+' .sort-item').forEach(x=>x.style.pointerEvents='none');
    order.forEach((it,r)=>{ const item=el('si-'+it.id); item.classList.add('picked'); item.querySelector('.rank').textContent=r+1;});
    showGive(i,`<b>正解順序：${order.map(it=>it.label.split(' ')[0]).join(' → ')}。</b>先行先翻、滯後最後。<div class="gloss">白話：${s.gloss}</div>`);}
}
function showGive(i,html){ const rv=el('rv'+i); rv.innerHTML=html+'<div style="margin-top:8px" class="dim">（走「給我答案」不計分，但一樣帶你過關。）</div>';
  rv.className='reveal show'; const h=el('help'+i); if(h)h.style.display='none'; const nx=el('nx'+i); if(nx)nx.style.display='block';}

  +'color:#1a1200;background:linear-gradient(135deg,#d4af37,#f0d488);box-shadow:0 4px 14px rgba(212,175,55,.35)}'
  +'#yc-mask{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.62);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:18px}'
  +'#yc-mask.on{display:flex}'
  +'#yc-modal{width:100%;max-width:400px;background:#0d1120;border:1px solid rgba(212,175,55,.34);border-radius:18px;padding:24px 22px;'
  +'box-shadow:0 20px 60px rgba(0,0,0,.6);color:#eef2fb;'
  +"font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif}"
  +'#yc-modal h3{font-size:19px;font-weight:800;margin:0 0 6px}'
  +'#yc-modal p{font-size:13.5px;line-height:1.6;color:#aab3c8;margin:0 0 14px}'
  +'#yc-modal input{width:100%;padding:12px 14px;font-size:15px;border-radius:11px;border:1px solid rgba(255,255,255,.16);'
  +'background:#05070f;color:#fff;outline:none;margin-bottom:6px}'
  +'#yc-modal input:focus{border-color:#d4af37}'
  +'#yc-modal .yc-hint{font-size:11.5px;color:#8590a6;margin:0 0 14px}'
  +'#yc-submit{width:100%;padding:13px;border-radius:11px;border:none;cursor:pointer;font-weight:800;font-size:15px;'
  +'color:#1a1200;background:linear-gradient(135deg,#d4af37,#f0d488)}'
  +'#yc-submit:disabled{opacity:.55;cursor:default}'
  +'#yc-msg{font-size:13px;margin-top:11px;min-height:18px;line-height:1.5}'
  +'#yc-msg.ok{color:#7fd6a6}#yc-msg.err{color:#f08a8a}'
  +'#yc-close,#yc-close2{background:none;border:none;color:#8590a6;font-size:13px;text-decoration:underline;cursor:pointer;display:block;margin:12px auto 0}'
  +'#yc-done .yc-badge{font-size:54px;line-height:1;margin:2px 0 8px;text-align:center}';
  document.head.appendChild(css);

  var bar=document.createElement('div');
  bar.id='yc-bar';
  bar.innerHTML='<div class="yc-txt">🎓 玩到最後了嗎？完成這個導覽，<b>領取《'+name+'報告》檢核徽章</b></div><button id="yc-go">領取檢核</button>';
  document.body.appendChild(bar);
  // 只在最後結果頁才浮出「領取檢核」——沒玩到結果頁不顯示，避免中途誤領（2026-08-06）
  var ycCertified=false;
  function ycOnResult(){return !!document.querySelector('.result-name,.result-type');}
  function ycSync(){bar.style.display=(!ycCertified&&ycOnResult())?'flex':'none';}
  ycSync();
  new MutationObserver(ycSync).observe(document.body,{childList:true,subtree:true});

  var mask=document.createElement('div');
  mask.id='yc-mask';
  mask.innerHTML='<div id="yc-modal">'
    +'<div id="yc-form">'
      +'<h3>領取《'+name+'報告》檢核</h3>'
      +'<p>輸入你的<b style="color:#e8c86a">會員密碼</b>（訂閱時自設的那組），系統會記下你已看懂這份報告怎麼判讀。</p>'
      +'<input id="yc-email" type="email" placeholder="訂閱用的 email" autocomplete="off">'
      +'<input id="yc-pw" type="password" placeholder="你的會員密碼" autocomplete="off">'
      +'<div class="yc-hint">這組密碼只是會員存取碼，請勿使用你其他重要帳號的密碼。</div>'
      +'<button id="yc-submit">送出，領取徽章</button>'
      +'<div id="yc-msg"></div>'
      +'<button id="yc-close">稍後再說</button>'
    +'</div>'
    +'<div id="yc-done" style="display:none">'
      +'<div class="yc-badge">🏅</div>'
      +'<h3 style="text-align:center">已通過《'+name+'報告》檢核</h3>'
      +'<p id="yc-done-txt" style="text-align:center"></p>'
      +'<button id="yc-close2">完成</button>'
    +'</div>'
  +'</div>';
  document.body.appendChild(mask);

  var $=function(id){return document.getElementById(id);};
  function openModal(){mask.classList.add('on');setTimeout(function(){$('yc-pw').focus();},50);}
  function closeModal(){mask.classList.remove('on');}
  $('yc-go').onclick=openModal;
  $('yc-close').onclick=closeModal;
  $('yc-close2').onclick=closeModal;
  mask.addEventListener('click',function(e){if(e.target===mask)closeModal();});

  function submit(){
    var email=$('yc-email').value.trim(), pw=$('yc-pw').value.trim(), msg=$('yc-msg');
    if(!email||!pw){msg.className='err';msg.textContent='請輸入 email 與會員密碼';return;}
    var btn=$('yc-submit');btn.disabled=true;msg.className='';msg.textContent='驗證中…';
    fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:'certify',email:email,password:pw,reportType:t})})
      .then(function(r){return r.json();})
      .then(function(res){
        btn.disabled=false;
        if(res&&res.done){
          $('yc-form').style.display='none';
          $('yc-done').style.display='block';
          $('yc-done-txt').innerHTML=(res.alreadyCertified?'你先前已通過（'+res.certifiedAt+'）。':'通過日：'+res.certifiedAt+'。')
            +'<br>之後就能安心收到每期《'+name+'報告》了。';
          ycCertified=true;bar.style.display='none';
        }else{
          msg.className='err';msg.textContent=(res&&res.error)?res.error:'驗證失敗，請稍後再試';
        }
      })
      .catch(function(){btn.disabled=false;msg.className='err';msg.textContent='連線失敗，請檢查網路後再試';});
  }
  $('yc-submit').onclick=submit;
  $('yc-pw').addEventListener('keydown',function(e){if(e.key==='Enter')submit();});
})();
</script>
