  const row=rest.slice(0,take),rs=row.reduce((s,t)=>s+t[1],0),horiz=W>=H;
  if(horiz){const cw=W*rs/tot;let yy=Y;row.forEach(t=>{const ch=H*t[1]/rs;out.push([t,X,yy,cw,ch]);yy+=ch;});X+=cw;W-=cw;}

  rest=rest.slice(take);}
 return out;}

// ===== 引擎 =====
let state={};
function resetState(){state={idx:-1,score:0,sv:null,miss:false,hs:null,pl:[],plSel:null,so:null,soSel:null,mt:{},mtSel:null,mtChecked:false,flPick:null,flStage:0};window.state=state;}
resetState();
function prog(){PB.style.width=(Math.max(0,state.idx)/ROUNDS.length*100)+'%';}
function dots(i){return `<div class="step-dots">${ROUNDS.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div>`;}
function fade(fn){G.style.transition='opacity .32s';G.style.opacity='0';setTimeout(()=>{fn();G.style.opacity='1';},330);}
function scene(sky,bgtype,inner){return `<div class="scene ${sky}">${bg(bgtype,sky)}<div class="overlay">${inner}</div></div>`;}
function head(r,fig){const layers=r.layers?`<div class="layer-list">${r.layers.map(ly=>`<div class="ly"><b>${ly[0]}</b><span>${ly[1]}</span></div>`).join('')}</div>`:'';
 const fw='max-width:480px;margin:0.5rem auto 0.3rem;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:0.35rem 0.3rem';
 const f=(fig!==undefined&&fig!==null)?`<div style="${fw}">${fig}</div>`:(r.svg?`<div style="${fw}">${r.svg}</div>`:'');
 return `<div class="chapter-label t-label">${r.label}</div><div class="chapter-title t-main" style="font-size:22px;margin-bottom:0.9rem">${r.title}</div><div class="round-text t-sub">${r.text}</div>${layers}${f}`;}
function glossHTML(i){const a=ANS[i];
 return `<div style="font-size:11px;letter-spacing:2px;color:rgba(255,255,255,0.5);margin:0.85rem 0 0.5rem">名詞白話</div><div class="gloss-grid">`
  +a.terms.map(t=>`<div class="gl"><b>${t[0]}</b><span>${t[1]}</span></div>`).join('')+`</div>`;}
function boxHTML(inner){return `<div style="max-width:500px;margin:0.5rem auto 0;background:rgba(0,0,0,0.32);border:1px solid rgba(255,255,255,0.28);border-radius:10px;padding:1rem 1.15rem;backdrop-filter:blur(6px)">${inner}</div>`;}
function ansLine(i){return `<div style="font-size:14px;line-height:1.75;color:#fff;text-align:left"><b style="color:#a5d6a7">答案：</b>${ANS[i].answer}</div>`;}
function revealBox(i,extra){const r=ROUNDS[i];
 return boxHTML(ansLine(i)+(r.reveal?`<div style="font-size:13.5px;line-height:1.75;color:rgba(255,255,255,0.9);margin-top:0.6rem;text-align:left">${r.reveal}</div>`:'')+(extra||'')+glossHTML(i));}
function contBtn(i){return `<button class="continue-btn" onclick="record(${i})">懂了，繼續 ›</button>`;}

function showRound(i){state.idx=i;prog();const r=ROUNDS[i];
 state.sv=null;state.miss=false;state.hs=null;state.plSel=null;state.soSel=null;state.mtSel=null;state.mtChecked=false;state.flPick=null;state.flStage=0;
 if(r.type==='slider')renderSlider(i);
 else if(r.type==='hotspot')renderHotspot(i);
 else if(r.type==='match'){state.mt={};renderMatch(i);}
 else if(r.type==='place'){state.pl=r.cards.map(()=>null);renderPlace(i);}
 else if(r.type==='sort'){state.so=r.shuffle.slice();renderSort(i);}
 else if(r.type==='flip')renderFlip(i);
 else renderAB(i);}

// ── ab ──
function renderAB(i){const r=ROUNDS[i];
 G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r)}<div class="round-q t-main">${r.q}</div>
  <div class="choices">${r.choices.map((c,k)=>`<button class="choice-btn" onclick="abPick(${i},${k})">${c}</button>`).join('')}</div>
  <button class="continue-btn" style="opacity:0.72" onclick="giveAnswer(${i})">給我答案</button>`);}
function abPick(i,k){const r=ROUNDS[i];if(k===r.correct)state.score++;
 const col=k===r.correct?'#a5d6a7':'#ffcc80';
 G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r)}<div class="feedback" style="color:${col};min-height:auto;font-size:14px">${r.fb[k]}</div>${boxHTML(glossHTML(i))}${contBtn(i)}`);}

// ── slider（拉參數 → 即時重畫 → 問結果；本版暫無關卡使用，引擎保留）──
function renderSlider(i){const r=ROUNDS[i];if(state.sv===null)state.sv=r.init;
 function draw(hint){G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r,r.sfig(state.sv))}
  <div class="gauge-wrap"><input type="range" class="gsl" min="${r.min}" max="${r.max}" step="${r.step}" value="${state.sv}" oninput="state.sv=parseInt(this.value);slUpd(${i})">
   <div class="gsl-now">${r.slabel(state.sv)}</div></div>
  <div class="round-q t-main" style="font-size:15px;margin:0.9rem 0 0.6rem">${r.q}</div>
  ${hint?`<div class="feedback" style="color:#ffcc80;min-height:auto;font-size:13.5px;margin-bottom:0.3rem">${hint}</div>`:''}
  <div style="display:flex;gap:0.6rem;justify-content:center;flex-wrap:wrap"><button class="continue-btn" onclick="slDone(${i})">就這樣 ›</button><button class="continue-btn" style="opacity:0.72" onclick="giveAnswer(${i})">給我答案</button></div>`);}
 window.drawSl=function(){draw(null);};draw(null);}
function slUpd(i){const r=ROUNDS[i],n=document.querySelector('.gsl-now');if(n)n.innerHTML=r.slabel(state.sv);const sv=document.querySelector('.overlay svg');if(sv&&sv.parentNode)sv.parentNode.innerHTML=r.sfig(state.sv);}
function slDone(i){const r=ROUNDS[i];
 if(!r.correct(state.sv)){state.miss=true;
  G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r,r.sfig(state.sv))}
   <div class="gauge-wrap"><input type="range" class="gsl" min="${r.min}" max="${r.max}" step="${r.step}" value="${state.sv}" oninput="state.sv=parseInt(this.value);slUpd(${i})">
    <div class="gsl-now">${r.slabel(state.sv)}</div></div>
   <div class="feedback" style="color:#ffcc80;min-height:auto;font-size:13.5px">${r.sfb(state.sv)}</div>
   <div style="display:flex;gap:0.6rem;justify-content:center;flex-wrap:wrap"><button class="continue-btn" onclick="slDone(${i})">再試一次 ›</button><button class="continue-btn" style="opacity:0.72" onclick="giveAnswer(${i})">給我答案</button></div>`);
  window.drawSl=function(){slRedraw(i);};return;}
 if(!state.miss)state.score++;
 G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r,r.sfig(state.sv))}<div class="feedback" style="color:#a5d6a7;min-height:auto;font-size:14px">${r.sfb(state.sv)}</div>${boxHTML(glossHTML(i))}${contBtn(i)}`);}
function slRedraw(i){const r=ROUNDS[i];
 G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r,r.sfig(state.sv))}
  <div class="gauge-wrap"><input type="range" class="gsl" min="${r.min}" max="${r.max}" step="${r.step}" value="${state.sv}" oninput="state.sv=parseInt(this.value);slUpd(${i})">
   <div class="gsl-now">${r.slabel(state.sv)}</div></div>
  <div class="round-q t-main" style="font-size:15px;margin:0.9rem 0 0.6rem">${r.q}</div>
  <div style="display:flex;gap:0.6rem;justify-content:center;flex-wrap:wrap"><button class="continue-btn" onclick="slDone(${i})">就這樣 ›</button><button class="continue-btn" style="opacity:0.72" onclick="giveAnswer(${i})">給我答案</button></div>`);}

// ── hotspot（點圖作答）──
function renderHotspot(i){const r=ROUNDS[i];
 G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r,r.hfig(state.hs))}<div class="round-q t-main" style="font-size:15px">${r.hsq}</div>
  <button class="continue-btn" style="opacity:0.72" onclick="giveAnswer(${i})">給我答案</button>`);}
function hsPick(i,key){const r=ROUNDS[i];if(state.hs!==null||state.idx!==i)return;state.hs=key;
 const ok=key===r.correct;if(ok)state.score++;
 G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r,r.hfig(ok?key:'__ans'))}
  <div class="feedback" style="color:${ok?'#a5d6a7':'#ffcc80'};min-height:auto;font-size:14px">${ok?'點對了。':'點的不是那一個——正解已經在上圖標出來了。'}</div>
  ${revealBox(i)}${contBtn(i)}`);}

// ── place（兩段式點選歸位；multi＝一格可放多張）──
function slotCap(s){const t=[s[2],s[3]].filter(Boolean).join('　·　');return t?`<i>${t}</i>`:'';}
function renderPlace(i){const r=ROUNDS[i];
 function draw(){
  const slots=r.slots.map((s,si)=>{
   const inside=r.cards.map((c,ci)=>state.pl[ci]===s[0]?`<span class="pl-chip" onclick="event.stopPropagation();plUnset(${i},${ci})">${c[0]} ✕</span>`:'').join('');
   return `<div class="pl-slot${state.plSel!==null?' hot':''}" onclick="plDrop(${i},${si})"><b>${s[1]}</b>${slotCap(s)}${inside}</div>`;}).join('');
  const cards=r.cards.map((c,ci)=>state.pl[ci]!==null?'':
   `<div class="pk-card${state.plSel===ci?' sel':''}" onclick="plSel(${i},${ci})"><b>${c[0]}</b><span class="pk-sub">${c[1]}</span></div>`).join('');
  const left=state.pl.filter(x=>x===null).length;
  G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r)}
   <div class="round-q t-main" style="font-size:14.5px">${r.placeq||'先點下面的卡，再點它該去的格子。'}<span style="font-size:12.5px;color:rgba(255,255,255,0.6)">（還剩 ${left} 張）</span></div>
   <div class="pl-slots">${slots}</div>
   <div class="pk-grid">${cards}</div>
   <div style="display:flex;gap:0.6rem;justify-content:center;flex-wrap:wrap">${left===0?`<button class="continue-btn" onclick="plCheck(${i})">檢查</button>`:''}<button class="continue-btn" style="opacity:0.72" onclick="giveAnswer(${i})">給我答案</button></div>`);}
 window.drawPl=draw;draw();}
function plSel(i,ci){state.plSel=state.plSel===ci?null:ci;window.drawPl();}
function plDrop(i,si){if(state.plSel===null)return;state.pl[state.plSel]=ROUNDS[i].slots[si][0];state.plSel=null;window.drawPl();}
function plUnset(i,ci){state.pl[ci]=null;state.plSel=null;window.drawPl();}
function plCheck(i){const r=ROUNDS[i];let ok=0;
 const slots=r.slots.map(s=>{
  const cis=r.cards.map((c,ci)=>state.pl[ci]===s[0]?ci:-1).filter(x=>x>=0);
  let right;
  if(r.multi){const want=r.cards.filter(c=>c[2]===s[0]).length;right=cis.length===want&&cis.every(ci=>r.cards[ci][2]===s[0]);}
  else right=cis.length===1&&r.cards[cis[0]][2]===s[0];
  if(right)ok++;
  const inside=cis.map(ci=>`<span class="pl-chip">${r.cards[ci][0]}</span>`).join('');
  return `<div class="pl-slot ${right?'right':'wrong'}"><b>${s[1]}</b>${slotCap(s)}${inside}</div>`;}).join('');
 if(ok===r.slots.length)state.score++;
 G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r)}
  <div class="feedback" style="color:${ok===r.slots.length?'#a5d6a7':'#ffcc80'};min-height:auto;font-size:14px">放對 ${ok}／${r.slots.length} 格。</div>
  <div class="pl-slots">${slots}</div>${revealBox(i)}${contBtn(i)}`);}

// ── sort（點兩張卡互換，禁 ▲▼）──
function renderSort(i){const r=ROUNDS[i];
 function draw(){
  const list=state.so.map((it,pos)=>`<div class="pk-card${state.soSel===pos?' sel':''}" onclick="soTap(${i},${pos})"><span class="st-n">${pos+1}</span><b>${r.items[it][0]}</b><span class="pk-sub" style="margin-left:18px">${r.items[it][1]}</span></div>`).join('');
  G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r)}
   <div class="round-q t-main" style="font-size:14.5px">${r.sortq||'由上而下排成「<b>強 → 弱</b>」。'}<span style="font-size:12.5px;color:rgba(255,255,255,0.6)">點一張、再點另一張，兩張就互換位置。</span></div>
   <div class="st-list">${list}</div>
   <div style="display:flex;gap:0.6rem;justify-content:center;flex-wrap:wrap"><button class="continue-btn" onclick="soCheck(${i})">檢查</button><button class="continue-btn" style="opacity:0.72" onclick="giveAnswer(${i})">給我答案</button></div>`);}
 window.drawSo=draw;draw();}
function soTap(i,pos){if(state.soSel===null){state.soSel=pos;}else if(state.soSel===pos){state.soSel=null;}
 else{const a=state.soSel,b=pos,t=state.so[a];state.so[a]=state.so[b];state.so[b]=t;state.soSel=null;}
 window.drawSo();}
function soCheck(i){const r=ROUNDS[i];let ok=0;
 const list=state.so.map((it,pos)=>{const right=it===pos;if(right)ok++;
  return `<div class="pk-card ${right?'right':'wrong'}"><span class="st-n">${pos+1}</span><b>${r.items[it][0]}</b><span class="pk-sub" style="margin-left:18px">${r.items[it][1]}</span></div>`;}).join('');
 if(ok===r.items.length)state.score++;
 G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r)}
  <div class="feedback" style="color:${ok===r.items.length?'#a5d6a7':'#ffcc80'};min-height:auto;font-size:14px">排對 ${ok}／${r.items.length} 段。</div>
  <div class="st-list">${list}</div>${revealBox(i)}${contBtn(i)}`);}

// ── match（連連看，SVG 連線）──
function renderMatch(i){const r=ROUNDS[i];
 function draw(){
  const L=r.left.map((t,k)=>`<div class="pk-card mt-item${state.mtSel===k?' sel':''}" id="mL${k}" onclick="mtL(${i},${k})">${t}</div>`).join('');
  const R=r.right.map((t,k)=>`<div class="pk-card mt-item" id="mR${k}" onclick="mtR(${i},${k})">${t}</div>`).join('');
  const n=Object.keys(state.mt).length;
  G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r)}
   <div class="round-q t-main" style="font-size:14.5px">左邊點一個、右邊點一個，就連起來。<span style="font-size:12.5px;color:rgba(255,255,255,0.6)">（已連 ${n}／${r.left.length}）</span></div>
   <div class="mt-wrap" id="mtw"><svg class="mt-svg" id="mts"></svg><div class="mt-col">${L}</div><div class="mt-col">${R}</div></div>
   <div style="display:flex;gap:0.6rem;justify-content:center;flex-wrap:wrap">${n===r.left.length?`<button class="continue-btn" onclick="mtCheck(${i})">檢查</button>`:''}<button class="continue-btn" style="opacity:0.72" onclick="giveAnswer(${i})">給我答案</button></div>`);
  mtLines(i);}
 window.drawMt=draw;draw();}
function mtLines(i){const wrap=document.getElementById('mtw'),svg=document.getElementById('mts');if(!wrap||!svg)return;
 const r=ROUNDS[i];let h='';
 Object.keys(state.mt).forEach(function(ls){const li=parseInt(ls),ri=state.mt[ls];
  const a=document.getElementById('mL'+li),b=document.getElementById('mR'+ri);if(!a||!b)return;
  const x1=a.offsetLeft+a.offsetWidth,y1=a.offsetTop+a.offsetHeight/2,x2=b.offsetLeft,y2=b.offsetTop+b.offsetHeight/2;
  const col=state.mtChecked?(r.pairs[li]===ri?'#7fd6a6':'#e88a8c'):'#e0a526';
  h+=`<path d="M${x1},${y1} C${x1+24},${y1} ${x2-24},${y2} ${x2},${y2}" fill="none" stroke="${col}" stroke-width="2.2"/><circle cx="${x1}" cy="${y1}" r="3" fill="${col}"/><circle cx="${x2}" cy="${y2}" r="3" fill="${col}"/>`;});
 svg.innerHTML=h;}
function mtL(i,k){state.mtSel=state.mtSel===k?null:k;if(state.mt[k]!==undefined){delete state.mt[k];}window.drawMt();}
function mtR(i,k){if(state.mtSel===null)return;
 Object.keys(state.mt).forEach(function(ls){if(state.mt[ls]===k)delete state.mt[ls];});
 state.mt[state.mtSel]=k;state.mtSel=null;window.drawMt();}
function mtCheck(i){const r=ROUNDS[i];state.mtChecked=true;let ok=0;
 const L=r.left.map((t,k)=>{const right=state.mt[k]===r.pairs[k];if(right)ok++;
  return `<div class="pk-card ${right?'right':'wrong'} mt-item" id="mL${k}">${t}</div>`;}).join('');
 const R=r.right.map((t,k)=>`<div class="pk-card mt-item" id="mR${k}">${t}</div>`).join('');
 if(ok===r.left.length)state.score++;
 G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r)}
  <div class="feedback" style="color:${ok===r.left.length?'#a5d6a7':'#ffcc80'};min-height:auto;font-size:14px">連對 ${ok}／${r.left.length} 條。</div>
  <div class="mt-wrap" id="mtw"><svg class="mt-svg" id="mts"></svg><div class="mt-col">${L}</div><div class="mt-col">${R}</div></div>
  ${revealBox(i)}${contBtn(i)}`);
 mtLines(i);}

// ── flip（蓋牌翻開）──
function renderFlip(i){const r=ROUNDS[i];
 G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r)}
  <div class="fl-card">${r.fl_front}</div>
  <div class="choices">${r.fl_opts.map((o,k)=>`<button class="choice-btn" onclick="flPick(${i},${k})">${o}</button>`).join('')}</div>
  <button class="continue-btn" style="opacity:0.72" onclick="flPick(${i},-1)">直接翻開</button>`);}
function flPick(i,k){const r=ROUNDS[i];state.flPick=k;const ok=k===r.fl_correct;if(ok)state.score++;
 G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r)}
  <div class="fl-card" style="border-color:#7fd6a6">${r.fl_back}</div>
  <div class="feedback" style="color:${ok?'#a5d6a7':'#ffcc80'};min-height:auto;font-size:14px">${k<0?'直接翻開了——這一題不計分。':(ok?'押對了。':'押的是另一面——翻開的牌在上面。')}</div>
  ${revealBox(i)}${contBtn(i)}`);}

// ── 給我答案：一律就地揭示、不跳頁、不計分但放行 ──
function giveAnswer(i){const r=ROUNDS[i];
 if(r.type==='ab'){
  const ch=r.choices.map((c,k)=>`<div class="choice-btn" style="cursor:default;${k===r.correct?'border-color:#a5d6a7;background:rgba(80,200,110,0.14)':'opacity:0.45'}">${k===r.correct?'✓ ':''}${c}</div>`).join('');
  G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r)}<div class="choices">${ch}</div><div class="feedback" style="color:#a5d6a7;min-height:auto;font-size:14px">${r.fb[r.correct]}</div>${boxHTML(ansLine(i)+glossHTML(i))}${contBtn(i)}`);
 }else if(r.type==='slider'){
  let v=r.min;for(let k=r.min;k<=r.max;k+=r.step){if(r.correct(k)){v=k;break;}}state.sv=v;
  G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r,r.sfig(v))}<div class="gsl-now">${r.slabel(v)}</div><div class="feedback" style="color:#a5d6a7;min-height:auto;font-size:14px">${r.sfb(v)}</div>${boxHTML(ansLine(i)+glossHTML(i))}${contBtn(i)}`);
 }else if(r.type==='hotspot'){
  state.hs='__ans';
  G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r,r.hfig('__ans'))}${revealBox(i)}${contBtn(i)}`);
 }else if(r.type==='place'){
  const slots=r.slots.map(s=>{const inside=r.cards.filter(c=>c[2]===s[0]).map(c=>`<span class="pl-chip">${c[0]}</span>`).join('');
   return `<div class="pl-slot right"><b>${s[1]}</b>${slotCap(s)}${inside}</div>`;}).join('');
  G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r)}<div class="pl-slots">${slots}</div>${revealBox(i)}${contBtn(i)}`);
 }else if(r.type==='sort'){
  const list=r.items.map((it,k)=>`<div class="pk-card right"><span class="st-n">${k+1}</span><b>${it[0]}</b><span class="pk-sub" style="margin-left:18px">${it[1]}</span></div>`).join('');
  G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r)}<div class="st-list">${list}</div>${revealBox(i)}${contBtn(i)}`);
 }else if(r.type==='match'){
  state.mt={};r.pairs.forEach((ri,li)=>{state.mt[li]=ri;});state.mtChecked=true;
  const L=r.left.map((t,k)=>`<div class="pk-card right mt-item" id="mL${k}">${t}</div>`).join('');
  const R=r.right.map((t,k)=>`<div class="pk-card mt-item" id="mR${k}">${t}</div>`).join('');
  G.innerHTML=scene(r.sky,r.bg,`${dots(i)}${head(r)}<div class="mt-wrap" id="mtw"><svg class="mt-svg" id="mts"></svg><div class="mt-col">${L}</div><div class="mt-col">${R}</div></div>${revealBox(i)}${contBtn(i)}`);
  mtLines(i);
 }else if(r.type==='flip'){flPick(i,-1);
 }}

        }else{
          msg.className='err';msg.textContent=(res&&res.error)?res.error:'驗證失敗，請稍後再試';
        }
      })
      .catch(function(){btn.disabled=false;msg.className='err';msg.textContent='連線失敗，請檢查網路後再試';});
  }
  $('yc-submit').onclick=submit;
  $('yc-pw').addEventListener('keydown',function(e){if(e.key==='Enter')submit();});
  $('yc-email').addEventListener('keydown',function(e){if(e.key==='Enter')submit();});
})();
</script>
