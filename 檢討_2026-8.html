/* ===== 引擎 ===== */
let cur=0; const state={score:0,max:0,ans:{},cls:[],chk:[]};
const el=document.getElementById('scene');
state.max=S.filter(x=>['flip','gauge','classify','scale'].includes(x.t)).length;
function scored(i){return ['flip','gauge','classify','scale'].includes(S[i].t);}
function qdots(i){let n=0,done=0;for(let k=0;k<S.length;k++){if(scored(k)){n++;if(k<=i&&state.ans[k]!=null)done++;}}return {n,done};}
function dots(i){return '';}
function go(i){if(montageIv){clearInterval(montageIv);montageIv=null;}el.style.opacity=0;setTimeout(()=>{cur=i;render();el.style.opacity=1;window.scrollTo(0,0);},260);}
function next(){if(cur<S.length-1)go(cur+1);}
el.style.transition='opacity .26s';

function wrapScene(sky,inner){el.className='sky '+sky;el.innerHTML='<div class="ink">'+bg(sky)+'</div><div class="wrap fade">'+inner+'</div>';}
function tagH(s){return s.tag?'<span class="tag">'+s.tag+'</span>':'';}
function cont(label){return '<div class="nx"><button class="cta" onclick="next()">'+(label||'繼續 →')+'</button></div>';}
function giveBtn(i){return '<div class="help"><button onclick="give('+i+')">看不懂？給我答案</button></div>';}
/* 給我答案：就地揭示正解＋白話，不計分放行（SKILL-game 原則3 硬規則） */
function give(i){const s=S[i];if(state.ans[i]!=null)return;state.ans[i]='gave';
 const chart=s.chart?'<div class="chartbox"><img src="'+IMG+s.chart+'.png" alt=""></div>':'';
 if(s.t==='flip'){wrapScene(s.sky,tagH(s)+'<h2>'+s.h+'</h2>'+chart+s.opts.map(o=>'<button class="btn '+(o.good?'good':'bad')+'">'+(o.good?'✓ ':'')+o.t+'</button>').join('')+'<div class="rv"><b>答案：</b>'+s.rv+'<div class="gloss">白話：'+s.gloss+'</div></div>'+cont());}
 else if(s.t==='gauge'||s.t==='scale'){wrapScene(s.sky,tagH(s)+'<h2>'+s.h+'</h2><div class="gwrap"><div class="gval">'+s.ans+'</div><div class="gsl-ends"><span>'+s.left+'</span><span>'+s.right+'</span></div></div><div class="fb">'+s.fb(s.ans)+'</div><div class="rv"><b>答案：</b>指針放到 <b>'+s.ans+'</b> 附近。<div class="gloss">白話：'+s.gloss+'</div></div>'+cont());}
 else if(s.t==='classify'){const rows=s.items.map(it=>'<div class="cls-row right"><div class="cls-name">'+it[0]+'</div><div class="cls-btns"><button class="cls-btn '+(it[1]==='A'?'on':'')+'">'+s.catA+'</button><button class="cls-btn '+(it[1]==='B'?'on':'')+'">'+s.catB+'</button></div></div>').join('');wrapScene(s.sky,tagH(s)+'<h2>'+s.h+'</h2>'+rows+'<div class="rv"><b>答案：</b>'+s.rv+'<div class="gloss">白話：'+s.gloss+'</div></div>'+cont());}}

function render(){const s=S[cur];const R=REND[s.t];R(s,cur);}
const REND={
 title:(s)=>wrapScene(s.sky,'<div class="eyebrow">Yoda Research · 判斷力學校 · 檢討</div><h1>檢討：2026-8，<br>訊號其實都說了</h1><p class="lead">狂漲 → 見頂 → 血洗 → 落底 → 翻上。<br>回到每個轉折點，這一次，你讀懂了嗎？</p><button class="cta gold" onclick="next()">回到 2026/06 →</button><div class="mcap" style="margin-top:14px">約 6 分鐘 · 全程檢討已知過去，不預測、不喊買賣</div>'),
 project:(s)=>wrapScene(s.sky,'<span class="tag">先說在前面</span><h2>這不是「看我多準」</h2><p class="body">2026——4 月你追在狂漲、6 月頂你沒跑、7 月底你割在最低、8 月它又翻上去。</p><p class="body">我發文說了不少；但老實說，<b class="hl">我當下也沒抓到全部訊號</b>。所以這是我們一起把這波拆開檢討——<b class="hl">下一次，一起更警覺。</b></p><button class="btn" onclick="next()">我就是追頂砍底那個<small>每次都慢半拍</small></button><button class="btn" onclick="next()">我想學會讀轉折訊號<small>不想再事後才懂</small></button>'),
 teach:(s)=>wrapScene(s.sky,tagH(s)+'<h2>'+s.h+'</h2>'+s.html+cont()),
 mono:(s)=>{let im=s.img?'<div class="montage" style="max-width:360px;margin-bottom:14px"><img src="'+IMG+s.img+'.png" alt=""></div>':'';wrapScene(s.sky,im+'<div class="mono">'+s.lines.map(l=>'<p class="body" style="text-align:center;color:#dfe6f4">'+l+'</p>').join('')+'</div>'+cont());},
 flip:(s,i)=>{if(state.ans[i]!=null)return flipDone(s,i);wrapScene(s.sky,tagH(s)+'<h2>'+s.h+'</h2>'+(s.chart?'<div class="chartbox"><img src="'+IMG+s.chart+'.png" alt=""></div>':'')+'<p class="body">'+s.body+'</p><p class="body" style="color:#fff;font-weight:600">'+s.q+'</p>'+s.opts.map((o,k)=>'<button class="btn" onclick="pick('+i+','+k+')">'+o.t+'</button>').join('')+giveBtn(i));},
 gauge:(s,i)=>{if(state.ans[i]!=null)return gaugeDone(s,i);state.gv=50;drawG(s,i);},
 scale:(s,i)=>{if(state.ans[i]!=null)return gaugeDone(s,i);state.gv=50;drawG(s,i);},
 classify:(s,i)=>{if(state.ans[i]!=null)return clsDone(s,i);if(state.cls.length!==s.items.length)state.cls=s.items.map(()=>null);drawCls(s,i);},
 checklist:(s,i)=>{state.chk=s.items.map(()=>false);drawChk(s,i);},
 montage:(s,i)=>{const grid=s.imgs.map(n=>'<div class="mcell"><div class="mcell-date">'+fmtDate(n)+'</div><img src="'+IMG+n+'.png" alt=""></div>').join('');wrapScene(s.sky,tagH(s)+(s.cap?'<div class="mcap">'+s.cap+'</div>':'')+'<div class="mgrid">'+grid+'</div><div class="mnarr">'+s.narr+'</div>'+cont());},
 chart:(s)=>wrapScene(s.sky,tagH(s)+'<h2>'+s.h+'</h2>'+s.charts.map(c=>'<div class="chartbox"><img src="'+IMG+c+'.png" alt=""></div>').join('')+'<div class="mnarr">'+s.narr+'</div>'+cont()),
 result:(s)=>result(s)
};

/* flip */
function pick(i,k){if(state.ans[i]!=null)return;const s=S[i];state.ans[i]=k;if(s.opts[k].good)state.score++;flipDone(s,i);}
function flipDone(s,i){const k=state.ans[i];wrapScene(s.sky,tagH(s)+'<h2>'+s.h+'</h2>'+s.opts.map((o,j)=>'<button class="btn '+(o.good?'good':(j===k?'bad':'bad'))+'">'+(o.good?'✓ ':'')+o.t+'</button>').join('')+'<div class="rv">'+s.rv+'<div class="gloss">白話：'+s.gloss+'</div></div>'+cont());}
/* gauge/scale */
function drawG(s,i){wrapScene(s.sky,tagH(s)+'<h2>'+s.h+'</h2><p class="body">'+s.body+'</p><p class="body" style="color:#fff;font-weight:600">'+s.q+'</p><div class="gwrap"><div class="gval" id="gv">'+state.gv+'</div><input class="gsl" type="range" min="0" max="100" value="'+state.gv+'" oninput="state.gv=+this.value;document.getElementById(\'gv\').textContent=this.value"><div class="gsl-ends"><span>'+s.left+'</span><span>'+s.right+'</span></div></div><div class="nx"><button class="cta gold" onclick="gaugePick('+i+')">就這樣 →</button></div>'+giveBtn(i));}
function gaugePick(i){if(state.ans[i]!=null)return;const s=S[i];state.ans[i]=state.gv;if(s.correct(state.gv))state.score++;gaugeDone(s,i);}
function gaugeDone(s,i){const v=state.ans[i];wrapScene(s.sky,tagH(s)+'<h2>'+s.h+'</h2><div class="gwrap"><div class="gval">'+v+'</div><div class="gsl-ends"><span>'+s.left+'</span><span>'+s.right+'</span></div></div><div class="fb">'+s.fb(v)+'</div><div class="rv"><div class="gloss">白話：'+s.gloss+'</div></div>'+cont());}
/* classify */
function drawCls(s,i){const rows=s.items.map((it,k)=>'<div class="cls-row" id="cr'+k+'"><div class="cls-name">'+it[0]+'</div><div class="cls-btns"><button class="cls-btn '+(state.cls[k]==='A'?'on':'')+'" onclick="setCls('+k+',\'A\')">'+s.catA+'</button><button class="cls-btn '+(state.cls[k]==='B'?'on':'')+'" onclick="setCls('+k+',\'B\')">'+s.catB+'</button></div></div>').join('');const done=state.cls.every(x=>x!=null);wrapScene(s.sky,tagH(s)+'<h2>'+s.h+'</h2><p class="body dim">'+s.sub+'</p>'+rows+'<div class="nx">'+(done?'<button class="cta gold" onclick="clsCheck('+i+')">檢查 →</button>':'<span class="mcap">全部分類後出現「檢查」</span>')+'</div>'+giveBtn(i));}
function setCls(k,v){state.cls[k]=v;drawCls(S[cur],cur);}
function clsDone(s,i){const rows=s.items.map(it=>'<div class="cls-row right"><div class="cls-name">'+it[0]+'</div><div class="cls-btns"><button class="cls-btn '+(it[1]==='A'?'on':'')+'">'+s.catA+'</button><button class="cls-btn '+(it[1]==='B'?'on':'')+'">'+s.catB+'</button></div></div>').join('');wrapScene(s.sky,tagH(s)+'<h2>'+s.h+'</h2>'+rows+'<div class="rv"><b>答案：</b>'+s.rv+'<div class="gloss">白話：'+s.gloss+'</div></div>'+cont());}
function clsCheck(i){const s=S[i];let ok=0;s.items.forEach((it,k)=>{if(state.cls[k]===it[1])ok++;});state.ans[i]=ok;if(ok>=s.items.length-1)state.score++;s.items.forEach((it,k)=>{const r=document.getElementById('cr'+k);if(r)r.classList.add(state.cls[k]===it[1]?'right':'wrong');});const box=document.querySelector('.nx');box.outerHTML='<div class="rv"><b>答對 '+ok+'/'+s.items.length+'。</b>'+s.rv+'<div class="gloss">白話：'+s.gloss+'</div></div>'+cont();}
/* checklist */
function drawChk(s,i){const rows=s.items.map((it,k)=>'<div class="chk '+(state.chk[k]?'on':'')+'" onclick="tglChk('+k+')"><div class="box">✓</div><div class="lbl">'+it[0]+'<small>'+it[1]+'</small></div></div>').join('');const done=state.chk.every(Boolean);wrapScene(s.sky,tagH(s)+'<h2>'+s.h+'</h2><p class="body dim">'+s.sub+'</p>'+rows+(done&&s.rv?'<div class="rv">'+s.rv+'</div>':'')+'<div class="nx">'+(done?'<button class="cta gold" onclick="next()">繼續 →</button>':'<span class="mcap">全部勾選後繼續</span>')+'</div>');}
function tglChk(k){state.chk[k]=!state.chk[k];drawChk(S[cur],cur);}
/* montage 0.5s 快播（預載＋大日期切換＋淡入，讓換圖看得見） */
