<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>信仰的重量 · Yoda Research</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;font-family:-apple-system,'PingFang TC','Noto Sans TC',sans-serif;background:#000}
#g2{width:100%;min-height:100vh;position:relative;overflow:hidden}
.sc{width:100%;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:2.5rem 1.5rem}

.k-start{background:linear-gradient(180deg,#0a0a1a 0%,#2a0a1a 40%,#8b2500 80%,#c43a00 100%)}
.k-crash{background:linear-gradient(180deg,#1a0505 0%,#3d0a0a 40%,#7a1a1a 100%)}
.k-news{background:linear-gradient(180deg,#0d0d0d 0%,#2c1a3e 40%,#5a3a6a 100%)}
.k-blame{background:linear-gradient(180deg,#1a1a2e 0%,#3a2a4a 45%,#6a5a7a 100%)}
.k-mirror{background:linear-gradient(180deg,#1b2631 0%,#2e4057 45%,#6a8a9a 100%)}
.k-truth{background:linear-gradient(180deg,#0d1b2a 0%,#1a3a4a 45%,#3a7a8a 100%)}
.k-rebuild{background:linear-gradient(180deg,#01579b 0%,#0288d1 40%,#4fc3f7 100%)}
.k-result{background:linear-gradient(180deg,#003459 0%,#00587a 40%,#0288d1 100%)}
.k-dark{background:linear-gradient(180deg,#020408,#0a0510,#12081a)}

.mtn{position:absolute;bottom:0;left:0;right:0;height:200px;pointer-events:none}
.ov{position:relative;z-index:10;text-align:center;max-width:640px;width:100%}
.t-m{color:#fff}.t-s{color:rgba(255,255,255,0.82)}.t-l{color:rgba(255,255,255,0.5)}
.k-mirror .t-s,.k-rebuild .t-s,.k-result .t-s{color:rgba(230,245,255,0.85)}

.lbl{font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-bottom:0.5rem}
.ttl{font-size:26px;font-weight:300;margin-bottom:1rem;line-height:1.35}
.txt{font-size:15px;line-height:1.9;margin-bottom:1.5rem;max-width:520px;margin:0 auto 1.5rem;white-space:pre-line;word-break:normal;overflow-wrap:break-word;text-wrap:pretty}
.q{font-size:17px;margin-bottom:1.5rem;line-height:1.6;color:#fff;text-wrap:balance;word-break:normal;overflow-wrap:break-word}
.chs{display:flex;flex-direction:column;gap:0.75rem;width:100%;max-width:480px;margin:0 auto}
.cbtn{background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.28);color:#fff;padding:0.95rem 1.25rem;border-radius:8px;cursor:pointer;font-size:14px;line-height:1.7;text-align:left;transition:all 0.22s;backdrop-filter:blur(6px);word-break:normal;overflow-wrap:break-word}
.cbtn:hover{background:rgba(0,0,0,0.48);border-color:rgba(255,255,255,0.6);transform:translateX(4px)}
.cont{background:transparent;border:1px solid rgba(255,255,255,0.4);color:rgba(255,255,255,0.78);padding:0.6rem 2rem;border-radius:4px;cursor:pointer;font-size:13px;margin-top:1.5rem;letter-spacing:1px;transition:all 0.2s}
.cont:hover{border-color:rgba(255,255,255,0.9);color:#fff}
.tq{font-size:17px;text-align:center;max-width:400px;line-height:2.1;font-style:italic;letter-spacing:0.3px;color:rgba(230,235,255,0.85);text-wrap:balance;word-break:keep-all}

.card-wrap{perspective:1000px;width:280px;height:180px;margin:1rem auto;cursor:pointer}
.card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 0.7s}
.card.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;text-align:center}
.card-front{background:linear-gradient(135deg,rgba(255,255,255,0.15),rgba(255,255,255,0.05));border:1px solid rgba(255,255,255,0.3)}
.card-back{background:linear-gradient(135deg,rgba(0,0,0,0.5),rgba(20,20,40,0.6));border:1px solid rgba(255,255,255,0.35);transform:rotateY(180deg)}
.card-hint{font-size:12px;color:rgba(255,255,255,0.6);margin-top:0.75rem}

.sortl{max-width:400px;margin:1rem auto}
.sitem{background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.3);border-radius:8px;padding:0.85rem 1rem;margin-bottom:0.6rem;color:#fff;font-size:14px;cursor:grab;display:flex;align-items:center;gap:0.75rem;transition:border-color 0.2s,background 0.2s;user-select:none}
.sitem:active{cursor:grabbing}
.sitem.dragging{opacity:0.4}
.sitem.over{border-color:rgba(255,255,255,0.7);background:rgba(0,0,0,0.5)}
.snum{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.drag-handle{margin-left:auto;color:rgba(255,255,255,0.4)}

.sl-wrap{max-width:440px;margin:1.5rem auto}
.sl-big{font-size:44px;font-weight:200;color:#fff;margin-bottom:0.25rem}
.sl-cap{font-size:13px;color:rgba(255,255,255,0.6);margin-bottom:1.5rem}
input[type=range].sl{width:100%;-webkit-appearance:none;appearance:none;background:transparent;height:24px}
input[type=range].sl::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;cursor:pointer;margin-top:-8px;box-shadow:0 2px 6px rgba(0,0,0,0.4)}
input[type=range].sl::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:rgba(255,255,255,0.2)}
input[type=range].sl::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;cursor:pointer;border:none}

.bc{width:100%;max-width:500px;margin:0 auto}
.bi{display:flex;align-items:center;gap:1rem;margin-bottom:1.1rem}
.blab{font-size:13px;min-width:88px;text-align:right}
.bpct{font-size:14px;font-weight:500;min-width:40px;text-align:right}
input[type=range].bsl{flex:1;-webkit-appearance:none;appearance:none;background:transparent;height:20px}
input[type=range].bsl::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;cursor:pointer;margin-top:-6px;box-shadow:0 1px 5px rgba(0,0,0,0.35)}
input[type=range].bsl::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:rgba(255,255,255,0.18)}
input[type=range].bsl::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;cursor:pointer;border:none}
.btot{font-size:13px;text-align:center;margin-top:0.5rem;padding:0.45rem 1rem;border-radius:4px;display:inline-block}
.bw{color:#ffcc80;background:rgba(255,150,0,0.18)}
.bo{color:#a5d6a7;background:rgba(80,200,100,0.18)}

.ric{font-size:52px;margin-bottom:0.75rem}
.rty{font-size:24px;font-weight:300;margin-bottom:0.75rem;color:#fff}
.rd{font-size:14px;line-height:1.9;max-width:430px;margin:0 auto 1.5rem;color:rgba(230,245,255,0.85)}
.rcfg{border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:1rem 1.25rem;margin-bottom:1.5rem;max-width:340px;margin-left:auto;margin-right:auto}
.rcr{display:flex;justify-content:space-between;font-size:13px;padding:0.32rem 0;border-bottom:1px solid rgba(255,255,255,0.1)}
.rcr:last-child{border-bottom:none}
/* 雙按鈕容器 */
.twin-btn-container { display: flex; flex-direction: column; gap: 16px; align-items: center; width: 100%; max-width: 320px; margin: 1.5rem auto 1rem; }
/* 雙按鈕統一金色質感 */
.twin-btn { width: 100%; text-align: center; background: linear-gradient(135deg, #D4AF37 0%, #AA7700 100%); color: #ffffff; border: none; padding: 0.95rem 1rem; border-radius: 6px; font-size: 15px; cursor: pointer; letter-spacing: 0.5px; text-decoration: none; box-shadow: 0 4px 12px rgba(212, 175, 55, 0.25); transition: all 0.2s; box-sizing: border-box; }
.twin-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(212, 175, 55, 0.4); }
.twin-btn.copied { background: rgba(100,200,120,0.2); border: 1px solid rgba(100,200,120,0.6); color: #a5d6a7; box-shadow: none; }.progress-bar{position:fixed;top:0;left:0;height:2px;background:rgba(224,165,38,0.6);transition:width 0.4s;z-index:100}
.mute-btn{position:fixed;top:14px;right:14px;z-index:101;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.25);color:#fff;font-size:16px;cursor:pointer;backdrop-filter:blur(6px);transition:all 0.2s;display:flex;align-items:center;justify-content:center;padding:0}
.mute-btn:hover{background:rgba(0,0,0,0.55);border-color:rgba(255,255,255,0.5)}
</style>
</head>
<body>
<audio id="bgm" loop preload="auto"><source src="day_one.mp3" type="audio/mpeg"></audio>
<button id="muteBtn" class="mute-btn" onclick="toggleMute()" aria-label="音樂開關">🔊</button>
<div class="progress-bar" id="progress"></div>
<div id="g2"></div>
<script>
(function(){
const G=document.getElementById('g2');
const PB=document.getElementById('progress');

// ---- 背景音樂控制 ----
const BGM=document.getElementById('bgm');
const MUTEBTN=document.getElementById('muteBtn');
let bgmStarted=false;
let bgmMuted=false;
try{ bgmMuted = localStorage.getItem('yoda_bgm_muted')==='1'; }catch(e){}
if(BGM){ BGM.volume=0.30; }
function updateMuteIcon(){ if(MUTEBTN) MUTEBTN.textContent = bgmMuted ? '🔇' : '🔊'; }
updateMuteIcon();
function startBGM(){
  if(bgmStarted || bgmMuted || !BGM) return;
  BGM.play().then(function(){ bgmStarted=true; }).catch(function(){});
}
window.toggleMute=function(){
  bgmMuted=!bgmMuted;
  try{ localStorage.setItem('yoda_bgm_muted', bgmMuted?'1':'0'); }catch(e){}
  if(bgmMuted){ if(BGM) BGM.pause(); }
  else{ if(BGM){ BGM.play().then(function(){bgmStarted=true;}).catch(function(){}); } }
  updateMuteIcon();
};
document.addEventListener('click', startBGM, {once:false});


const CHAPTERS={
  crash:{act:'第一幕',name:'崩塌',sky:'k-crash'},
  blame:{act:'第二幕',name:'歸因',sky:'k-blame'},
  mirror:{act:'第三幕',name:'照鏡子',sky:'k-mirror'},
  truth:{act:'第四幕',name:'真相',sky:'k-truth'},
};

let st={idx:-1,scores:[],leverage:3,alloc:{cash:25,core:35,satellite:20,lev:20},flipped:false,_sortOrder:null};

function mtn(sky){
  const dark=['k-crash','k-news','k-start','k-dark','k-blame','k-truth'].includes(sky);
  const c1=dark?'rgba(10,5,15,0.9)':'rgba(20,25,50,0.45)';
  const c2=dark?'rgba(4,2,10,0.97)':'rgba(10,12,35,0.65)';
  return '<svg class="mtn" viewBox="0 0 1200 200" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><path d="M0,175 L100,92 L200,138 L320,64 L440,112 L560,44 L680,102 L800,54 L920,88 L1040,40 L1200,80 L1200,200 L0,200Z" fill="'+c1+'"/><path d="M0,205 L80,170 L180,185 L280,152 L380,172 L500,135 L620,160 L740,128 L860,152 L980,115 L1100,140 L1200,122 L1200,200 L0,200Z" fill="'+c2+'"/></svg>';
}

function fade(fn){G.style.transition='opacity 0.32s';G.style.opacity='0';setTimeout(function(){fn();G.style.opacity='1';},330);}

function updateProgress(){PB.style.width=((st.idx)/SCENES.length*100)+'%';}

const SCENES=[
  {type:'start'},
  {type:'card',ch:'crash',title:'第一擊',
   text:'2026年7月。你重壓的AI硬體部位，今天單日 -4.4%。SOXX半導體ETF領跌，你的帳戶數字紅得刺眼。\n\n這是你這輪押最重的方向。翻開卡片，看看你的帳戶。',
   front:'你的持股',frontSub:'（點擊翻開）',
   back:'單日 -4.4%\n本週累計 -11%',backSub:'槓桿讓這個數字\n變成你的 -22%',
   q:'看到這個數字的第一反應？',
   choices:['完蛋了，我是不是看錯賽道了','先冷靜，一天的波動說明不了什麼']},
  {type:'choice',ch:'crash',sky:'k-news',title:'消息面來了',
   text:'就在同一週，中東地緣消息面爆發，美伊局勢升溫。Brent油價跳漲，市場一片恐慌。財經台紅字滾動，粉專開始喊「系統性風險來了」。',
   q:'你怎麼判斷這個消息？',
   choices:['這是系統性風險的訊號，我要跟著減碼避險','這可能只是消息面雜訊，先看它有沒有改變基本面'],
   trans:'下跌不會殺死你。<br>撐不住下跌才會。'},
  {type:'sort',ch:'blame',title:'尋找戰犯',
   text:'虧損讓你難受。你開始在腦海裡尋找原因。把下面幾個「戰犯」，依照你心裡最想責怪的順序排列。',
   items:[{id:'market',label:'市場太瘋狂、不理性'},{id:'news',label:'那些唱衰的消息面'},{id:'analyst',label:'推薦我買的分析師'},{id:'self',label:'我自己的決策'}],
   trans:'找戰犯很容易。<br>承認自己更難。'},
  {type:'choice',ch:'blame',title:'你打開了財報',
   text:'冷靜下來，你去查了公司最新財報。營收成長、毛利穩定、在手訂單創新高。基本面……其實一點都沒變差。台積電外資雖然月線賣超，但獲利數字依然強勁。',
   q:'這個發現讓你？',
   choices:['更困惑了，基本面好為什麼還跌','開始意識到，也許問題不在公司'],
   trans:null},
  {type:'choice',ch:'mirror',title:'你查了總經',
   text:'你進一步查了宏觀數據。景氣循環指標顯示——擴張期還沒結束。就業穩定、消費未崩、企業獲利仍在成長軌道上。這不是衰退，這比較像是一次過熱後的估值修正。',
   q:'那麼，這波下跌的本質是？',
   choices:['市場在打估值、去槓桿，不是基本面崩壞','我不管，跌成這樣一定有大事要發生'],
   trans:'方向對了，不代表你就能活到那一天。'},
  {type:'lever',ch:'mirror',title:'那到底是什麼讓你這麼痛？',
   text:'公司沒變差。總經還在擴張。方向，其實是對的。\n\n那為什麼你這麼痛、這麼想逃？\n\n拉動下面的滑桿，誠實面對——這輪你開了多少槓桿？'},
  {type:'card2',ch:'truth',title:'平行時空',
   text:'假設一個平行時空裡的你，這次完全沒開槓桿，只用現股。同樣的下跌，翻開看看那個你現在的處境。',
   front:'沒開槓桿的你',frontSub:'（點擊翻開）',
   back:'帳面 -11%\n有點難受，但睡得著',backSub:'你會繼續持有\n因為你撐得住',
   q:'兩個版本的你，差別在哪？',
   choices:['差別不在方向，在我能不能撐到方向兌現','差別在運氣，他只是比較好運'],
   trans:'槓桿放大的不是報酬。<br>是你的情緒。'},
  {type:'choice',ch:'truth',title:'誰的問題',
   text:'方向對，公司對，循環也對。但你差點在對的方向上被洗出場。\n\n不是因為你判斷錯，而是因為你讓自己「沒有撐住的能力」。',
   q:'這是誰的問題？',
   choices:['是我的部位管理問題，不是我的判斷問題','是市場的問題，它不該這樣波動'],
   trans:null},
  {type:'choice',ch:'rebuild',title:'重新站上場',
   text:'循環還沒走完。方向還在。機會其實還在那裡。但這次，你想用什麼姿態重新站上場？',
   q:'你的選擇是？',
   choices:['降低槓桿、留足現金，用能撐住波動的方式重新配置','等全部跌完、確定安全了再進場（但那通常已經漲回去了）'],
   trans:null},
  {type:'balance',ch:'rebuild',title:'重建你的配置'},
];

function showStart(){
  st={idx:0,scores:[],leverage:3,alloc:{cash:25,core:35,satellite:20,lev:20},flipped:false,_sortOrder:null};
  PB.style.width='0%';
  G.innerHTML='<div class="sc k-start">'+mtn('k-start')+
    '<div class="ov"><div class="lbl t-l">YODA RESEARCH</div>'+
    '<div class="ttl t-m" style="font-size:32px;font-weight:200;letter-spacing:2px;margin-bottom:0.75rem">信仰的重量</div>'+
    '<div class="t-s" style="font-size:14px;font-style:italic;margin-bottom:0.4rem">當你重壓的信仰崩塌，你以為看錯了方向</div>'+
    '<div class="t-s" style="font-size:14px;font-style:italic;margin-bottom:1.5rem">但也許，錯的從來不是方向</div>'+
    '<div class="t-l" style="font-size:12px;margin-bottom:2.5rem;letter-spacing:1px">一段關於槓桿與部位的市場修行</div>'+
    '<button class="cont" style="font-size:15px;padding:0.85rem 3.5rem;letter-spacing:2px" onclick="G2.next()">進入市場</button></div></div>';
}

function render(){
  const s=SCENES[st.idx];
  if(!s){showResult();return;}
  if(s.type==='start'){showStart();return;}
  updateProgress();
  const ch=CHAPTERS[s.ch]||{};
  const sky=s.sky||ch.sky||'k-crash';
  const head='<div class="lbl t-l">'+(ch.act||'')+(ch.name?' · '+ch.name:'')+'</div><div class="ttl t-m" style="font-size:21px;margin-bottom:1rem">'+s.title+'</div>';

  if(s.type==='card'||s.type==='card2'){
    st.flipped=false;
    G.innerHTML='<div class="sc '+sky+'">'+mtn(sky)+'<div class="ov">'+head+
      '<div class="txt t-s">'+s.text+'</div>'+
      '<div class="card-wrap" onclick="G2.flip()"><div class="card" id="theCard">'+
        '<div class="card-face card-front"><div style="font-size:16px;color:#fff">'+s.front+'</div><div class="card-hint">'+s.frontSub+'</div></div>'+
        '<div class="card-face card-back"><div style="font-size:19px;color:#fff;white-space:pre-line;line-height:1.5">'+s.back+'</div><div class="card-hint" style="white-space:pre-line;margin-top:0.5rem">'+s.backSub+'</div></div>'+
      '</div></div>'+
      '<div id="cardQ" style="opacity:0;transition:opacity 0.5s"><div class="q" style="margin-top:1.5rem">'+s.q+'</div>'+
      '<div class="chs">'+s.choices.map(function(c,i){return '<button class="cbtn" onclick="G2.choose('+i+')">'+c+'</button>';}).join('')+'</div></div>'+
      '</div></div>';
  }
  else if(s.type==='choice'){
    G.innerHTML='<div class="sc '+sky+'">'+mtn(sky)+'<div class="ov">'+head+
      '<div class="txt t-s">'+s.text+'</div><div class="q">'+s.q+'</div>'+
      '<div class="chs">'+s.choices.map(function(c,i){return '<button class="cbtn" onclick="G2.choose('+i+')">'+c+'</button>';}).join('')+'</div></div></div>';
  }
  else if(s.type==='sort'){renderSort(s,sky,head);}
  else if(s.type==='lever'){renderLever(s,sky,head);}
  else if(s.type==='balance'){renderBalance();}
}

function renderSort(s,sky,head){
  if(!st._sortOrder)st._sortOrder=s.items.slice();
  G.innerHTML='<div class="sc '+sky+'">'+mtn(sky)+'<div class="ov">'+head+
    '<div class="txt t-s">'+s.text+'</div>'+
    '<div class="sortl" id="sortList">'+st._sortOrder.map(function(it,i){
      return '<div class="sitem" draggable="true" data-id="'+it.id+'"><div class="snum">'+(i+1)+'</div><span>'+it.label+'</span><span class="drag-handle">&#8942;&#8942;</span></div>';
    }).join('')+'</div>'+
    '<div class="t-l" style="font-size:12px;margin-top:0.5rem">拖曳排列，最想責怪的放最上面</div>'+
    '<button class="cont" onclick="G2.sortDone()">確定順序 ›</button></div></div>';
  bindDrag();
}
function bindDrag(){
  const list=document.getElementById('sortList');
  let dragEl=null;
  function getAfter(y){
    const els=[].slice.call(list.querySelectorAll('.sitem:not(.dragging)'));
    return els.reduce(function(closest,child){
      const box=child.getBoundingClientRect();
      const offset=y-box.top-box.height/2;
      if(offset<0&&offset>closest.offset){return {offset:offset,element:child};}
      return closest;
    },{offset:-Infinity}).element||null;
  }
  function updateOrder(){
    const ids=[].slice.call(list.querySelectorAll('.sitem')).map(function(el){return el.dataset.id;});
    st._sortOrder=ids.map(function(id){return SCENES[st.idx].items.find(function(it){return it.id===id;});});
    list.querySelectorAll('.sitem').forEach(function(el,i){el.querySelector('.snum').textContent=i+1;});
  }
  list.querySelectorAll('.sitem').forEach(function(el){
    el.addEventListener('dragstart',function(){dragEl=el;el.classList.add('dragging');});
    el.addEventListener('dragend',function(){el.classList.remove('dragging');list.querySelectorAll('.sitem').forEach(function(x){x.classList.remove('over');});updateOrder();});
    el.addEventListener('dragover',function(e){e.preventDefault();const after=getAfter(e.clientY);list.querySelectorAll('.sitem').forEach(function(x){x.classList.remove('over');});if(after==null){list.appendChild(dragEl);}else{list.insertBefore(dragEl,after);after.classList.add('over');}});
    let moved=false;
    el.addEventListener('touchstart',function(e){dragEl=el;el.classList.add('dragging');moved=false;},{passive:true});
    el.addEventListener('touchmove',function(e){e.preventDefault();moved=true;const y=e.touches[0].clientY;const after=getAfter(y);if(after==null){list.appendChild(dragEl);}else{list.insertBefore(dragEl,after);}},{passive:false});
    el.addEventListener('touchend',function(){el.classList.remove('dragging');if(moved)updateOrder();},{passive:true});
  });
}

function renderLever(s,sky,head){
  function draw(){
    const lv=st.leverage;
    const painLabel=lv<=1.5?'幾乎無痛，撐得住':lv<=2.5?'有點難受，但還好':lv<=3.5?'很痛，開始想逃':lv<=4.5?'極度痛苦，快撐不住':'瀕臨爆倉，被迫斷頭';
    const painColor=lv<=1.5?'#68d391':lv<=2.5?'#a5d6a7':lv<=3.5?'#ffcc80':lv<=4.5?'#ff8a65':'#fc8181';
    G.innerHTML='<div class="sc '+sky+'">'+mtn(sky)+'<div class="ov">'+head+
      '<div class="txt t-s">'+s.text+'</div>'+
      '<div class="sl-wrap"><div class="sl-big">'+lv.toFixed(1)+'x</div>'+
      '<div class="sl-cap">你這輪的槓桿倍數</div>'+
      '<input type="range" class="sl" min="1" max="5" step="0.5" value="'+lv+'" oninput="G2.setLever(this.value)">'+
      '<div style="margin-top:1.25rem;padding:0.75rem;border-radius:8px;background:rgba(0,0,0,0.25)"><div style="font-size:13px;color:rgba(255,255,255,0.55);margin-bottom:0.3rem">同樣 -11% 的下跌，對你的實際衝擊</div><div style="font-size:20px;font-weight:400;color:'+painColor+'">-'+Math.round(11*lv)+'%　'+painLabel+'</div></div>'+
      '</div>'+
      '<button class="cont" onclick="G2.leverDone()">我看見了 ›</button></div></div>';
  }
  window._leverDraw=draw;draw();
}

function renderBalance(){
  const items=[
    {key:'cash',label:'現金部位',color:'#e0a526'},
    {key:'core',label:'核心持股',color:'#68d391'},
    {key:'satellite',label:'衛星部位',color:'#63b3ed'},
    {key:'lev',label:'槓桿空間',color:'#fc8181'},
  ];
  function draw(){
    const total=items.reduce(function(a,it){return a+st.alloc[it.key];},0);
    const ok=total===100;
    G.innerHTML='<div class="sc k-rebuild">'+mtn('k-rebuild')+'<div class="ov">'+
      '<div class="lbl t-l">重建 · 你的新配置</div>'+
      '<div class="ttl t-m" style="font-size:22px;margin-bottom:0.75rem">重建你的配置</div>'+
      '<div class="txt t-s" style="margin-bottom:1.5rem">循環還沒走完，方向還在。這次，用一個能讓你撐住波動的方式重新配置。\n沒有標準答案，只有你撐得住的那一個。</div>'+
      '<div class="bc">'+items.map(function(it){
        return '<div class="bi"><div class="blab" style="color:'+it.color+'">'+it.label+'</div>'+
          '<input type="range" class="bsl" min="0" max="60" step="5" value="'+st.alloc[it.key]+'" style="accent-color:'+it.color+'" data-k="'+it.key+'" oninput="G2.setAlloc(this.dataset.k,this.value)">'+
          '<div class="bpct" style="color:'+it.color+'">'+st.alloc[it.key]+'%</div></div>';
      }).join('')+
      '<div style="text-align:center;margin-top:0.5rem"><span class="btot '+(ok?'bo':'bw')+'">總計：'+total+'%　'+(ok?'✓ 完成':'請調整至 100%')+'</span></div></div>'+
      (ok?'<br><button class="cont" style="margin-top:0.75rem;font-size:14px;padding:0.7rem 2.5rem" onclick="G2.showResult()">揭示我的投資人格 →</button>':'')+
      '</div></div>';
  }
  window._balDraw=draw;draw();
}

function calcPersonality(){
  const get=function(r){var f=st.scores.find(function(x){return x.round===r;});return f?f.choice:0;};
  const lv=st.leverage;
  const blameSelf=st._sortOrder&&st._sortOrder[0]&&st._sortOrder[0].id==='self';
  const s8=get(8),s9=get(9);
  const mature=(s8===0?1:0)+(s9===0?1:0)+(blameSelf?1:0);
  // 定錨型: 低槓桿 + 高成熟度
  if(lv<=2.5 && mature>=2)return {icon:'⚓',name:'定錨型',desc:'你把方向、部位、現金都納入了考量。你理解了最重要的一課：對的方向，也要有撐到兌現的能力。你已經不容易被單次波動洗出場了。<br><br>下一步：維持這個紀律。你的系統已經有了錨，剩下的是持續執行。'};
  // 賭徒型: 高槓桿 + 低成熟度
  if(lv>=4 && mature<=1)return {icon:'🎢',name:'賭徒型',desc:'你的方向其實常常是對的——但你用槓桿把每一次波動都放大成生死關頭。方向對卻死在部位，是最可惜的輸法。<br><br>下一步：先把槓桿降到你「跌一半也睡得著」的水位。活得夠久，方向才有意義。'};
  // 學習者型: 有覺察(承認部位問題)，但還沒完全落實
  if(s8===0 || blameSelf)return {icon:'🧗',name:'學習者型',desc:'你開始意識到，這次的痛不是因為看錯方向，而是部位管理出了問題。這個覺察，是從賭徒走向系統的關鍵一步。<br><br>下一步：把「部位大小」和「方向判斷」當成兩件獨立的事來練習。你已經在正確的路上。'};
  // 驚弓型: 沒有覺察 + 選擇退場等待
  if(s9===1)return {icon:'😰',name:'驚弓型',desc:'這次的痛把你嚇怕了，你開始想「等全部安全了再進場」。但市場的殘忍在於，等你確定安全時，機會通常已經走了。<br><br>下一步：問題不是「進或不進」，而是「用多大部位進」。用小倉位重新建立信心，比空手等待更有用。'};
  // 其餘歸為學習者型
  return {icon:'🧗',name:'學習者型',desc:'你開始意識到，這次的痛不是因為看錯方向，而是部位管理出了問題。這個覺察，是從賭徒走向系統的關鍵一步。<br><br>下一步：把「部位大小」和「方向判斷」當成兩件獨立的事來練習。你已經在正確的路上。'};
}

function showResult(){
  PB.style.width='100%';
  const p=calcPersonality();
  const a=st.alloc;
  const items=[ {key:'cash',label:'現金部位',color:'#e0a526'}, {key:'core',label:'核心持股',color:'#68d391'}, {key:'satellite',label:'衛星部位',color:'#63b3ed'}, {key:'lev',label:'槓桿空間',color:'#fc8181'} ];

  // 【黃金四拍】動態溫度文案
  const topBtnText = (p.name === '賭徒型' || p.name === '驚弓型') ? '學習槓桿與部位管理的生存之道' : '來 Yoda 獲取更精準的部位管理策略';
  const bottomBtnText = '把這份覺察，分享給同樣在迷惘的朋友';

  G.innerHTML='<div class="sc k-result" style="padding:3rem 1.5rem;min-height:100vh">'+mtn('k-result')+'<div class="ov">'+
    '<div class="lbl t-l" style="margin-bottom:1rem">你的修行結果</div>'+
    '<div class="ric">'+p.icon+'</div><div class="rty">'+p.name+'</div>'+
    '<div class="rd">'+p.desc+'</div>'+
    '<div class="rcfg"><div style="font-size:11px;letter-spacing:2px;color:rgba(255,255,255,0.4);margin-bottom:0.6rem">你重建後的配置</div>'+
      items.map(function(it){return '<div class="rcr"><span class="t-s" style="font-size:13px">'+it.label+'</span><span style="color:'+it.color+';font-weight:500">'+a[it.key]+'%</span></div>';}).join('')+
      '<div class="rcr" style="margin-top:0.3rem"><span class="t-s" style="font-size:13px">最終槓桿</span><span style="color:#fc8181;font-weight:500">'+st.leverage.toFixed(1)+'x</span></div>'+
    '</div>'+
    '<div class="t-s" style="font-size:13px;line-height:1.9;margin-bottom:1.25rem;max-width:400px;margin-left:auto;margin-right:auto">循環還沒走完，方向還在。Yoda Research 每週追蹤總經循環、板塊輪動與部位風險，陪你走完這一輪。</div>'+
    
    // 直列雙按鈕
    '<div class="twin-btn-container">'+
      '<a class="twin-btn" href="https://yoda-research-next.vercel.app/" target="_blank" rel="noopener">'+topBtnText+'</a>'+
      '<button class="twin-btn" id="shareBtn" onclick="G2.share(\''+bottomBtnText+'\')">'+bottomBtnText+'</button>'+
    '</div>'+
    
    '<div style="margin-top:0.9rem"><button class="cont" style="font-size:12px;opacity:0.6" onclick="G2.restart()">重新開始</button></div>'+
    '<div id="shareFeedback" style="font-size:12px;color:rgba(160,220,255,0.7);margin-top:0.6rem;height:18px;transition:opacity 0.3s"></div>'+
    '<div style="font-size:11px;color:rgba(255,255,255,0.35);margin-top:1.5rem">背景音樂 by <a href="https://www.youtube.com/@BiBiPiano" target="_blank" style="color:rgba(224,165,38,0.6);text-decoration:none">BiBiPiano</a>，版權為原作者所有</div>'+
  '</div></div>';
}
function showTrans(text){
  G.innerHTML='<div class="sc k-dark">'+mtn('k-dark')+'<div class="ov"><div class="tq">'+text+'</div>'+
    '<button class="cont" onclick="G2.afterTrans()">繼續 ›</button></div></div>';
}

function advance(){st.idx++;if(st.idx>=SCENES.length){fade(showResult);return;}fade(render);}

window.G2={
  next:function(){st.idx=1;fade(render);},
  flip:function(){if(st.flipped)return;st.flipped=true;var c=document.getElementById('theCard');if(c)c.classList.add('flipped');setTimeout(function(){var q=document.getElementById('cardQ');if(q)q.style.opacity='1';},600);},
  choose:function(i){st.scores.push({round:st.idx,choice:i});var s=SCENES[st.idx];if(s.trans){fade(function(){showTrans(s.trans);});}else{advance();}},
  sortDone:function(){var s=SCENES[st.idx];if(s.trans){fade(function(){showTrans(s.trans);});}else{advance();}},
  setLever:function(v){st.leverage=parseFloat(v);window._leverDraw&&window._leverDraw();},
  leverDone:function(){advance();},
  setAlloc:function(k,v){st.alloc[k]=parseInt(v);window._balDraw&&window._balDraw();},
  showResult:function(){fade(showResult);},
  afterTrans:function(){advance();},
  restart:function(){fade(showStart);},
  share: function(originalText){
    var url=window.location.href.split('?')[0];
    var text='我剛玩完《信仰的重量》——一個關於槓桿、部位與投資人性的互動體驗。你也來測測看你是哪種投資人格？';
    var btn=document.getElementById('shareBtn'), fb=document.getElementById('shareFeedback');
    if(navigator.share){ navigator.share({title:'信仰的重量 · Yoda Research',text:text,url:url}).catch(function(){}); return; }
    navigator.clipboard.writeText(url).then(function(){
      btn.classList.add('copied'); btn.innerHTML='&#10003; 網址已複製';
      fb.textContent='貼到 LINE、Facebook 或任何地方分享吧'; fb.style.opacity='1';
      setTimeout(function(){ btn.classList.remove('copied'); btn.innerHTML=originalText; fb.style.opacity='0'; },3000);
    }).catch(function(){
      fb.textContent='請手動複製網址分享！'; fb.style.opacity='1'; setTimeout(function(){fb.style.opacity='0';},3000);
    });
  }
};

showStart();
})();
</script>
